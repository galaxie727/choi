<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2コマ反応テスト</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 12px;
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      background: #000;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 14px 10px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;
    }

    .note {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <img id="girl" src="base1.png" alt="girl">

    <div class="choices">
      <button data-choice="はい">はい</button>
      <button data-choice="いいえ">いいえ</button>
      <button data-choice="チー">チー</button>
      <button data-choice="ギュウ">ギュウ</button>
    </div>

    <div class="note">
      押す → 一拍 → 表情が一瞬変わるかも → 何も言われない
    </div>
  </div>
</div>

<script>
  /* ====== 設定 ====== */

  const baseSrc = "base1.png";

  // ウインク候補
  const reactions = [
    { src: "winkB.png", weight: 30 }, // 標準
    { src: "winkC.png", weight: 20 }, // 照れ
    { src: "winkD.png", weight: 20 }, // 視線
    { src: "winkE.png", weight: 10 }, // 一瞬
    { src: null,        weight: 20 }  // 反応なし
  ];

  const BEAT_MS = 180;   // 一拍
  const WINK_MS = 400;  // 通常表示時間
  const SHORT_MS = 220; // winkE or 無反応用

  /* ====== 初期化 ====== */

  const img = document.getElementById("girl");
  const buttons = document.querySelectorAll("button");
  let busy = false;

  // 画像プリロード
  [baseSrc, ...reactions.map(r => r.src).filter(Boolean)]
    .forEach(src => { const i = new Image(); i.src = src; });

  function disableButtons(v) {
    buttons.forEach(b => b.disabled = v);
  }

  /* ====== ユーティリティ ====== */

  function weightedRandom(list) {
    const total = list.reduce((s, i) => s + i.weight, 0);
    let r = Math.random() * total;
    for (const item of list) {
      if ((r -= item.weight) <= 0) return item;
    }
    return list[0];
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  /* ====== メイン反応 ====== */

  async function react(choice) {
    if (busy) return;
    busy = true;
    disableButtons(true);

    console.log("choice:", choice);

    // 一拍
    await sleep(BEAT_MS);

    const reaction = weightedRandom(reactions);

    // 反応なし
    if (!reaction.src) {
      await sleep(SHORT_MS);
    } else {
      img.src = reaction.src;
      await sleep(
        reaction.src === "winkE.png" ? SHORT_MS : WINK_MS
      );
      img.src = baseSrc;
    }

    disableButtons(false);
    busy = false;
  }

  /* ====== イベント ====== */

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      react(btn.dataset.choice);
    });
  });
</script>
</body>
</html>
