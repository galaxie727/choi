<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>チーと言えばギュウと答える</title>
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --ui-pad-x: 18px;
      --ui-pad-y: 14px;

      --glass: rgba(255,255,255,0.16);
      --glass-strong: rgba(255,255,255,0.22);
      --glass-border: rgba(255,255,255,0.25);

      --text: #fff;
      --shadow: rgba(0,0,0,0.35);

      --btn1: #E2473C;   /* 赤 */
      --btn2: #1E86C8;   /* 青 */
      --btn3: #F2C200;   /* 黄 */
      --btnGray: rgba(255,255,255,0.18);

      --accent: #ffd54a;

      --icon-frame: 8px;           /* 枠の統一（ここがポイント） */
      --icon-radius: 18px;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      color: var(--text);
      background:#000;
      overflow:hidden;
      touch-action: manipulation;
    }

    /* ===== 共通：背景 ===== */
    .app{
      position:relative;
      width:100%;
      height:100%;
    }
    .bg{
      position:absolute;
      inset:0;
      background:#000 center/cover no-repeat;
      filter: none;
      transform: translateZ(0);
    }
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.25));
      pointer-events:none;
    }

    /* ===== 上部バー ===== */
    .topbar{
      position:absolute;
      left:0; right:0;
      top:0;
      padding-top: calc(var(--safe-top) + 10px);
      padding-left: 14px;
      padding-right: 14px;
      padding-bottom: 10px;
      background: rgba(0,0,0,0.55);
      display:flex;
      align-items:center;
      justify-content:space-between;
      z-index:20;
      letter-spacing: .04em;
      font-weight: 700;
    }
    .topbar .left{
      font-size: 15px;
      opacity:.95;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 70%;
    }
    .topbar .right{
      font-size: 15px;
      opacity:.95;
      white-space:nowrap;
    }

    /* ===== 画面（セクション） ===== */
    .screen{
      position:absolute;
      inset:0;
      display:none;
      z-index:10;
    }
    .screen.active{ display:block; }

    /* ===== 中央UI（メニュー位置を下げる） ===== */
    .center-ui{
      position:absolute;
      left:0; right:0;
      /* ★ここで下げる：top を大きくするほど下がる */
      top: 60%;
      transform: translateY(-50%);
      padding: 0 var(--ui-pad-x);
      z-index:15;
      text-align:center;
    }

    /* 画面によって “もう少し下げたい” とき用 */
    .center-ui.lower{ top: 64%; } /* 必要ならここを66%とかに */

    .h1{
      font-size: 34px;
      font-weight: 900;
      text-shadow: 0 6px 18px var(--shadow);
      letter-spacing: .08em;
      margin: 0 0 10px;
    }
    .subnote{
      font-size: 14px;
      opacity: .85;
      text-shadow: 0 6px 18px var(--shadow);
      margin-top: 8px;
    }

    .glass{
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }

    .btn{
      width: 100%;
      max-width: 520px;
      margin: 14px auto 0;
      padding: 18px 16px;
      border-radius: 16px;
      border: none;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing:.08em;
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px); }

    .btn.red{ background: var(--btn1); }
    .btn.blue{ background: var(--btn2); }
    .btn.yellow{ background: var(--btn3); color:#1a1a1a; }
    .btn.gray{ background: var(--btnGray); border: 1px solid rgba(255,255,255,0.2); }

    .btn.small{
      font-size: 18px;
      padding: 14px 14px;
      border-radius: 14px;
    }

    /* ===== VERSION（長押しでデバッグON） ===== */
    .version{
      position:absolute;
      left:0; right:0;
      bottom: calc(var(--safe-bottom) + 14px);
      text-align:center;
      font-weight: 900;
      letter-spacing:.18em;
      opacity:.85;
      text-shadow: 0 8px 20px rgba(0,0,0,0.45);
      z-index:20;
      user-select:none;
    }

    /* ===== 女の子選択 ===== */
    .select-wrap{
      position:absolute;
      left:0; right:0;
      top: 52%;
      transform: translateY(-50%);
      padding: 0 var(--ui-pad-x);
      z-index:15;
    }
    .select-title{
      font-size: 34px;
      font-weight: 900;
      text-align:center;
      text-shadow: 0 8px 20px rgba(0,0,0,0.4);
      margin-bottom: 14px;
      letter-spacing:.08em;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 18px;
      margin: 0 auto;
      max-width: 720px;
    }

    .girl-card{
      text-align:center;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-frame{
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--icon-radius);
      padding: var(--icon-frame); /* ★枠はCSSで統一 */
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
      overflow:hidden;
      position:relative;
    }
    .icon-inner{
      width:100%;
      height:100%;
      border-radius: calc(var(--icon-radius) - var(--icon-frame));
      background: rgba(255,255,255,0.15);
      overflow:hidden;
      position:relative;
    }
    .icon-inner img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .locked-badge{
      position:absolute;
      left:50%;
      top:10px;
      transform: translateX(-50%);
      padding: 6px 14px;
      font-weight: 900;
      letter-spacing:.08em;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.20);
      font-size: 16px;
    }

    .girl-name{
      margin-top: 10px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing:.08em;
      text-shadow: 0 8px 20px rgba(0,0,0,0.35);
      color: #4bb0ff;
    }
    .girl-name.locked{
      opacity:.65;
      color: #4bb0ff;
    }

    .girl-card.selected .icon-frame{
      outline: 3px solid rgba(255,255,255,0.55);
      outline-offset: 2px;
    }

    .select-footer{
      display:flex;
      gap: 18px;
      max-width: 720px;
      margin: 20px auto 0;
    }
    .select-footer .btn{ margin:0; }

    /* ===== モード選択 ===== */
    .mode-title{
      font-size: 34px;
      font-weight: 900;
      text-align:center;
      text-shadow: 0 8px 20px rgba(0,0,0,0.4);
      margin: 0 0 6px;
      letter-spacing:.08em;
    }
    .mode-sub{
      text-align:center;
      font-size: 18px;
      font-weight: 800;
      opacity:.9;
      margin-bottom: 14px;
      text-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    /* オールスター説明（煽り版） */
    .allstar-card{
      margin: 10px auto 12px;
      max-width: 520px;
      padding: 14px 16px;
      text-align:left;
      line-height:1.45;
    }
    .allstar-card .t{
      font-weight: 1000;
      letter-spacing:.06em;
      margin-bottom: 6px;
    }
    .allstar-card .note{
      opacity:.9;
      font-size: 14px;
    }

    .toggle-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-top: 10px;
    }
    .toggle{
      width: 62px;
      height: 34px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.22);
      position:relative;
      cursor:pointer;
      flex: none;
    }
    .toggle::after{
      content:"";
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      position:absolute;
      top: 2px;
      left: 2px;
      transition: .18s ease;
    }
    .toggle.on{
      background: rgba(255,213,74,0.35);
      border-color: rgba(255,213,74,0.45);
    }
    .toggle.on::after{ left: 32px; }
    .toggle.disabled{ opacity:.45; cursor:not-allowed; }

    /* ===== ゲーム中：吹き出し ===== */
    #speech{
      position:absolute;
      left: 12px;
      right: 12px;
      top: calc(var(--safe-top) + 74px);
      z-index:25;
      padding: 14px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.16); /* ★下地 */
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-shadow: 0 8px 18px rgba(0,0,0,0.35);
      font-weight: 900;
      font-size: 26px;

      /* ★切れにくくする */
      white-space: normal;
      overflow: visible;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.22;
      max-height: 38vh;
    }
    #speech.hidden{ display:none; }

    /* チー娘登場！！ */
    #chiIntro{
      position:absolute;
      left: 12px;
      right: 12px;
      top: calc(var(--safe-top) + 88px);
      z-index:26;
      text-align:center;
      font-weight: 1000;
      font-size: 34px;
      letter-spacing:.08em;
      text-shadow: 0 10px 22px rgba(0,0,0,0.5);
      padding: 14px 10px;
      border-radius: 18px;
      background: rgba(0,0,0,0.35); /* ★見えるように下地 */
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display:none;
    }

    /* ===== 結果 ===== */
    .result-wrap{
      position:absolute;
      left:0; right:0;
      top: 58%;
      transform: translateY(-50%);
      padding: 0 var(--ui-pad-x);
      z-index:15;
    }
    .result-line{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
      padding: 6px 4px 10px;
      text-shadow: 0 10px 22px rgba(0,0,0,0.45);
    }
    .result-label{
      font-size: 26px;
      font-weight: 1000;
      letter-spacing:.06em;
      opacity:.95;
    }
    .result-score{
      font-size: 86px; /* ←「80をもう少し大きく」の方向性はここ */
      font-weight: 1100;
      letter-spacing:.02em;
    }

    /* ===== デバッグパネル ===== */
    .debug{
      position:absolute;
      left:12px; right:12px;
      bottom: calc(var(--safe-bottom) + 64px);
      z-index:30;
      padding: 12px 14px;
      display:none;
    }
    .debug .row{
      display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    }
    .debug .mini{
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.35);
      color:#fff;
      font-weight: 900;
      letter-spacing:.04em;
      cursor:pointer;
    }
    .debug .mini:active{ transform: translateY(1px); }

  </style>
</head>

<body>
<div class="app">
  <div class="bg" id="bg"></div>

  <div class="topbar">
    <div class="left" id="topbarLeft">チーと言えばギュウと答える</div>
    <div class="right" id="topbarRight">-</div>
  </div>

  <!-- 吹き出し（ゲーム/演出共通） -->
  <div id="speech" class="hidden"></div>
  <div id="chiIntro">チー娘登場！！</div>

  <!-- デバッグ -->
  <div class="debug glass" id="debugPanel">
    <div style="font-weight:1000; letter-spacing:.06em; text-align:center; margin-bottom:8px;">DEBUG</div>
    <div class="row">
      <button class="mini" id="dbgUnlockGirls">課金キャラ解除(D/E/F)</button>
      <button class="mini" id="dbgUnlockAllStar">AllStar解放</button>
      <button class="mini" id="dbgReset">リセット</button>
      <button class="mini" id="dbgClose">閉じる</button>
    </div>
  </div>

  <!-- ========== TOP ========== -->
  <section class="screen active" id="screenTop">
    <div class="center-ui lower">
      <div class="h1">ガチ！チー牛診断！！</div>

      <button class="btn gray" id="btnStartTop">START</button>
      <div class="subnote">※45問目は「ギュウ」以外でゲームオーバー</div>
    </div>

    <div class="version" id="versionText">VERSION v0.30.2</div>
  </section>

  <!-- ========== 女の子選択 ========== -->
  <section class="screen" id="screenGirlSelect">
    <div class="select-wrap">
      <div class="select-title">女の子を選んでね</div>

      <div class="grid" id="girlGrid"></div>

      <div class="select-footer">
        <button class="btn gray small" id="btnBackToTop">戻る</button>
        <button class="btn yellow small" id="btnGoModeSelect">次へ</button>
      </div>
    </div>
  </section>

  <!-- ========== モード選択 ========== -->
  <section class="screen" id="screenModeSelect">
    <div class="center-ui lower">
      <div class="mode-title">モードを選んでね</div>
      <div class="mode-sub" id="bestStageText">チー娘 BEST：ステージ0</div>

      <div class="allstar-card glass">
        <div class="t">ちょい煽り版（おすすめ）</div>
        <div>
          オールスターモードを解放すると<br>
          <b>すべての解放済み女の子がランダムで登場</b>します。
        </div>
        <div class="note" style="margin-top:8px;">
          ※エンディングは <b>選択中の女の子固定</b> です
        </div>

        <div class="toggle-row" style="margin-top:10px;">
          <div style="font-weight:1000; letter-spacing:.04em;">オールスターモード</div>
          <div class="toggle" id="toggleAllStar" title="AllStar"></div>
        </div>
        <div class="note" id="allStarLockNote" style="margin-top:8px; display:none;">
          （未解放）※課金想定：480円くらい
        </div>
      </div>

      <button class="btn gray" id="btnNormalMode">チー牛診断</button>
      <button class="btn gray" id="btnChiMode">チー娘モード</button>
      <button class="btn gray small" id="btnBackToGirlSelect">女の子選択に戻る</button>
    </div>
  </section>

  <!-- ========== RESULT ========== -->
  <section class="screen" id="screenResult">
    <div class="result-wrap">
      <div class="result-line">
        <div class="result-label" id="resultLabel">あなたのチー牛度は</div>
        <div class="result-score"><span id="resultScore">80</span><span style="font-size:.6em;">%</span></div>
      </div>

      <!-- 女の子の一言（表示されない問題対策で専用枠） -->
      <div id="resultOneLiner" class="glass" style="max-width:520px;margin:10px auto 0;padding:12px 14px;font-weight:1000;letter-spacing:.04em;text-shadow:0 10px 22px rgba(0,0,0,0.35);">
        …
      </div>

      <button class="btn red" id="btnRetry">もう一回</button>
      <button class="btn blue" id="btnToTop">トップに戻る</button>
    </div>
  </section>

  <!-- ========== GAME OVER（チー娘） ========== -->
  <section class="screen" id="screenGameOver">
    <div class="center-ui lower">
      <button class="btn yellow" id="btnRetryChi">もう一回</button>
      <button class="btn blue" id="btnToTopFromGO">トップに戻る</button>
    </div>
  </section>

</div>

<script>
/* =========================================================
   設定
========================================================= */
const VERSION = "v0.30.2";

/* 画像ファイル名はここで管理（必要ならあなたの実ファイル名に合わせて変更） */
const GIRLS = [
  { id:"A", name:"Girl A", locked:false, top:"girlA_top_01.png", icon:"girlA_icon.png" },
  { id:"B", name:"Girl B", locked:false, top:"girlB_top_01.png", icon:"girlB_icon.png" },
  { id:"C", name:"Girl C", locked:false, top:"girlC_top_01.png", icon:"girlC_icon.png" },
  { id:"D", name:"Girl D", locked:true,  top:"girlD_top_01.png", icon:"girlD_icon.png" },
  { id:"E", name:"Girl E", locked:true,  top:"girlE_top_01.png", icon:"girlE_icon.png" },
  { id:"F", name:"Girl F", locked:true,  top:"girlF_top_01.png", icon:"girlF_icon.png" },
];

const TOP_BG = "top_keyvisual_01.png"; // ★今回のトップ画像

/* =========================================================
   便利関数
========================================================= */
const $ = (q)=>document.querySelector(q);
const $$ = (q)=>[...document.querySelectorAll(q)];
const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));

function showScreen(id){
  $$(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}

function setBg(img){
  $("#bg").style.backgroundImage = `url("${img}")`;
}

function setTopbar(rightText){
  $("#topbarRight").textContent = rightText || "-";
}

function isDebugEnabled(){
  const u = new URL(location.href);
  return u.searchParams.get("debug") === "1" || localStorage.getItem("debug") === "1";
}

function enableDebug(){
  localStorage.setItem("debug","1");
  $("#debugPanel").style.display = "block";
}

function disableDebug(){
  localStorage.removeItem("debug");
  $("#debugPanel").style.display = "none";
}

function getState(){
  return {
    selectedGirlId: localStorage.getItem("selectedGirlId") || "A",
    unlockedGirls: JSON.parse(localStorage.getItem("unlockedGirls") || "[]"), // ["D","E","F"]
    bestStage: parseInt(localStorage.getItem("bestStage") || "0",10),
    allStarUnlocked: localStorage.getItem("allStarUnlocked") === "1",
    allStarOn: localStorage.getItem("allStarOn") === "1",
    starsSeen: JSON.parse(localStorage.getItem("starsSeen") || "{}"), // {A:true ...} チギュテッド見た印
  };
}
function setState(patch){
  const s = getState();
  const n = { ...s, ...patch };
  localStorage.setItem("selectedGirlId", n.selectedGirlId);
  localStorage.setItem("unlockedGirls", JSON.stringify(n.unlockedGirls));
  localStorage.setItem("bestStage", String(n.bestStage));
  localStorage.setItem("allStarUnlocked", n.allStarUnlocked ? "1":"0");
  localStorage.setItem("allStarOn", n.allStarOn ? "1":"0");
  localStorage.setItem("starsSeen", JSON.stringify(n.starsSeen));
  return n;
}

function isGirlUnlocked(girlId){
  const s = getState();
  const base = GIRLS.find(g=>g.id===girlId);
  if (!base) return false;
  if (!base.locked) return true;
  return s.unlockedGirls.includes(girlId);
}

function getSelectedGirl(){
  const s = getState();
  return GIRLS.find(g=>g.id===s.selectedGirlId) || GIRLS[0];
}

/* =========================================================
   画面：TOP
========================================================= */
$("#versionText").textContent = `VERSION ${VERSION}`;

/* VERSION 長押しでデバッグ */
let pressTimer = null;
$("#versionText").addEventListener("touchstart", ()=>{
  pressTimer = setTimeout(()=>{ enableDebug(); }, 650);
},{passive:true});
$("#versionText").addEventListener("touchend", ()=>{ clearTimeout(pressTimer); });

$("#btnStartTop").addEventListener("click", ()=>{
  // トップの背景
  setBg(getSelectedGirl().top); // とりあえず選択中の子にしておく
  setTopbar("-");
  renderGirlSelect();
  showScreen("#screenGirlSelect");
});

/* =========================================================
   画面：女の子選択
   - 触れた背景が「保持」される（離しても戻らない）
   - locked でも背景は表示する
========================================================= */
function renderGirlSelect(){
  const grid = $("#girlGrid");
  grid.innerHTML = "";

  const s = getState();
  const selectedId = s.selectedGirlId;

  // 最初の背景（選択中の子）
  const selectedGirl = GIRLS.find(g=>g.id===selectedId) || GIRLS[0];
  setBg(selectedGirl.top);

  GIRLS.forEach(g=>{
    const unlocked = isGirlUnlocked(g.id);
    const card = document.createElement("div");
    card.className = "girl-card" + (g.id===selectedId ? " selected" : "");
    card.dataset.girlId = g.id;

    const frame = document.createElement("div");
    frame.className = "icon-frame";

    const inner = document.createElement("div");
    inner.className = "icon-inner";

    const img = document.createElement("img");
    img.src = g.icon;
    img.alt = g.name;

    // 画像が無い場合の保険（真っ黒回避）
    img.onerror = ()=>{ img.style.display="none"; inner.style.display="flex"; inner.style.alignItems="center"; inner.style.justifyContent="center"; inner.style.fontWeight="1000"; inner.style.fontSize="28px"; inner.textContent = g.id; };

    inner.appendChild(img);
    frame.appendChild(inner);

    if(!unlocked){
      const badge = document.createElement("div");
      badge.className = "locked-badge";
      badge.textContent = "LOCK";
      frame.appendChild(badge);
    }

    const name = document.createElement("div");
    name.className = "girl-name" + (!unlocked ? " locked" : "");
    name.textContent = g.name;

    card.appendChild(frame);
    card.appendChild(name);

    // ★ポイント：タッチ/ホバーで背景更新、離しても戻さない
    const onTouchOrHover = (ev)=>{
      ev.preventDefault?.();
      setBg(g.top);
      // 選択できるのは unlocked のみ
      if(unlocked){
        setState({ selectedGirlId: g.id });
        // 見た目の選択枠更新
        $$(".girl-card").forEach(c=>c.classList.remove("selected"));
        card.classList.add("selected");
      }
    };

    // iPhone: touchstart が確実
    card.addEventListener("touchstart", onTouchOrHover, {passive:false});
    // PC/デバッグ用
    card.addEventListener("mouseenter", onTouchOrHover);

    grid.appendChild(card);
  });
}

function openModeSelect(){
  const g = getSelectedGirl();
  setBg(g.top);
  setTopbar("-");
  const s = getState();
  $("#bestStageText").textContent = `チー娘 BEST：ステージ${s.bestStage}`;

  // オールスターUI
  const toggle = $("#toggleAllStar");
  const lockNote = $("#allStarLockNote");
  const unlocked = s.allStarUnlocked || isDebugEnabled();

  toggle.classList.toggle("disabled", !unlocked);
  lockNote.style.display = unlocked ? "none" : "block";

  // ON/OFF状態
  const on = (s.allStarOn && unlocked);
  toggle.classList.toggle("on", on);

  showScreen("#screenModeSelect");
}

});

$("#toggleAllStar").addEventListener("click", ()=>{
  const s = getState();
  const unlocked = s.allStarUnlocked || isDebugEnabled();
  if(!unlocked) return;

  const next = !s.allStarOn;
  setState({ allStarOn: next });
  $("#toggleAllStar").classList.toggle("on", next);
});

========================================================= */
$("#btnNormalMode").addEventListener("click", async ()=>{

/* =========================================================
   診断モード（簡易版）
   - ここはあなたの既存ロジックに置き換えOK
   - 今は「UI動作確認用」に最小で組んである
========================================================= */
async function runDiagnosis(){
  const s = getState();
  const selected = getSelectedGirl();

  // AllStar ONなら登場キャラをランダム（演出だけ）
  const unlockedGirls = GIRLS.filter(g=>isGirlUnlocked(g.id) || !g.locked);
  const pool = (s.allStarOn ? unlockedGirls : [selected]);
  const cameo = pool[Math.floor(Math.random()*pool.length)];
  setBg(cameo.top);

  setTopbar("RESULT");
  $("#speech").classList.add("hidden");

  // 仮スコア（あなたの採点に差し替え前提）
  const score = 50 + Math.floor(Math.random()*51); // 50-100
  $("#resultScore").textContent = String(score);

  // 女の子の一言（表示されない問題対策）
  $("#resultOneLiner").textContent = (score>=90) ? "ギュウ" : (score>=70 ? "……" : "（無言）");

  // チギュテッド判定（仮：100だけ）
  const isGifted = (score === 100);
  if(isGifted){
    // 「星＝チギュテッド見た」保存
    const st = getState();
    const stars = {...st.starsSeen};
    stars[selected.id] = true;
    setState({ starsSeen: stars });
  }

  showScreen("#screenResult");
}

/* =========================================================
   チー娘モード（簡易版）
   - セリフ切れ対策済み（#speech）
   - 「チー娘登場！！」下地あり
========================================================= */
async function runChiMode(){
  const st = getState();
  const selected = getSelectedGirl();

  setTopbar("-");
  // AllStar：登場はランダム、エンディングは選択中固定（今回は演出だけ）
  const unlockedGirls = GIRLS.filter(g=>isGirlUnlocked(g.id) || !g.locked);
  const pool = (st.allStarOn ? unlockedGirls : [selected]);

  // intro
  $("#chiIntro").style.display = "block";
  await sleep(850);
  $("#chiIntro").style.display = "none";

  let stage = 1;
  while(true){
    // 登場キャラ（背景だけランダム）
    const cameo = pool[Math.floor(Math.random()*pool.length)];
    setBg(cameo.top);
    setTopbar(`ステージ${stage}`);

    // セリフ（長文でも切れにくい）
    const speech = `（チー娘${cameo.id}：ステージ${stage}…気を抜くと…すぐ…やられる…よ）`;
    $("#speech").textContent = speech;
    $("#speech").classList.remove("hidden");

    // 仮の判定：たまにゲームオーバー
    await sleep(700);
    const fail = Math.random() < 0.18;

    if(fail){
      $("#speech").textContent = `……（チー娘${cameo.id}：見なかったことにするね）`;
      setTopbar(`GAME OVER（ステージ${stage}）`);
      await sleep(450);
      $("#speech").classList.add("hidden");

      // best更新
      const cur = getState();
      if(stage > cur.bestStage){
        setState({ bestStage: stage });
      }
      showScreen("#screenGameOver");
      return;
    }

    stage++;
    if(stage>=25){
      // 仮クリア
      $("#speech").textContent = `……（チー娘：ここまで来たのは…すごい…）`;
      await sleep(850);
      $("#speech").classList.add("hidden");
      // クリア画像（あるならここで差し替え）
      // setBg(`girl${selected.id}_clear_01.png`);
      setTopbar("RESULT");
      $("#resultScore").textContent = String(80 + Math.floor(Math.random()*21));
      $("#resultOneLiner").textContent = "ギュウ";
      showScreen("#screenResult");
      return;
    }
  }
}
