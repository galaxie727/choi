<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チーと言えばギュウと答える</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
.app{
  max-width:560px;
  margin:0 auto;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* header */
header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:700;
}

/* screens */
.screen{flex:1;position:relative;overflow:hidden}
.screen.hide{display:none}
.bg{
  position:absolute; inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.02);
  transition:transform .35s ease, filter .35s ease;
}
.overlay{
  position:absolute; inset:0;
  padding:16px;
  display:flex;
  flex-direction:column;
}

/* 共通パネル */
.panel{
  width:100%;
  margin-top:84px;
  text-align:center;
  text-shadow:0 10px 28px rgba(0,0,0,.75);
}
.h1{
  font-size:18px;
  font-weight:900;
  letter-spacing:.14em;
  margin:0 0 18px;
}
.btn{
  width:min(420px, 100%);
  padding:14px 18px;
  border:none;
  border-radius:14px;
  background:#ffffff22;
  color:#fff;
  font-weight:900;
  font-size:18px;
}
.btnRow{
  display:flex;
  gap:12px;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  margin-top:14px;
}
.btnSmall{
  width:min(420px, 100%);
  padding:12px 16px;
  border:none;
  border-radius:12px;
  background:#ffffff18;
  color:#fff;
  font-weight:900;
  font-size:14px;
  opacity:.95;
}

/* ロゴ（透過PNG） */
.topLogo{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%) scale(1.05);
  width:min(720px, 98%);
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.75));
  pointer-events:none;
  z-index:2;
}

/* 女の子選択 */
.girlSelectRow{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin:16px auto 10px;
  max-width:520px;
}
.girlCard{
  padding:14px 10px;
  border-radius:14px;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.00);
  font-weight:900;
  letter-spacing:.10em;
}
.girlCard.active{
  border-color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.14);
}
.note{
  font-size:12px;
  opacity:.9;
  letter-spacing:.08em;
  margin-top:10px;
}

/* GAME */
#gameScreen .overlay{
  flex-direction:column;
  justify-content:space-between;
}

#gameScreen.chee .bg{transform:scale(1.12)}
#gameScreen.hold .bg{filter:brightness(.92)}

.vignette{
  position:absolute;inset:0;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle,
    rgba(0,0,0,0) 45%,
    rgba(0,0,0,.45) 100%);
  transition:opacity .25s;
}
#gameScreen.chee .vignette{opacity:1}

/* cut */
.cut{
  position:absolute;inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .28s;
}
#gameScreen.cut .cut{opacity:1}

/* announce */
.announce{
  position:absolute;inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:900;
  letter-spacing:.2em;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s;
  text-shadow:0 10px 28px rgba(0,0,0,.85);
}
#gameScreen.announce .announce{opacity:1}

/* flash */
.flash{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.22);
  opacity:0;
  pointer-events:none;
  transition:opacity .08s ease-out;
}
.flash.on{ opacity:1; }

/* bubble */
.bubble{
  position:relative;
  background:rgba(255,255,255,.08);
  border-radius:14px;
  padding:14px;
  min-height:120px;
  overflow:hidden;
}
.question{
  font-size:20px;
  font-weight:700;
  line-height:1.45;
  opacity:1;
  transition:opacity .22s;
  padding-bottom:60px;
}
.question.hide{opacity:0}

/* 返事：バブル右下固定 */
#speech{
  position:absolute;
  right:14px;
  bottom:12px;
  text-align:right;
  pointer-events:none;
  font-size:34px;
  font-weight:900;
  letter-spacing:.12em;
  min-height:40px;
  white-space:pre-line;
  text-shadow:0 10px 28px rgba(0,0,0,.75);
}

.cheeWord.big{ transform:scale(1.05); transform-origin:right bottom; }

.heartOnly{
  color:#ff2d55;
  text-shadow:0 8px 22px rgba(255,45,85,.35);
}
.heartGold{
  color:#ffd54a;
  text-shadow:0 10px 26px rgba(255,213,74,.45);
}
@keyframes heartPop{
  0%{ transform:scale(0.8); opacity:0; }
  55%{ transform:scale(1.25); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
.heartPop{ animation:heartPop .22s ease-out; }

@keyframes bgShake {
  0%   { transform: translate(0, 0) scale(1.12); }
  20%  { transform: translate(-2px, 1px) scale(1.12); }
  40%  { transform: translate(2px, -1px) scale(1.12); }
  60%  { transform: translate(-1px, -2px) scale(1.12); }
  80%  { transform: translate(1px, 2px) scale(1.12); }
  100% { transform: translate(0, 0) scale(1.12); }
}
#gameScreen.chee.stage3plus .bg{ animation:bgShake .35s infinite; }

/* choices */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.choice{
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  color:#fff;
}
.choice:disabled{opacity:.55}

/* チー娘モード：10ボタン */
.choices.chee10 .choice{
  padding:12px;
  font-size:14px;
  border-radius:12px;
}

/* gauge */
.gauge{
  height:8px;
  background:#222;
  border-radius:999px;
  overflow:hidden;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .16s, transform .16s;
  margin-bottom:10px;
}
.gauge.show{ opacity:1; transform:translateY(0); }
.gauge>div{
  height:100%;
  width:100%;
  transform-origin:left;
  transform:scaleX(0);
}
#gaugeBar.yellow{ background:linear-gradient(90deg,#ffe259,#ffa751); }
#gaugeBar.red{ background:linear-gradient(90deg,#ff416c,#ff4b2b); }

/* RESULT表示 */
#gameScreen.result .bubble{ display:none; }
#resultBox{
  position:absolute;
  left:16px;
  right:16px;
  bottom:210px;
  pointer-events:none;
  text-shadow:0 10px 28px rgba(0,0,0,.75);
}
#resultBox .label{
  font-size:18px;
  font-weight:900;
  letter-spacing:.10em;
  margin-bottom:12px;
}
#resultBox .pctRow{
  display:flex;
  justify-content:flex-end;
  align-items:baseline;
}
#resultBox .pct{
  font-size:48px;
  font-weight:900;
  line-height:1;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>チーと言えばギュウと答える</div>
  <div id="counter">-</div>
</header>

<!-- 1) TOP：タイトル＋STARTのみ -->
<div id="topScreen" class="screen">
  <div class="bg" id="topBg"></div>
  <img src="logo_chi_gyuu.png" class="topLogo" alt="チーと言えばギュウと答える">
  <div class="overlay">
    <div class="panel">
      <div class="h1">ガチ！チー牛診断！！</div>
      <button class="btn" id="btnGoGirl">START</button>
      <div class="note" id="topBestNote">チー娘 BEST：ステージ0</div>
    </div>
  </div>
</div>

<!-- 2) 女の子選択 -->
<div id="girlScreen" class="screen hide">
  <div class="bg" id="girlBg"></div>
  <img src="logo_chi_gyuu.png" class="topLogo" alt="">
  <div class="overlay">
    <div class="panel">
      <div class="h1">女の子を選んでね</div>

      <div class="girlSelectRow">
        <button class="girlCard" id="girlBtnA" onclick="selectGirl('A')">Girl A</button>
        <button class="girlCard" id="girlBtnB" onclick="selectGirl('B')">Girl B</button>
        <button class="girlCard" id="girlBtnC" onclick="selectGirl('C')">Girl C</button>
      </div>

      <div class="btnRow">
        <button class="btn" id="btnGoMode">決定</button>
        <button class="btnSmall" id="btnBackTop">← 戻る</button>
      </div>

      <div class="note">※背景は選んだ子のTOP画像になるよ</div>
    </div>
  </div>
</div>

<!-- 3) モード選択 -->
<div id="modeScreen" class="screen hide">
  <div class="bg" id="modeBg"></div>
  <img src="logo_chi_gyuu.png" class="topLogo" alt="">
  <div class="overlay">
    <div class="panel">
      <div class="h1">モードを選んでね</div>

      <div class="btnRow">
        <button class="btn" id="btnStartNormal">チー牛診断</button>
        <button class="btn" id="btnStartChee">チー娘モード</button>
        <button class="btnSmall" id="btnBackGirl">← 戻る</button>
      </div>

      <div class="note">診断は45問 / チー娘は反射神経</div>
    </div>
  </div>
</div>

<!-- 4) GAME -->
<div id="gameScreen" class="screen hide">
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="cut"></div>
  <div class="flash" id="flash"></div>
  <div class="announce">チー娘登場！！</div>

  <div id="resultBox" class="hide">
    <div class="label">あなたのチー牛度は</div>
    <div class="pctRow"><div class="pct" id="resultPct">0%</div></div>
  </div>

  <div class="overlay">
    <div class="bubble" id="bubble">
      <div id="question" class="question"></div>
      <div id="speech"></div>
    </div>

    <div class="gauge" id="gaugeWrap"><div id="gaugeBar"></div></div>
    <div class="choices" id="choices"></div>
  </div>
</div>

</div>

<script>
/* =======================
   画面切り替え
======================= */
const screens = {
  top: document.getElementById("topScreen"),
  girl: document.getElementById("girlScreen"),
  mode: document.getElementById("modeScreen"),
  game: document.getElementById("gameScreen"),
};
function showScreen(key){
  Object.values(screens).forEach(s=>s.classList.add("hide"));
  screens[key].classList.remove("hide");
}

/* =======================
   設定・保存
======================= */
const CHEE_RECORD_KEY = "cheeGirlBestStage";
const GIRL_KEY = "selectedGirlKey";

function getBestStage(){ return Number(localStorage.getItem(CHEE_RECORD_KEY)) || 0; }
function setBestStage(stage){ localStorage.setItem(CHEE_RECORD_KEY, String(stage)); }
function getSavedGirl(){ return localStorage.getItem(GIRL_KEY) || "A"; }
function saveGirl(g){ localStorage.setItem(GIRL_KEY, g); }

/* 女の子：命名規則（A/B/C 同構成） */
function makeGirl(prefix, label, chiOverText){
  const normal = Array.from({length:15}, (_,i)=> `${prefix}_normal_${String(i+1).padStart(2,"0")}.png`);

  // RESULTは S/A/B のみ（各3枚）
  const score = {
    s: Array.from({length:3}, (_,i)=> `${prefix}_score_s_${String(i+1).padStart(2,"0")}.png`),
    a: Array.from({length:3}, (_,i)=> `${prefix}_score_a_${String(i+1).padStart(2,"0")}.png`),
    b: Array.from({length:3}, (_,i)=> `${prefix}_score_b_${String(i+1).padStart(2,"0")}.png`)
  };
  return {
    id: label,
    top: `${prefix}_top_01.png`,
    normal,
    gameover: `${prefix}_gameover_01.png`,
    chiGameover: `${prefix}_chi_gameover_01.png`,
    chiOverText,
    score
  };
}

const GIRLS = {
  A: makeGirl("girlA","A","……（チー娘Aは無言で去っていった）"),
  B: makeGirl("girlB","B","……（チー娘B：見なかったことにするね）"),
  C: makeGirl("girlC","C","……（チー娘C：次はちゃんとして？）")
};

let selectedGirlKey = getSavedGirl();
function getSelectedGirl(){ return GIRLS[selectedGirlKey] || GIRLS.A; }

function applyGirlButtonUI(){
  const a=document.getElementById("girlBtnA");
  const b=document.getElementById("girlBtnB");
  const c=document.getElementById("girlBtnC");
  [a,b,c].forEach(x=>x.classList.remove("active"));
  if(selectedGirlKey==="A") a.classList.add("active");
  if(selectedGirlKey==="B") b.classList.add("active");
  if(selectedGirlKey==="C") c.classList.add("active");
}

function selectGirl(key){
  selectedGirlKey = key;
  saveGirl(key);
  applyGirlButtonUI();
  syncMenuBgs();
}
window.selectGirl = selectGirl;

function syncMenuBgs(){
  const top = getSelectedGirl().top;
  document.getElementById("topBg").style.backgroundImage = `url("${top}")`;
  document.getElementById("girlBg").style.backgroundImage = `url("${top}")`;
  document.getElementById("modeBg").style.backgroundImage = `url("${top}")`;
  document.getElementById("topBestNote").textContent = `チー娘 BEST：ステージ${getBestStage()}`;
}

/* =======================
   問題（ここは今までの45問のままでOK）
   ※省略せず置き換え：あなたの現行questionsをそのまま貼ってOK
======================= */
const questions = [
  { text:"あなたはチー牛ですか？" },
  { text:"チーと言えば？" },
  { text:"牛丼屋さんのCMに出ている石原さとみさんに「チー」と言われたら？" },
  { text:"石原さとみさんに向かって「チー」と言ったら「ギュウ」と答えてくれるイベントを開催して欲しくないですか？" },
  { text:"石原さとみさんにあの笑顔で「ギュウ」と答えてもらえたら膝から崩れ落ちずにいられますか？" },
  { text:"牛丼屋さんのCMにも出ているし、皆んなが本気で実現させようと思えば実現出来そうな気がしませんか？" },
  { text:"チーズ牛丼を頼んだ人の顔をついチラ見してしまった事はありますか？" },
  { text:"知らない人を見て『チー牛かも』と思ってしまったことはありますか？" },
  { text:"知らない人に見られて「チー牛かも」と思われていそうに感じたことはありますか？" },
  { text:"あなたの友人にチー牛はいますか？" },
  { text:"大谷翔平選手が全国の小学生にグローブをプレゼントした際の「野球しようぜ！」という言葉カッコ良かったですね！" },
  { text:"大谷翔平選手はコンビニのおにぎりのCMに出ていますが「おにぎり食おうぜ！」の方が良かったと思いますか？" },
  { text:"大谷翔平選手には是非ともチーズ牛丼のCMに出て頂き「チー牛食おうぜ！」と言って欲しいですか？" },
  { text:"麻雀には、チーをされた瞬間にギュウと答えるとチーを取り消す『チーギュウ返し』がある。" },
  { text:"あなたは三度の飯よりチーズ牛丼が好きですか？" },
  { text:"あなたはチーズ牛丼の湯気でイケメンに見える時がありますか？" },
  { text:"あなたの好きな食べ物は1位チーズ牛丼特盛り、2位大盛り、3位並盛りですか？" },
  { text:"初めて麻雀をした時、チー/ポン/カンをチー/ギュウ/ドンと間違えたことがありますか？" },
  { text:"ハイチーズをハイチー牛だと思っていた時期がありますか？" },
  { text:"写真を撮る時にチーズ牛丼を持ってハイチー牛をしてしまった事がある。" },
  { text:"チー牛は人口の2%しかいないと言われている。信じますか？" },
  { text:"チーと言われると、少しだけ反応してしまいますか？" },
  { text:"『ギュウ』と答える練習をしたことがありますか？" },
  { text:"チーズ牛丼を『恥ずかしくて頼めない』人は実在すると思いますか？" },
  { text:"あなたは『頼めないが、本当は食べたい』側ですか？" },
  { text:"気付くと『チー』『ギュウ』『チー』『ギュウ』と交互に言っている事がありますか？" },
  { text:"コンビニでチーズ系を見ると、なぜか心がざわつきますか？" },
  { text:"牛丼屋で『チーズ』の文字を見ると一瞬迷いますか？" },
  { text:"『チー』と『ギュウ』を交互に発声したことがありますか？" },
  { text:"『チーと言えばギュウ』と聞いて、少し安心しますか？" },
  { text:"あなたは自分がチー牛かどうか、時々確認したくなりますか？" },
  { text:"『チー』と聞こえたら反射的に『ギュウ』が頭に浮かびますか？" },
  { text:"『ギュウ』と言う時、なぜか誇らしい気持ちになりますか？" },
  { text:"チーズ牛丼を食べた後、ちょっと強くなった気がしますか？" },
  { text:"『チー牛』という言葉を、心の中だけで使ったことはありますか？" },
  { text:"あなたはチー牛を『悪口』ではなく『概念』だと思いますか？" },
  { text:"山本由伸選手の「負けると言う選択肢はない」という名言はとてもカッコ良かったですね？" },
  { text:"山本由伸選手に「チーズ牛丼を食べないという選択肢はない」と言ってもらいたいですか？" },
  { text:"アリストテレスの「すべての者は生まれながらに知恵を求める。」という名言を知っていますか？" },
  { text:"「すべての者は生まれながらにチーズ牛丼を求める。」という名言があるのを知っていますか？" },
  { text:"『チーと言えばギュウ』は、人生のセーフティネットだと思いますか？" },
  { text:"『チー』と『ギュウ』の関係は、もはや運命だと思いますか？" },
  { text:"チーズ牛丼を頼んだ人を見て『分かる』と思ったことはありますか？" },
  { text:"『ギュウ』と答えると世界が少し平和になると思いますか？" },
  { text:"最後にひとこと。チーと言えば？" }
];

/* =======================
   ゲーム本体（元のロジックほぼそのまま）
======================= */

/* 通常モード：チー娘乱入 */
const cheeLevelsNormal = [
  { stars:1, timeMs:2400, gauge:"cool",   weight:0.60 },
  { stars:2, timeMs:1700, gauge:"yellow", weight:0.30 },
  { stars:3, timeMs:1200, gauge:"red",    weight:0.10 }
];

const NORMAL_REACT_MS = 1050;
const QUESTION_SHOW_DELAY = 100;
const CHEE_PRE_HOLD_MS = 620;
const CUT_MS = 320;
const POST_CUT_HOLD_MS = 260;
const CHEE_SILENCE_MS = 180;
const CHEE_SUCCESS_HOLD_MS = 700;
const GIRL_REPLY_DELAY_MS = 500;
const FLASH_ON_MS = 120;

const CHEE_RATE = 0.35;
const STAGE3_BOOST_MS = 500;
const STAGE3_BOOST_MULT = 1.35;

let cheeStage = 1;
let isNewRecordRun = false;

let i=0;
let mode="quiz";
let locked=false;
let rafId=0;
let cheeCooldown=false;
let ended=false;
let currentCheeLevel=null;
let gameMode="normal";

let lastGyuuIndex = -1;

const counts = { "はい":0, "いいえ":0, "チー":0, "ギュウ":0 };

const game=document.getElementById("gameScreen");
const bg=document.querySelector("#gameScreen .bg");
const q=document.getElementById("question");
const s=document.getElementById("speech");
const c=document.getElementById("counter");
const gaugeWrap=document.getElementById("gaugeWrap");
const gauge=document.getElementById("gaugeBar");
const choices=document.getElementById("choices");
const flash=document.getElementById("flash");
const resultBox=document.getElementById("resultBox");
const resultPct=document.getElementById("resultPct");

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }

let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function playPopSE(){
  try{
    ensureAudio();
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(660, t0);
    osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.03);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.10);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.11);
  }catch(e){}
}

function setButtonsEnabled(on){
  document.querySelectorAll("#choices button").forEach(b=>b.disabled=!on);
}
function stopCheeTimer(){ cancelAnimationFrame(rafId); rafId=0; }
function hideGauge(){ gaugeWrap.classList.remove("show"); gauge.style.transform="scaleX(0)"; }
function showGauge(){ gaugeWrap.classList.add("show"); }

function resetCheeVisuals(){
  game.classList.remove("chee","cut","announce","hold","stage3plus");
  hideGauge();
  stopCheeTimer();
  gauge.classList.remove("yellow","red");
  currentCheeLevel=null;
  choices.classList.remove("chee10");
}
function flashBg(){
  flash.classList.add("on");
  setTimeout(()=> flash.classList.remove("on"), FLASH_ON_MS);
}

function clearSpeech(){ s.className=""; s.textContent=""; s.innerHTML=""; }
function setSpeechPlain(text){ s.className=""; s.textContent=text; }

function setHeartOnlyPop(isGold=false){
  s.className = isGold ? "heartGold" : "heartOnly";
  s.textContent = "❤";
  s.classList.remove("heartPop");
  void s.offsetWidth;
  s.classList.add("heartPop");
  playPopSE();
  flashBg();
}
function setGyuuWithHeart(){
  s.className = "";
  s.innerHTML = `ギュウ<span class="heartOnly">❤</span>`;
}
function setTextWithHeart(text){
  s.className = "";
  s.innerHTML = `${text}<span class="heartOnly">❤</span>`;
}

/* ボタン色 */
const buttonColors = [
  "#d64545","#c0392b","#e67e22","#f1c40f",
  "#27ae60","#16a085","#2980b9","#8e44ad",
  "#2c3e50","#7f8c8d","#ff6b6b","#ffa502"
];
function applyRandomColorsToButtons(){
  const btns = document.querySelectorAll("#choices button.choice");
  const cols = shuffle(buttonColors);
  btns.forEach((b,idx)=>{ b.style.background = cols[idx % cols.length]; });
}
function buildChoices(){
  choices.classList.remove("chee10");
  choices.innerHTML="";
  const items=[["はい"],["いいえ"],["チー"],["ギュウ"]];
  shuffle(items).forEach(([t])=>{
    const b=document.createElement("button");
    b.textContent=t;
    b.className="choice";
    b.onclick=()=>answer(t);
    choices.appendChild(b);
  });
  applyRandomColorsToButtons();
}
function buildChoicesChee10(){
  const decoys = [
    "はい","いいえ","チー","ポン","カン","ドン","モー","牛","チーズ","特盛り",
    "並","大盛り","湯気","ニコッ","クスッ","笑","うし","ぎゅ","チー牛","牛丼"
  ];
  const nine = shuffle(decoys.filter(x=>x!=="ギュウ")).slice(0, 9);
  let labels = ["ギュウ", ...nine];

  for(let k=0;k<10;k++){
    labels = shuffle(labels);
    const idx = labels.indexOf("ギュウ");
    if(idx !== lastGyuuIndex){ lastGyuuIndex = idx; break; }
  }

  choices.classList.add("chee10");
  choices.innerHTML="";
  labels.forEach(label=>{
    const b=document.createElement("button");
    b.textContent = label;
    b.className="choice";
    b.onclick=()=>answer(label);
    choices.appendChild(b);
  });
  applyRandomColorsToButtons();
}

function applyQuestionBg(){
  const girl = getSelectedGirl();
  bg.style.backgroundImage = `url("${girl.normal[i % girl.normal.length]}")`;
}

function showQuestion(){
  ended=false;
  locked=false;
  mode="quiz";
  game.classList.remove("result");
  resultBox.classList.add("hide");

  resetCheeVisuals();
  applyQuestionBg();

  q.classList.add("hide");
  q.textContent=questions[i].text;
  clearSpeech();

  c.textContent=`${i+1}/${questions.length}`;
  setTimeout(()=> q.classList.remove("hide"), QUESTION_SHOW_DELAY);

  setButtonsEnabled(true);
}

function pickCheeLevelNormal(){
  const r = Math.random();
  let acc = 0;
  for(const lv of cheeLevelsNormal){
    acc += lv.weight;
    if(r <= acc) return lv;
  }
  return cheeLevelsNormal[0];
}

function cheeOnlyPickStage(){
  let stage = cheeStage;
  if(Math.random() < 0.25){
    stage = Math.max(1, stage - (Math.random()<0.7 ? 1 : 2));
  }
  const stars = stage <= 1 ? 1 : (stage === 2 ? 2 : 3);
  const base = 2400 - (stage - 1) * 120;
  const timeMs = Math.max(550, Math.round(base));
  const gaugeType = stars === 1 ? "cool" : (stars === 2 ? "yellow" : "red");
  return { stars, timeMs, gauge:gaugeType, stage };
}

function maybeChee(){
  if(ended) return;

  if(i >= questions.length-1){
    endResult();
    return;
  }

  if(!cheeCooldown && Math.random() < CHEE_RATE){
    cheeCooldown=true;
    setButtonsEnabled(false);
    game.classList.add("hold");
    setTimeout(()=>{
      game.classList.remove("hold");
      startCheeBattle(pickCheeLevelNormal());
    }, CHEE_PRE_HOLD_MS);
  }else{
    cheeCooldown=false;
    i++;
    if(i < questions.length) showQuestion();
    else endResult();
  }
}

function startCheeBattle(level){
  if(ended) return;
  mode="chee";
  locked=false;
  currentCheeLevel = level;

  game.classList.add("cut","announce","chee");
  if(level.stars >= 3) game.classList.add("stage3plus");

  bg.style.backgroundImage = `url("${pick(getSelectedGirl().normal)}")`;

  setTimeout(()=>{
    game.classList.remove("cut","announce");

    q.textContent="";
    q.classList.add("hide");
    clearSpeech();

    setTimeout(()=>{
      s.className = "cheeWord" + (level.stars>=3 ? " big" : "");
      s.textContent = "チー！";

      if(gameMode === "cheeOnly") buildChoicesChee10();
      else buildChoices();

      startCheeTimer(level);
      setButtonsEnabled(true);
    }, CHEE_SILENCE_MS);

  }, CUT_MS + POST_CUT_HOLD_MS);
}

function startCheeTimer(level){
  stopCheeTimer();
  showGauge();

  gauge.classList.remove("yellow","red");
  if(level.gauge === "yellow") gauge.classList.add("yellow");
  if(level.gauge === "red") gauge.classList.add("red");

  const start=performance.now();
  const tick=(t)=>{
    let elapsed = t - start;

    if(level.stars >= 3 && elapsed < STAGE3_BOOST_MS){
      elapsed = elapsed * STAGE3_BOOST_MULT;
    }else if(level.stars >= 3 && elapsed >= STAGE3_BOOST_MS){
      const boosted = STAGE3_BOOST_MS * STAGE3_BOOST_MULT;
      elapsed = boosted + (elapsed - STAGE3_BOOST_MS);
    }

    const r = Math.max(0, 1 - (elapsed / level.timeMs));
    gauge.style.transform = `scaleX(${r})`;

    if(level.gauge === "cool"){
      gauge.style.background = `hsl(${210 * r}, 85%, 55%)`;
    }

    if(r > 0){
      rafId = requestAnimationFrame(tick);
    }else{
      gameOver(true);
    }
  };
  rafId = requestAnimationFrame(tick);
}

function nextCheeOnlyAfterWin(){
  cheeStage++;
  c.textContent = `ステージ${cheeStage}`;
  const best = getBestStage();
  if(cheeStage > best){ setBestStage(cheeStage); isNewRecordRun = true; }
  const lv = cheeOnlyPickStage();
  startCheeBattle(lv);
}

/* ランダム採点（80%以上） */
function computeScorePercentRandom(){
  if(Math.random() < 0.02) return 100;      // 2%だけ100（将来：チギュテッド）
  return 80 + Math.floor(Math.random() * 20); // 80〜99
}
function computeRank(p){
  if(p >= 95) return "s";
  if(p >= 88) return "a";
  return "b";
}

function answer(t){
  if(locked || ended) return;
  locked=true;
  setButtonsEnabled(false);

  ensureAudio();
  q.classList.add("hide");

  if(mode==="chee"){
    if(t==="ギュウ"){
      stopCheeTimer();
      hideGauge();

      setTimeout(()=> setHeartOnlyPop(isNewRecordRun), GIRL_REPLY_DELAY_MS);

      setTimeout(()=>{
        resetCheeVisuals();
        if(gameMode === "cheeOnly"){ nextCheeOnlyAfterWin(); return; }
        i++;
        if(i < questions.length) showQuestion();
        else endResult();
      }, GIRL_REPLY_DELAY_MS + CHEE_SUCCESS_HOLD_MS);

    }else{
      gameOver(true);
    }
    return;
  }

  const isLast = (i === 44);
  if(!isLast && counts[t] != null) counts[t]++;

  setTimeout(()=>{
    if(t==="はい")        setTextWithHeart("笑");
    else if(t==="いいえ") setTextWithHeart("クスッ");
    else if(t==="ギュウ") setTextWithHeart("ニコッ");
    else if(t==="チー")   setGyuuWithHeart();
    else                  setTextWithHeart("笑");
  }, GIRL_REPLY_DELAY_MS);

  setTimeout(()=>{
    if(isLast){
      if(t !== "ギュウ"){ gameOver(false); return; }
      endResult();
      return;
    }
    maybeChee();
  }, GIRL_REPLY_DELAY_MS + NORMAL_REACT_MS);
}

function renderEndButtonsDelayed(delayMs){
  choices.innerHTML = "";
  setTimeout(()=>{
    choices.innerHTML = `
      <button class="choice" style="grid-column:1/-1" onclick="restart(gameMode)">もう一回</button>
      <button class="choice" style="grid-column:1/-1" onclick="backToMenus()">トップに戻る</button>
    `;
    applyRandomColorsToButtons();
  }, delayMs);
}

function endResult(){
  ended=true;
  mode="result";
  resetCheeVisuals();

  game.classList.add("result");
  resultBox.classList.remove("hide");

  const p = computeScorePercentRandom();
  const rank = computeRank(p);

  const girl = getSelectedGirl();
  const img = pick(girl.score[rank] || [girl.top]);
  bg.style.backgroundImage = `url("${img}")`;
  resultPct.textContent = `${p}%`;

  q.textContent="";
  clearSpeech();
  c.textContent = "RESULT";

  renderEndButtonsDelayed(0);
}

function gameOver(isCheeBattle){
  ended=true;
  resetCheeVisuals();

  game.classList.remove("result");
  resultBox.classList.add("hide");

  const girl = getSelectedGirl();

  if(gameMode === "cheeOnly"){
    const reachedStage = cheeStage;
    const bestStage = getBestStage();
    if(reachedStage > bestStage){ setBestStage(reachedStage); isNewRecordRun = true; }

    bg.style.backgroundImage = `url("${girl.chiGameover}")`;
    clearSpeech();
    setSpeechPlain(girl.chiOverText);
    c.textContent = `GAME OVER (ステージ${reachedStage})`;

    renderEndButtonsDelayed(1000);
    return;
  }

  bg.style.backgroundImage = `url("${girl.gameover}")`;
  clearSpeech();
  setSpeechPlain("あなたチー牛じゃなかったのね。。");
  c.textContent = "GAME OVER";

  renderEndButtonsDelayed(1000);
}

function restart(modeName){
  ended=false;
  cheeCooldown=false;
  mode="quiz";
  locked=false;
  stopCheeTimer();
  resetCheeVisuals();

  gameMode = modeName || "normal";
  isNewRecordRun = false;

  counts["はい"]=0; counts["いいえ"]=0; counts["チー"]=0; counts["ギュウ"]=0;

  game.classList.remove("result");
  resultBox.classList.add("hide");

  if(gameMode === "cheeOnly"){
    cheeStage = 1;
    lastGyuuIndex = -1;
    c.textContent = `ステージ${cheeStage}`;
    startCheeBattle(cheeOnlyPickStage());
  }else{
    i=0;
    buildChoices();
    showQuestion();
  }
}

/* トップへ戻る（メニュー3段に戻す） */
function backToMenus(){
  ended=false;
  stopCheeTimer();
  resetCheeVisuals();
  locked=false;
  mode="quiz";
  cheeCooldown=false;

  game.classList.remove("result");
  resultBox.classList.add("hide");

  syncMenuBgs();
  applyGirlButtonUI();
  showScreen("top");
}
