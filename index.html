<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>チーと言えばギュウと答える v0.30.6</title>
  <style>
    :root{
      --bg1:#f6fbff;
      --bg2:#fff7fb;
      --ink:#18202a;
      --muted:#5b6572;
      --card:rgba(255,255,255,.62);
      --card2:rgba(255,255,255,.72);
      --stroke:rgba(20,30,40,.10);
      --shadow:0 10px 30px rgba(10,20,30,.10);
      --r:18px;
      --pad:14px;
      --btnpad:14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--ink);
      font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, var(--bg1), transparent 60%),
        radial-gradient(1200px 800px at 80% 0%, var(--bg2), transparent 55%),
        linear-gradient(#ffffff,#f7fbff);
    }

    /* App frame */
    #app{
      max-width: 460px;
      margin: 0 auto;
      padding: calc(10px + var(--safe-top)) 12px calc(18px + var(--safe-bottom));
    }

    /* Top area (image) */
    .girlWrap{
      width:100%;
      border-radius: 22px;
      overflow:hidden;
      background: rgba(255,255,255,.45);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
    }
    .girlImg{
      width:100%;
      height: 300px;
      object-fit: contain;
      display:block;
      background: transparent;
    }

    /* Speech bubble */
    .bubble{
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--card2);
      border: 1px solid var(--stroke);
      box-shadow: 0 6px 18px rgba(10,20,30,.08);
      font-size: 15px;
      line-height: 1.45;
    }

    /* Question card */
    .card{
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: var(--r);
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: 0 8px 22px rgba(10,20,30,.08);
    }
    .qmeta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      white-space: nowrap;
    }
    .qtext{
      font-weight: 800;
      font-size: 16px;
      letter-spacing: .2px;
      white-space: pre-wrap;
    }

    /* Buttons (透過カード統一) */
    .grid{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn{
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      border-radius: var(--r);
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: 0 8px 22px rgba(10,20,30,.08);
      padding: var(--btnpad) 12px;
      text-align:center;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: .3px;
      transition: transform .06s ease, filter .06s ease;
    }
    .btn:active{ transform: scale(.98); filter: brightness(.98); }
    .btn.small{ font-size: 13px; padding: 10px 12px; font-weight: 800; }
    .btn.ghost{ background: rgba(255,255,255,.48); }
    .btn.warn{ background: rgba(255,235,235,.66); }
    .btn.ok{ background: rgba(235,255,245,.66); }

    /* Bottom menu (下げ気味) */
    .menuRow{
      margin-top: 22px; /* 下げ気味：顔を隠さない */
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      opacity:.85;
    }
    .menuLeft, .menuRight{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .pill{
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--stroke);
      box-shadow: 0 8px 22px rgba(10,20,30,.06);
      user-select:none;
    }
    .pill strong{ font-weight: 900; }

    /* Screens */
    .screen{ display:none; }
    .screen.on{ display:block; }

    /* Girl selection list (縦スクロール) */
    .girlList{
      margin-top: 10px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      max-height: 310px;
      overflow:auto;
      padding-right: 4px;
    }
    .girlItem{
      display:flex;
      gap: 12px;
      align-items:center;
      padding: 12px;
      border-radius: var(--r);
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: 0 8px 22px rgba(10,20,30,.08);
    }
    .girlThumb{
      width: 78px;
      height: 78px;
      border-radius: 16px;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--stroke);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .girlThumb img{
      width:100%;
      height:100%;
      object-fit: contain;
      display:block;
    }
    .girlInfo{
      flex:1;
      min-width:0;
    }
    .girlName{
      font-weight: 900;
      font-size: 15px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .girlDesc{
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    .tagRow{
      margin-top: 8px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .tag{
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--stroke);
    }
    .lock{
      opacity: .55;
      position: relative;
    }
    .lock::after{
      content:"LOCK";
      position:absolute;
      right: 12px;
      top: 12px;
      font-size: 11px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(20,30,40,.10);
      border: 1px solid rgba(20,30,40,.14);
    }

    /* Modal (暗幕なし：背景は明るいまま) */
    .modalWrap{
      position: fixed;
      inset: 0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px 12px calc(12px + var(--safe-bottom));
      pointer-events:none; /* hidden時にタップ透過 */
    }
    .modalWrap.on{
      display:flex;
      pointer-events:auto;
    }
    .modal{
      width: min(460px, 100%);
      border-radius: 22px;
      background: rgba(255,255,255,.78);
      border: 1px solid var(--stroke);
      box-shadow: 0 18px 50px rgba(10,20,30,.18);
      padding: 14px;
    }
    .modalTitle{
      font-weight: 1000;
      font-size: 15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom: 10px;
    }
    .modalBody{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .row{
      margin-top: 12px;
      display:flex;
      gap:10px;
    }
    .row .btn{ flex:1; }

    /* Tiny */
    .mono{ font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    .star{ color: #ffcc33; text-shadow: 0 2px 8px rgba(255,180,0,.25); }
    .hidden{ display:none !important; }
  </style>
</head>

<body>
  <div id="app">

    <!-- ===== Screen: Select Girl ===== -->
    <section id="screenSelect" class="screen on">
      <div class="girlWrap">
        <img id="selectHeroImg" class="girlImg" src="girlA_top_01.png" alt="girl">
      </div>

      <div class="bubble" id="selectBubble">最初に女の子を選んでね。</div>

      <div class="card">
        <div class="qmeta">
          <div>モード</div>
          <div id="modeBadge" class="pill"><strong>通常</strong></div>
        </div>
        <div class="qtext">チーと言えばギュウと答える</div>
      </div>

      <div class="card">
        <div class="qmeta">
          <div>女の子（追加前提：縦スクロール）</div>
          <div class="pill mono" id="debugBadge"></div>
        </div>

        <div class="girlList" id="girlList"></div>

        <div class="row">
          <div id="toggleAllStarBtn" class="btn small ghost">オールスターモード（課金）</div>
          <div id="startBtn" class="btn small ok">START</div>
        </div>
      </div>

      <div class="menuRow">
        <div class="menuLeft">
          <div class="pill mono">v0.30.6</div>
          <div class="pill">星=チギュテッド閲覧済み</div>
        </div>
        <div class="menuRight">
          <div id="resetStarBtn" class="pill">星リセット</div>
        </div>
      </div>
    </section>

    <!-- ===== Screen: Quiz ===== -->
    <section id="screenQuiz" class="screen">
      <div class="girlWrap">
        <img id="girlImg" class="girlImg" src="girlA_normal_01.png" alt="girl">
      </div>

      <div class="bubble" id="bubble">……</div>

      <div class="card">
        <div class="qmeta">
          <div id="qCounter">Q1 / 25</div>
          <div class="pill mono" id="stagePill">stage 1</div>
        </div>
        <div class="qtext" id="qText">あなたはチー牛ですか？</div>
      </div>

      <div class="grid" id="choices"></div>

      <div class="menuRow">
        <div class="menuLeft">
          <div class="pill">暗幕なし</div>
          <div class="pill" id="allStarPill">通常</div>
        </div>
        <div class="menuRight">
          <div id="toTopBtn" class="pill">トップ</div>
        </div>
      </div>
    </section>

    <!-- ===== Screen: Result ===== -->
    <section id="screenResult" class="screen">
      <div class="girlWrap">
        <img id="resultImg" class="girlImg" src="girlA_clear_01.png" alt="result">
      </div>

      <div class="bubble" id="resultBubble">ギュウ</div>

      <div class="card">
        <div class="qmeta">
          <div>結果</div>
          <div class="pill" id="rankPill">—</div>
        </div>
        <div class="qtext" id="resultText">チー牛度：—%</div>
      </div>

      <div class="card">
        <div class="qmeta"><div>内訳</div><div class="pill mono" id="countsPill"></div></div>
        <div id="resultDetail" class="modalBody"></div>
        <div class="row">
          <div id="retryBtn" class="btn">もう一回</div>
          <div id="topBtn2" class="btn ghost">トップに戻る</div>
        </div>
      </div>

      <div class="menuRow">
        <div class="menuLeft">
          <div class="pill mono">v0.30.6</div>
        </div>
        <div class="menuRight">
          <div class="pill" id="starHint"></div>
        </div>
      </div>
    </section>

  </div>

  <!-- ===== Modal (明るいまま / 暗幕なし) ===== -->
  <div id="modalWrap" class="modalWrap">
    <div class="modal">
      <div class="modalTitle">
        <div id="modalTitle">通知</div>
        <div id="modalClose" class="pill">閉じる</div>
      </div>
      <div class="modalBody" id="modalBody"></div>
      <div class="row" id="modalButtons"></div>
    </div>
  </div>

<script>
(() => {
  /* =========================
     v0.30.6 仕様反映まとめ
     - 25問 / Q1,Q25固定
     - チー娘乱入 最低3回保証 (Lv1/2/3必ず体験)
     - チー娘登場演出は必ず見える (スキップ不可：一定時間後に"続ける"が出る)
     - UI 暗幕なし（モーダルも明るいカード）
     - 透過カードUIをボタン含め統一
     - メニュー位置下げ気味
     - オールスターモードあり
       * 課金想定（ここではローカル保存）
       * debug=1 で擬似解放
       * 登場キャラのみランダム（クイズ中の女の子がランダムに切替）
       * エンディングは選択中の女の子固定
     - 女の子追加前提の縦スクロール
     - 星マーク＝その女の子のチギュテッドエンディング閲覧済み
  ========================= */

  const qs = new URLSearchParams(location.search);
  const DEBUG = qs.get("debug") === "1";

  const LS = {
    ALLSTAR: "chi_gyu_allstar_unlocked",
    STAR_PREFIX: "chi_gyu_star_seen_", // + girlId
  };

  const $ = (sel) => document.querySelector(sel);

  /* ===== Screens ===== */
  const screenSelect = $("#screenSelect");
  const screenQuiz   = $("#screenQuiz");
  const screenResult = $("#screenResult");

  function showScreen(which){
    [screenSelect, screenQuiz, screenResult].forEach(s => s.classList.remove("on"));
    which.classList.add("on");
    window.scrollTo({top:0, behavior:"instant"});
  }

  /* ===== Modal (暗幕なし) ===== */
  const modalWrap = $("#modalWrap");
  const modalTitle = $("#modalTitle");
  const modalBody = $("#modalBody");
  const modalButtons = $("#modalButtons");
  const modalClose = $("#modalClose");

  let modalLocked = false; // trueの間は閉じられない（演出保証用）

  function openModal({title="通知", body="", buttons=[], lockClose=false}){
    modalTitle.textContent = title;
    modalBody.textContent = body;
    modalButtons.innerHTML = "";
    modalLocked = !!lockClose;

    buttons.forEach(btn => {
      const b = document.createElement("div");
      b.className = "btn small " + (btn.kind || "");
      b.textContent = btn.label;
      b.onclick = () => btn.onClick && btn.onClick();
      modalButtons.appendChild(b);
    });

    modalWrap.classList.add("on");
  }
  function closeModal(force=false){
    if(modalLocked && !force) return;
    modalWrap.classList.remove("on");
    modalLocked = false;
  }
  modalClose.onclick = () => closeModal(false);

  /* ===== Data: girls (追加前提) ===== */
  const girls = [
    { id:"A", key:"girlA", label:"girlA", top:"girlA_top_01.png", normal:"girlA_normal_01.png", clear:"girlA_clear_01.png" },
    { id:"B", key:"girlB", label:"girlB", top:"girlB_top_01.png", normal:"girlB_normal_01.png", clear:"girlB_clear_01.png" },
    { id:"C", key:"girlC", label:"girlC", top:"girlC_top_01.png", normal:"girlC_normal_01.png", clear:"girlC_clear_01.png" },
  ];

  /* ===== Unlock rules =====
     - オールスター: debug=1 で擬似解放
     - それ以外は localStorage を「購入済み」として扱う（課金想定）
  */
  function isAllStarUnlocked(){
    if(DEBUG) return true;
    return localStorage.getItem(LS.ALLSTAR) === "1";
  }
  function setAllStarUnlocked(v){
    localStorage.setItem(LS.ALLSTAR, v ? "1" : "0");
  }

  /* ===== Star (チギュテッド閲覧済み) ===== */
  function getStarSeen(girlId){
    return localStorage.getItem(LS.STAR_PREFIX + girlId) === "1";
  }
  function setStarSeen(girlId, v){
    localStorage.setItem(LS.STAR_PREFIX + girlId, v ? "1" : "0");
  }
  function resetAllStars(){
    girls.forEach(g => localStorage.removeItem(LS.STAR_PREFIX + g.id));
  }

  /* ===== Select screen UI ===== */
  const selectHeroImg = $("#selectHeroImg");
  const selectBubble  = $("#selectBubble");
  const girlListEl    = $("#girlList");
  const startBtn      = $("#startBtn");
  const toggleAllStarBtn = $("#toggleAllStarBtn");
  const modeBadge     = $("#modeBadge");
  const debugBadge    = $("#debugBadge");
  const resetStarBtn  = $("#resetStarBtn");

  let selectedGirl = girls[0];
  let allStarMode = false;

  function refreshSelectHeader(){
    selectHeroImg.src = selectedGirl.top;
    const star = getStarSeen(selectedGirl.id) ? "★" : "";
    selectBubble.textContent = `${selectedGirl.label} を選択中 ${star ? "（" + star + "チギュテッド閲覧済み）" : ""}`;
  }

  function refreshModeBadge(){
    const unlocked = isAllStarUnlocked();
    if(allStarMode){
      modeBadge.innerHTML = `<strong>オールスター</strong>`;
    }else{
      modeBadge.innerHTML = `<strong>通常</strong>`;
    }

    if(DEBUG){
      debugBadge.textContent = "debug=1";
    }else{
      debugBadge.textContent = "";
    }

    // ボタン表示
    const label = unlocked
      ? (allStarMode ? "オールスターON（タップでOFF）" : "オールスターOFF（タップでON）")
      : "オールスターモード（課金）";
    toggleAllStarBtn.textContent = label;
  }

  function buildGirlList(){
    girlListEl.innerHTML = "";
    const unlockedAllStar = isAllStarUnlocked();

    girls.forEach(g => {
      // 通常は「選択」は可能（今後追加前提）
      // オールスターが未解放の場合、B/Cは「登場しない」扱いとしてロック表示（ただし将来追加のため選択はできる）
      const lockedInNormal = (!unlockedAllStar && g.id !== "A");

      const item = document.createElement("div");
      item.className = "girlItem" + (lockedInNormal ? " lock" : "");
      item.onclick = () => {
        selectedGirl = g;
        refreshSelectHeader();
        // クイズ中もエンディングは選択中固定
      };

      const thumb = document.createElement("div");
      thumb.className = "girlThumb";
      const img = document.createElement("img");
      img.src = g.top;
      img.alt = g.label;
      thumb.appendChild(img);

      const info = document.createElement("div");
      info.className = "girlInfo";

      const name = document.createElement("div");
      name.className = "girlName";
      const star = getStarSeen(g.id) ? `<span class="star">★</span>` : "";
      name.innerHTML = `${g.label} ${star}`;

      const desc = document.createElement("div");
      desc.className = "girlDesc";
      desc.textContent = lockedInNormal
        ? "（通常では未登場）オールスター解放でランダム登場"
        : "選択するとエンディングはこの子で固定";

      const tagRow = document.createElement("div");
      tagRow.className = "tagRow";
      const t1 = document.createElement("div");
      t1.className = "tag";
      t1.textContent = "縦スクロール対応";
      const t2 = document.createElement("div");
      t2.className = "tag";
      t2.textContent = lockedInNormal ? "LOCK" : "OK";
      tagRow.appendChild(t1);
      tagRow.appendChild(t2);

      info.appendChild(name);
      info.appendChild(desc);
      info.appendChild(tagRow);

      item.appendChild(thumb);
      item.appendChild(info);
      girlListEl.appendChild(item);
    });
  }

  toggleAllStarBtn.onclick = () => {
    const unlocked = isAllStarUnlocked();
    if(!unlocked){
      // 課金想定：ここでは案内だけ。debug=1なら擬似解放も可能
      if(DEBUG){
        openModal({
          title: "オールスター（debug擬似解放）",
          body: "debug=1 のため、擬似解放できます。\n解放しますか？",
          buttons: [
            { label:"解放する", kind:"ok", onClick: () => { setAllStarUnlocked(true); closeModal(true); syncSelectUI(); } },
            { label:"やめる", kind:"ghost", onClick: () => closeModal(true) },
          ],
          lockClose:false
        });
      }else{
        openModal({
          title: "オールスター（課金想定）",
          body: "未解放です。\n（実課金導線は後で実装）\n\n※テストする場合：URL末尾に ?debug=1 を付けてください。",
          buttons: [
            { label:"OK", kind:"ok", onClick: () => closeModal(true) }
          ],
          lockClose:false
        });
      }
      return;
    }
    allStarMode = !allStarMode;
    syncSelectUI();
  };

  resetStarBtn.onclick = () => {
    openModal({
      title: "星リセット",
      body: "全員の「チギュテッド閲覧済み（★）」をリセットします。\nよろしい？",
      buttons: [
        { label:"リセット", kind:"warn", onClick: () => { resetAllStars(); closeModal(true); syncSelectUI(); } },
        { label:"やめる", kind:"ghost", onClick: () => closeModal(true) },
      ],
      lockClose:false
    });
  };

  function syncSelectUI(){
    buildGirlList();
    refreshSelectHeader();
    refreshModeBadge();
  }

  /* ===== Quiz data ===== */
  // Q1/Q25 固定。中23問は差し替え前提（ここは“完全版index.html”として枠を実装）
  const Q1  = "あなたはチー牛ですか？";
  const Q25 = "最後にひとこと。チーと言えば？";

  // ここをあなたの正式23問に置き換えればOK
  const MID_23 = [
    "チーズ牛丼を本当は食べたいですか？",
    "「チー牛食おうぜ！」と言われたら嬉しい？",
    "他人を見て一瞬だけチー牛かもと思ったことはありますか？",
    "今日は『やってる感』だけ出せましたか？",
    "「行けたら行くよ」を実行したことはありますか？",
    "牛丼屋でメニューを見るフリをしますか？",
    "イヤホンをしてると強くなった気がしますか？",
    "深夜に急に自己肯定感が上がることがありますか？",
    "『検討はした』と言ったことはありますか？",
    "『今じゃない』で回避したことはありますか？",
    "『永久に保留で』と言いたくなりますか？",
    "好きな言葉は『動かざること山の如く』ですか？",
    "会話の最適解をあとで思い出しますか？",
    "ラーメンの替え玉より、言い訳の替え玉が得意ですか？",
    "自分の評価は自分で決めたいですか？",
    "ネットで調べた知識を現場で活かせたことはありますか？",
    "褒められると一回否定してから受け取りますか？",
    "『とりあえず』を多用しますか？",
    "『案をね』と言いがちですか？",
    "自分のことを客観視しすぎて疲れますか？",
    "何もしてないのに忙しい日がありますか？",
    "アイコンを変えるだけで人生変わる気がしますか？",
    "最後に『ギュウ』と言って終わりたいですか？",
  ];

  // 25問を構築（Q1 + shuffle(MID23) + Q25）
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  let questions = []; // length=25

  /* ===== Chi-girl invasion schedule =====
     - 最低3回保証（Lv1→Lv2→Lv3必ず体験）
     - Q2〜Q24の範囲に出す
     - 演出は必ず見える（一定時間後に続けるが出る）
  */
  function makeChiSchedule(){
    // 対象は Q2..Q24 => index 1..23 (0-based)
    const candidates = [];
    for(let i=1;i<=23;i++) candidates.push(i);

    // 3箇所を重複なしで選ぶ
    const picks = [];
    while(picks.length<3){
      const idx = Math.floor(Math.random()*candidates.length);
      picks.push(candidates[idx]);
      candidates.splice(idx,1);
    }
    picks.sort((a,b)=>a-b);

    const schedule = new Map();
    schedule.set(picks[0], 1);
    schedule.set(picks[1], 2);
    schedule.set(picks[2], 3);

    return schedule;
  }

  /* ===== Scoring (最低限：答えの回数差ベース + 例外点) =====
     ※今回の「確定仕様」に採点が明記されてないため、
       “ゲームとして成立する最小”を実装（後で差し替え可能）
     - 2%でチギュテッド(100%) -> 星を保存
  */
  function computeScore(counts){
    // counts: {yes,no,chi,gyu}
    const arr = [counts.yes, counts.no, counts.chi, counts.gyu];
    const max = Math.max(...arr);
    const min = Math.min(...arr);
    const diff = max - min; // 小さいほどチー牛度が高い、という方針（過去仕様に合わせる）
    // 基本スコア（ざっくり）：diff 0..25 -> 100..0
    let pct = Math.round(100 - (diff/25)*100);

    // 例外（過去メモの値を採用）
    const total = arr.reduce((s,x)=>s+x,0);
    const key = `${counts.yes},${counts.no},${counts.chi},${counts.gyu}`;
    const exceptions = new Map([
      // 25問版なので、以下は“方向性”として近似で入れる（ズレても動くようにする）
      // すべて同一選択になった時の固定値（25問）
      ["25,0,0,0", 48],
      ["0,25,0,0", 42],
      ["0,0,25,0", 57],
      ["0,0,0,25", 53],
    ]);
    if(exceptions.has(key)) pct = exceptions.get(key);

    // ランク
    let rank = "D";
    if(pct>=90) rank="S";
    else if(pct>=75) rank="A";
    else if(pct>=60) rank="B";
    else if(pct>=45) rank="C";

    return { pct, rank, diff, total };
  }

  /* ===== Quiz runtime ===== */
  const bubble = $("#bubble");
  const girlImg = $("#girlImg");
  const qCounter = $("#qCounter");
  const qText = $("#qText");
  const stagePill = $("#stagePill");
  const choicesEl = $("#choices");
  const toTopBtn = $("#toTopBtn");
  const allStarPill = $("#allStarPill");

  const resultImg = $("#resultImg");
  const resultBubble = $("#resultBubble");
  const resultText = $("#resultText");
  const resultDetail = $("#resultDetail");
  const rankPill = $("#rankPill");
  const countsPill = $("#countsPill");
  const retryBtn = $("#retryBtn");
  const topBtn2 = $("#topBtn2");
  const starHint = $("#starHint");

  // 状態
  let qi = 0; // 0..24
  let stage = 1;
  let chiSchedule = new Map();
  let canAnswer = true;

  // 回答カウント
  const counts = { yes:0, no:0, chi:0, gyu:0 };

  // クイズ中の「登場キャラのみランダム」
  // - allStarMode && allStarUnlocked の場合、回答後にランダムで女の子が“登場”として切替
  function getActivePool(){
    // 通常：選択中のみ
    // オールスター：A/B/C（将来追加も含めここを拡張）
    if(allStarMode && isAllStarUnlocked()){
      return girls.slice();
    }
    return [selectedGirl];
  }
  function maybeSwapGirlDuringQuiz(){
    if(!(allStarMode && isAllStarUnlocked())) return;
    const pool = getActivePool();
    const pick = pool[Math.floor(Math.random()*pool.length)];
    girlImg.src = pick.normal;
  }

  function setQuizGirlToSelected(){
    girlImg.src = selectedGirl.normal;
  }

  /* ===== Choices ===== */
  const CHOICES = ["はい","いいえ","チー","ギュウ"];

  function renderChoices(){
    choicesEl.innerHTML = "";
    CHOICES.forEach((label) => {
      const b = document.createElement("div");
      b.className = "btn";
      b.textContent = label;
      b.onclick = () => onAnswer(label);
      choicesEl.appendChild(b);
    });
  }

  function updateQuestionUI(){
    qCounter.textContent = `Q${qi+1} / 25`;
    stagePill.textContent = `stage ${stage}`;
    qText.textContent = questions[qi];
    bubble.textContent = "……";
    renderChoices();

    // Q1 / Q25 は固定仕様（表示上も明確にしておく）
    if(qi === 0) bubble.textContent = "最初の質問だよ。";
    if(qi === 24) bubble.textContent = "最後は決めて。";
  }

  function incCount(answer){
    if(answer==="はい") counts.yes++;
    else if(answer==="いいえ") counts.no++;
    else if(answer==="チー") counts.chi++;
    else if(answer==="ギュウ") counts.gyu++;
  }

  /* ===== チー娘演出 =====
     - 暗幕なし
     - 必ず見える（lockClose=true、一定時間後に続けるが出る）
  */
  function showChiGirl(level, after){
    canAnswer = false;

    // 乱入時はチー娘画像へ（ファイル名は仕様に合わせている）
    // あなたの実ファイル名に合わせてここだけ調整OK
    const chiImg = `chi_girl_lv${level}.png`;
    const prevSrc = girlImg.src;

    // 画像切替
    girlImg.src = chiImg;
    bubble.textContent = `チー娘 Lv${level} 乱入！！！`;

    // 演出は必ず見える：最初は閉じられない
    openModal({
      title: `チー娘 Lv${level}`,
      body: `乱入演出（必ず表示）\n\nLv${level} を体験しました。`,
      buttons: [],
      lockClose: true
    });

    // 一定時間後に「続ける」ボタンを出す（ここで初めて進める）
    setTimeout(() => {
      modalButtons.innerHTML = "";
      const cont = document.createElement("div");
      cont.className = "btn small ok";
      cont.textContent = "続ける";
      cont.onclick = () => {
        closeModal(true);
        // 元の女の子に戻す（ただしオールスター中は“登場ランダム”に任せる）
        if(allStarMode && isAllStarUnlocked()){
          maybeSwapGirlDuringQuiz();
        }else{
          setQuizGirlToSelected();
        }
        canAnswer = true;
        after && after();
      };
      modalButtons.appendChild(cont);
      modalLocked = false; // 続けるが出たら閉じられる（ただし"続ける"推奨）
    }, 950);
  }

  /* ===== Answer flow ===== */
  function onAnswer(label){
    if(!canAnswer) return;

    // カウント
    incCount(label);

    // リアクション（簡易）
    if(label==="ギュウ") bubble.textContent = "ギュウ";
    else if(label==="チー") bubble.textContent = "……";
    else bubble.textContent = "うん";

    // Q25は“最後にひとこと。チーと言えば？”（固定）
    // → ここでエンディングへ
    const isLast = (qi === 24);

    // 乱入判定：Q2〜Q24の範囲（qi 1..23）でスケジュールがある場合
    const scheduledLv = chiSchedule.get(qi);

    // 先に次へ行く関数
    const goNext = () => {
      if(isLast){
        finishQuiz();
        return;
      }
      qi++;
      stage++;
      // オールスター中は女の子“登場ランダム”（ただしエンディングは選択中固定）
      if(allStarMode && isAllStarUnlocked()){
        maybeSwapGirlDuringQuiz();
      }else{
        setQuizGirlToSelected();
      }
      updateQuestionUI();
    };

    // 乱入がある場合：必ず演出を見せてから進む
    if(scheduledLv && qi >= 1 && qi <= 23){
      showChiGirl(scheduledLv, goNext);
      return;
    }

    // 乱入以外：普通に進む
    setTimeout(goNext, 140);
  }

  /* ===== Finish / Result ===== */
  function finishQuiz(){
    // エンディングは選択中の女の子固定
    //（オールスターでクイズ中に切替していてもここで固定に戻す）
    const endGirl = selectedGirl;

    // 2% チギュテッド
    const chigyuted = Math.random() < 0.02;

    // 基本スコア
    let { pct, rank, diff } = computeScore(counts);

    if(chigyuted){
      pct = 100;
      rank = "S";
      setStarSeen(endGirl.id, true); // ★＝閲覧済み
    }

    // 画像
    resultImg.src = chigyuted ? `${endGirl.key}_score_s_01.png` : `${endGirl.key}_clear_01.png`;

    // テキスト
    if(chigyuted){
      resultBubble.textContent = "チー牛ギフテッド（チギュテッド）";
      resultText.textContent = `チー牛度：${pct}%`;
      rankPill.textContent = "S（チギュテッド）";
      starHint.textContent = `★ ${endGirl.label} のチギュテッド閲覧済み`;
    }else{
      resultBubble.textContent = "ギュウ";
      resultText.textContent = `チー牛度：${pct}%`;
      rankPill.textContent = `${rank}`;
      starHint.textContent = getStarSeen(endGirl.id) ? `★ ${endGirl.label} のチギュテッド閲覧済み` : "—";
    }

    countsPill.textContent = `はい${counts.yes} / いいえ${counts.no} / チー${counts.chi} / ギュウ${counts.gyu}`;
    resultDetail.textContent =
`diff（最大-最小）: ${diff}
選択回数:
- はい: ${counts.yes}
- いいえ: ${counts.no}
- チー: ${counts.chi}
- ギュウ: ${counts.gyu}

※星(★)は「その女の子のチギュテッドエンディング閲覧済み」`;

    showScreen(screenResult);
  }

  retryBtn.onclick = () => {
    startGame(); // 同じ選択中の女の子で再スタート
  };
  topBtn2.onclick = () => {
    showScreen(screenSelect);
    syncSelectUI();
  };

  toTopBtn.onclick = () => {
    openModal({
      title: "トップに戻る",
      body: "今の進行はリセットされます。\n戻りますか？",
      buttons: [
        { label:"戻る", kind:"warn", onClick: () => { closeModal(true); showScreen(screenSelect); syncSelectUI(); } },
        { label:"続ける", kind:"ghost", onClick: () => closeModal(true) },
      ],
      lockClose:false
    });
  };

  /* ===== Start game ===== */
  function buildQuestions(){
    const mid = shuffle(MID_23).slice(0,23);
    return [Q1, ...mid, Q25];
  }

  function resetQuizState(){
    qi = 0;
    stage = 1;
    counts.yes = counts.no = counts.chi = counts.gyu = 0;
    chiSchedule = makeChiSchedule();
    canAnswer = true;

    // 表示（エンディング固定のため）
    setQuizGirlToSelected();
  }

  function startGame(){
    // オールスターpill
    allStarPill.textContent = (allStarMode && isAllStarUnlocked()) ? "オールスター" : "通常";
    // 質問生成
    questions = buildQuestions();

    resetQuizState();
    updateQuestionUI();

    // オールスター時：最初から登場ランダムにしても良い（ただしQ1は選択中の子で開始して安心感）
    // → Q1は選択中固定で始める（仕様に抵触しない）
    showScreen(screenQuiz);
  }

  startBtn.onclick = () => {
    // オールスター未解放なら allStarMode を強制OFF
    if(allStarMode && !isAllStarUnlocked()) allStarMode = false;
    startGame();
  };

  /* ===== Init ===== */
  function init(){
    // 初期：オールスターが解放されてるなら前回のON/OFFを引き継いでもいいが、
    // 今回は「誤操作防止」で常にOFF開始（必要ならここを保存に変更可）
    allStarMode = false;

    refreshSelectHeader();
    syncSelectUI();

    // heroは選択中の子
    selectHeroImg.src = selectedGirl.top;

    // debug 表示
    refreshModeBadge();
  }

  init();
})();
</script>
