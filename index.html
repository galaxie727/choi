<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>チーと言えばギュウと答える</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
.app{
  max-width:560px;
  margin:0 auto;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* header */
header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:700;
}

/* screens */
.screen{flex:1;position:relative;overflow:hidden}
.bg{
  position:absolute; inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.02);
  transition:transform .35s ease, filter .35s ease;
}
.overlay{
  position:absolute; inset:0;
  padding:16px;
  display:flex;
}

/* START */
#startScreen .bg{ background-image:url("girlA_top_01.png"); }
#startScreen .overlay{
  flex-direction:column;
  justify-content:flex-end;
  padding-bottom:28px;
}

.startPanel{
  width:100%;
  text-align:center;
}

/* ロゴ：画面上に固定（顔に被りにくく） */
.topLogo{
  position:absolute;
  left:50%;
  top10px; /* ここで上下調整 */
  transform:translateX(-50%);
  width:min(520px, 92%);
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.75));
  pointer-events:none;
  z-index:2;
}

/* タイトル等はロゴの下へ */
.startTitle{
  margin-top:160px; /* ロゴ分のスペース（必要なら増減） */
  font-size:18px;
  font-weight:900;
  letter-spacing:.14em;
  margin-bottom:10px;
  text-shadow:0 8px 22px rgba(0,0,0,.75);
}

.bestLine{
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  margin-bottom:14px;
  text-shadow:0 8px 22px rgba(0,0,0,.75);
  opacity:.95;
}
.bestNum{
  font-size:14px;
  letter-spacing:.08em;
}

/* キャラ選択 */
.girlSelectRow{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin:14px auto 18px;
  max-width:520px;
}
.girlCard{
  padding:14px 10px;
  border-radius:14px;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.00);
  font-weight:900;
  letter-spacing:.10em;
}
.girlCard small{
  display:block;
  margin-top:8px;
  font-size:12px;
  opacity:.9;
  letter-spacing:.14em;
}
.girlCard.active{
  border-color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.14);
}

/* STARTボタン */
.startBtns{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top50px; /* メニューを下げたい場合は増やす */
}
.startBtn{
  font-size:18px;
  padding:14px 18px;
  border:none;
  border-radius:14px;
  background:#ffffff22;
  color:#fff;
  font-weight:900;
  min-width:170px;
}

/* TOP: NEW RECORD バッジ */
.badge{
  display:inline-block;
  margin-top:12px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  font-weight:900;
  letter-spacing:.12em;
  opacity:0;
  transform:translateY(6px) scale(.98);
  transition:opacity .22s, transform .22s;
}
.badge.show{
  opacity:1;
  transform:translateY(0) scale(1);
}
.badge .star{ color:#ffd54a; }

/* GAME */
#gameScreen .overlay{
  flex-direction:column;
  justify-content:space-between;
}

#gameScreen.chee .bg{transform:scale(1.12)}
#gameScreen.hold .bg{filter:brightness(.92)}

.vignette{
  position:absolute;inset:0;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle,
    rgba(0,0,0,0) 45%,
    rgba(0,0,0,.45) 100%);
  transition:opacity .25s;
}
#gameScreen.chee .vignette{opacity:1}

/* cut */
.cut{
  position:absolute;inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .28s;
}
#gameScreen.cut .cut{opacity:1}

/* announce */
.announce{
  position:absolute;inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:900;
  letter-spacing:.2em;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s;
  text-shadow:0 10px 28px rgba(0,0,0,.85);
}
#gameScreen.announce .announce{opacity:1}

/* flash */
.flash{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.22);
  opacity:0;
  pointer-events:none;
  transition:opacity .08s ease-out;
}
.flash.on{ opacity:1; }

/* bubble */
.bubble{
  position:relative;
  background:rgba(255,255,255,.08);
  border-radius:14px;
  padding:14px;
  min-height:120px;
  overflow:hidden;
}
.question{
  font-size:20px;
  font-weight:700;
  line-height:1.45;
  opacity:1;
  transition:opacity .22s;
  padding-bottom:60px; /* 返事ぶんの空き */
}
.question.hide{opacity:0}

/* 返事：バブル右下固定 */
#speech{
  position:absolute;
  right:14px;
  bottom:12px;
  left:auto;
  text-align:right;
  pointer-events:none;

  font-size:34px;
  font-weight:900;
  letter-spacing:.12em;
  min-height:40px;
  white-space:pre-line;
  text-shadow:0 10px 28px rgba(0,0,0,.75);
}

/* チー娘の「チー！」（⭐︎⭐︎⭐︎だけ少し大きい） */
.cheeWord.big{ transform:scale(1.05); transform-origin:right bottom; }

/* ❤ */
.heartOnly{
  color:#ff2d55;
  text-shadow:0 8px 22px rgba(255,45,85,.35);
}
.heartGold{
  color:#ffd54a;
  text-shadow:0 10px 26px rgba(255,213,74,.45);
}
@keyframes heartPop{
  0%{ transform:scale(0.8); opacity:0; }
  55%{ transform:scale(1.25); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
.heartPop{ animation:heartPop .22s ease-out; }

/* ⭐︎⭐︎⭐︎ 背景揺れ（軽め） */
@keyframes bgShake {
  0%   { transform: translate(0, 0) scale(1.12); }
  20%  { transform: translate(-2px, 1px) scale(1.12); }
  40%  { transform: translate(2px, -1px) scale(1.12); }
  60%  { transform: translate(-1px, -2px) scale(1.12); }
  80%  { transform: translate(1px, 2px) scale(1.12); }
  100% { transform: translate(0, 0) scale(1.12); }
}
#gameScreen.chee.stage3plus .bg{ animation:bgShake .35s infinite; }

/* choices */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.choice{
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  color:#fff;
}
.choice:disabled{opacity:.55}

/* チー娘モード：10ボタン */
.choices.chee10 .choice{
  padding:12px;
  font-size:14px;
  border-radius:12px;
}

/* gauge (チー娘中だけ表示) */
.gauge{
  height:8px;
  background:#222;
  border-radius:999px;
  overflow:hidden;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .16s, transform .16s;
  margin-bottom:10px;
}
.gauge.show{
  opacity:1;
  transform:translateY(0);
}
.gauge>div{
  height:100%;
  width:100%;
  transform-origin:left;
  transform:scaleX(0);
}
/* 難易度ごとのゲージ色 */
#gaugeBar.yellow{ background:linear-gradient(90deg,#ffe259,#ffa751); }
#gaugeBar.red{ background:linear-gradient(90deg,#ff416c,#ff4b2b); }

.hide{display:none}

/* ===== RESULT表示（画面下：ラベル＋右寄せ％） ===== */
#gameScreen.result .bubble{ display:none; }

#resultBox{
  position:absolute;
  left:16px;
  right:16px;
  bottom:210px;                 /* 位置調整はここ */
  pointer-events:none;
  text-shadow:0 10px 28px rgba(0,0,0,.75);
}
#resultBox .label{
  font-size:18px;
  font-weight:900;
  letter-spacing:.10em;
  margin-bottom:12px;
}
#resultBox .pctRow{
  display:flex;
  justify-content:flex-end;
  align-items:baseline;
}
#resultBox .pct{
  font-size:48px;               /* 小さめが良い：ここで調整 */
  font-weight:900;
  line-height:1;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>チーと言えばギュウと答える</div>
  <div id="counter">-</div>
</header>

<!-- START -->
<div id="startScreen" class="screen">
  <div class="bg"></div>

  <!-- ロゴ（透過PNG） -->
  <img src="logo_chi_gyuu.png" class="topLogo" alt="チーと言えばギュウと答える">

  <div class="overlay">
    <div class="startPanel">
      <div class="startTitle">ガチ！チー牛診断！！</div>

</div>

</div>

<script>
/* =======================
   設定・画像・保存
======================= */

/* ローカル保存 */
const CHEE_RECORD_KEY = "cheeGirlBestStage";
const GIRL_KEY = "selectedGirlKey";

function getBestStage(){ return Number(localStorage.getItem(CHEE_RECORD_KEY)) || 0; }
function setBestStage(stage){ localStorage.setItem(CHEE_RECORD_KEY, String(stage)); }

function getSavedGirl(){ return localStorage.getItem(GIRL_KEY) || "A"; }
function saveGirl(g){ localStorage.setItem(GIRL_KEY, g); }

/* 女の子：命名規則（A/B/C 同構成） */
function makeGirl(prefix, label, chiOverText){
  const normal = Array.from({length:15}, (_,i)=> `${prefix}_normal_${String(i+1).padStart(2,"0")}.png`);
  const clear  = Array.from({length:3},  (_,i)=> `${prefix}_clear_${String(i+1).padStart(2,"0")}.png`);
  const score = {
    s: Array.from({length:3}, (_,i)=> `${prefix}_score_s_${String(i+1).padStart(2,"0")}.png`),
    a: Array.from({length:3}, (_,i)=> `${prefix}_score_a_${String(i+1).padStart(2,"0")}.png`),
    b: Array.from({length:3}, (_,i)=> `${prefix}_score_b_${String(i+1).padStart(2,"0")}.png`),
    c: Array.from({length:3}, (_,i)=> `${prefix}_score_c_${String(i+1).padStart(2,"0")}.png`),
    d: Array.from({length:3}, (_,i)=> `${prefix}_score_d_${String(i+1).padStart(2,"0")}.png`)
  };
  return {
    id: label,
    top: `${prefix}_top_01.png`,
    normal,
    gameover: `${prefix}_gameover_01.png`,
    chiGameover: `${prefix}_chi_gameover_01.png`,
    chiOverText,
    clear,
    score
  };
}

const GIRLS = {
  A: makeGirl("girlA","A","……（チー娘Aは無言で去っていった）"),
  B: makeGirl("girlB","B","……（チー娘B：見なかったことにするね）"),
  C: makeGirl("girlC","C","……（チー娘C：次はちゃんとして？）")
};

let selectedGirlKey = getSavedGirl();

/* ===== 問題（45問） ===== */
const questions = [
  { text:"あなたはチー牛ですか？" },
  { text:"チーと言えば？" },
  { text:"石原さとみさんに「チー」と言われたら？" },
  { text:"ギュウと言ってもらいたい？" },
  { text:"チーズ牛丼を頼んだ人を一瞬だけ見てしまったことはありますか？" },
  { text:"知らない人を見て『チー牛かも』と思ってしまったことはありますか？" },
  { text:"あなたの友人にチー牛はいますか？" },
  { text:"大谷翔平選手に言ってほしい言葉第1位は『チー牛食おうぜ！』だと思いますか？" },
  { text:"麻雀には、チーをされた瞬間にギュウと答えるとチーを取り消す『チーギュウ返し』がある。本当だと思いますか？" },
  { text:"あなたは三度の飯よりチー牛が好きって本当ですか？" },
  { text:"あなたはチーズ牛丼の湯気でイケメンに見える時がありますか？" },
  { text:"あなたの好きな食べ物は1位チーズ牛丼特盛り、2位大盛り、3位並盛りですか？" },
  { text:"初めて麻雀をした時、チー/ポン/カンをチー/ギュウ/ドンと間違えたことがありますか？" },
  { text:"ハイチーズをハイチー牛だと思っていた時期がありますか？" },
  { text:"写真を撮る時、チーズ牛丼を持って写りそうになったことがありますか？" },
  { text:"チー牛は人口の2%しかいないと言われている。信じますか？" },
  { text:"チーと言われると、少しだけ反応してしまいますか？" },
  { text:"『ギュウ』と答える練習をしたことがありますか？" },
  { text:"チーズ牛丼を頼む人を見ると、なぜか目が行きますか？" },
  { text:"『チー牛かも』と思っても、口には出しませんか？" },
  { text:"牛カレーには牛肉、豚カレーには豚肉、鳥カレーには鶏肉、仮面ライダーカレーには仮面ライダーの肉が使われていると思いますか？" },
  { text:"『チーと言えばギュウ』は世界共通だと思いますか？" },
  { text:"チーズ牛丼を『恥ずかしくて頼めない』人は実在すると思いますか？" },
  { text:"あなたは『頼めないが、本当は食べたい』側ですか？" },
  { text:"チー牛食おうぜ！と言われたら、行けたら行くよ…と思いますか？" },
  { text:"コンビニでチーズ系を見ると、なぜか心がざわつきますか？" },
  { text:"牛丼屋で『チーズ』の文字を見ると一瞬迷いますか？" },
  { text:"『チー』と『ギュウ』を交互に発声したことがありますか？" },
  { text:"『チーと言えばギュウ』と聞いて、少し安心しますか？" },
  { text:"あなたは自分がチー牛かどうか、時々確認したくなりますか？" },
  { text:"『チー』と聞こえたら反射的に『ギュウ』が頭に浮かびますか？" },
  { text:"『ギュウ』と言う時、なぜか誇らしい気持ちになりますか？" },
  { text:"チーズ牛丼を食べた後、ちょっと強くなった気がしますか？" },
  { text:"『チー牛』という言葉を、心の中だけで使ったことはありますか？" },
  { text:"あなたはチー牛を『悪口』ではなく『概念』だと思いますか？" },
  { text:"チーズ牛丼のCMに石原さとみさんが出演し、イベントで本人に会える世界線があると思いますか？" },
  { text:"チーと言われたら、ギュウと返したいですか？" },
  { text:"ギュウと言ったら、相手に❤で返してほしいですか？" },
  { text:"『チーと言えばギュウ』は、人生のセーフティネットだと思いますか？" },
  { text:"『チー』と『ギュウ』の関係は、もはや運命だと思いますか？" },
  { text:"チーズ牛丼を頼んだ人を見て『分かる』と思ったことはありますか？" },
  { text:"『チー牛』という言葉を聞いても、怒らずスルーできますか？" },
  { text:"あなたは『チーと言えばギュウ』の正解率に自信がありますか？" },
  { text:"『ギュウ』と答えると世界が少し平和になると思いますか？" },
  { text:"最後にひとこと。チーと言えば？" } // 45問目
];

/* 通常モード：チー娘乱入（⭐︎/⭐︎⭐︎/⭐︎⭐︎⭐︎） */
const cheeLevelsNormal = [
  { stars:1, timeMs:2400, gauge:"cool",   weight:0.60 },
  { stars:2, timeMs:1700, gauge:"yellow", weight:0.30 },
  { stars:3, timeMs:1200, gauge:"red",    weight:0.10 }
];

/* もっさり＆演出 */
const NORMAL_REACT_MS = 1050;
const QUESTION_SHOW_DELAY = 100;
const CHEE_PRE_HOLD_MS = 620;
const CUT_MS = 320;
const POST_CUT_HOLD_MS = 260;
const CHEE_SILENCE_MS = 180;
const CHEE_SUCCESS_HOLD_MS = 700;
const GIRL_REPLY_DELAY_MS = 500;
const FLASH_ON_MS = 120;

/* 通常モード：チー娘出現率 */
const CHEE_RATE = 0.35;

/* ⭐︎⭐︎⭐︎：ゲージ最初だけ速い */
const STAGE3_BOOST_MS = 500;
const STAGE3_BOOST_MULT = 1.35;

/* チー娘モード：勝つたびステージUP */
let cheeStage = 1;

/* NEW RECORD 演出フラグ（その1プレイ中だけ有効） */
let isNewRecordRun = false;

/* state */
let i=0;
let mode="quiz";           // quiz | chee | result
let locked=false;
let rafId=0;
let cheeCooldown=false;
let ended=false;
let currentCheeLevel=null;
let gameMode="normal";     // normal | cheeOnly

/* 採点用（44問のみ集計。45問目は強制ギュウ） */
const counts = { "はい":0, "いいえ":0, "チー":0, "ギュウ":0 };

/* チー娘モード：ギュウ位置が連続しないように */
let lastGyuuIndex = -1;

/* DOM */
const startScreen=document.getElementById("startScreen");
const game=document.getElementById("gameScreen");
const bg=document.querySelector("#gameScreen .bg");
const q=document.getElementById("question");
const s=document.getElementById("speech");
const c=document.getElementById("counter");
const gaugeWrap=document.getElementById("gaugeWrap");
const gauge=document.getElementById("gaugeBar");
const choices=document.getElementById("choices");
const flash=document.getElementById("flash");

const bestOnTop=document.getElementById("bestOnTop");
const newRecordBadge=document.getElementById("newRecordBadge");

const resultBox=document.getElementById("resultBox");
const resultPct=document.getElementById("resultPct");

/* =======================
   UIヘルパー
======================= */

function getSelectedGirl(){ return GIRLS[selectedGirlKey] || GIRLS.A; }

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }

function refreshTopBest(){
  bestOnTop.textContent = `ステージ${getBestStage()}`;
}
function showTopNewRecordBadge(on){
  if(on) newRecordBadge.classList.add("show");
  else newRecordBadge.classList.remove("show");
}

function selectGirl(key){
  selectedGirlKey = key;
  saveGirl(key);
  applyGirlButtonUI();
  // TOP背景も選択キャラのtopに
  document.querySelector("#startScreen .bg").style.backgroundImage = `url("${getSelectedGirl().top}")`;
}
window.selectGirl = selectGirl;

function applyGirlButtonUI(){
  const a=document.getElementById("girlBtnA");
  const b=document.getElementById("girlBtnB");
  const c=document.getElementById("girlBtnC");
  [a,b,c].forEach(x=>x.classList.remove("active"));
  if(selectedGirlKey==="A") a.classList.add("active");
  if(selectedGirlKey==="B") b.classList.add("active");
  if(selectedGirlKey==="C") c.classList.add("active");
}

/* WebAudio: 小さいポン */
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function playPopSE(){
  try{
    ensureAudio();
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(660, t0);
    osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.03);

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.10);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(t0);
    osc.stop(t0 + 0.11);
  }catch(e){}
}

function setButtonsEnabled(on){
  document.querySelectorAll("#choices button").forEach(b=>b.disabled=!on);
}
function stopCheeTimer(){
  cancelAnimationFrame(rafId);
  rafId=0;
}
function hideGauge(){
  gaugeWrap.classList.remove("show");
  gauge.style.transform="scaleX(0)";
}
function showGauge(){
  gaugeWrap.classList.add("show");
}
function resetCheeVisuals(){
  game.classList.remove("chee","cut","announce","hold","stage3plus");
  hideGauge();
  stopCheeTimer();
  gauge.classList.remove("yellow","red");
  currentCheeLevel=null;
  choices.classList.remove("chee10");
}
function flashBg(){
  flash.classList.add("on");
  setTimeout(()=> flash.classList.remove("on"), FLASH_ON_MS);
}

/* speech */
function clearSpeech(){
  s.className = "";
  s.textContent = "";
  s.innerHTML = "";
}
function setSpeechPlain(text){
  s.className = "";
  s.textContent = text;
}
function setHeartOnlyPop(isGold=false){
  s.className = isGold ? "heartGold" : "heartOnly";
  s.textContent = "❤";
  s.classList.remove("heartPop");
  void s.offsetWidth;
  s.classList.add("heartPop");
  playPopSE();
  flashBg();
}
function setGyuuWithHeart(){
  s.className = "";
  s.innerHTML = `ギュウ<span class="heartOnly">❤</span>`;
}
function setTextWithHeart(text){
  s.className = "";
  s.innerHTML = `${text}<span class="heartOnly">❤</span>`;
}

/* ボタン色（適当に） */
const buttonColors = [
  "#d64545","#c0392b","#e67e22","#f1c40f",
  "#27ae60","#16a085","#2980b9","#8e44ad",
  "#2c3e50","#7f8c8d","#ff6b6b","#ffa502"
];
function applyRandomColorsToButtons(){
  const btns = document.querySelectorAll("#choices button.choice");
  const cols = shuffle(buttonColors);
  btns.forEach((b,idx)=>{ b.style.background = cols[idx % cols.length]; });
}

/* UI: 通常4択 */
function buildChoices(){
  choices.classList.remove("chee10");
  choices.innerHTML="";
  const items=[["はい"],["いいえ"],["チー"],["ギュウ"]];
  shuffle(items).forEach(([t])=>{
    const b=document.createElement("button");
    b.textContent=t;
    b.className="choice";
    b.onclick=()=>answer(t);
    choices.appendChild(b);
  });
  applyRandomColorsToButtons();
}

/* UI: チー娘モード 10ボタン（ギュウ位置が連続しない） */
function buildChoicesChee10(){
  const decoys = [
    "はい","いいえ","チー","ポン","カン","ドン","モー","牛","チーズ","特盛り",
    "並","大盛り","湯気","ニコッ","クスッ","笑","うし","ぎゅ","チー牛","牛丼"
  ];
  const nine = shuffle(decoys.filter(x=>x!=="ギュウ")).slice(0, 9);

  // 9個のダミー + ギュウ で10個
  let labels = ["ギュウ", ...nine];

  // シャッフルして、ギュウ位置が前回と同じならやり直し（最大10回）
  for(let k=0;k<10;k++){
    labels = shuffle(labels);
    const idx = labels.indexOf("ギュウ");
    if(idx !== lastGyuuIndex){
      lastGyuuIndex = idx;
      break;
    }
  }

  choices.classList.add("chee10");
  choices.innerHTML="";

  labels.forEach(label=>{
    const b=document.createElement("button");
    b.textContent = label;
    b.className="choice";
    b.onclick=()=>answer(label);
    choices.appendChild(b);
  });

  applyRandomColorsToButtons();
}

/* 背景 */
function applyTopBg(){
  document.querySelector("#startScreen .bg").style.backgroundImage = `url("${getSelectedGirl().top}")`;
}
function applyQuestionBg(){
  const girl = getSelectedGirl();
  // 15枚をループ
  bg.style.backgroundImage = `url("${girl.normal[i % girl.normal.length]}")`;
}

/* =======================
   ゲーム進行
======================= */

function showQuestion(){
  ended=false;
  locked=false;
  mode="quiz";
  game.classList.remove("result");
  resultBox.classList.add("hide");

  resetCheeVisuals();

  applyQuestionBg();

  q.classList.add("hide");
  q.textContent=questions[i].text;
  clearSpeech();

  c.textContent=`${i+1}/${questions.length}`;
  setTimeout(()=> q.classList.remove("hide"), QUESTION_SHOW_DELAY);

  setButtonsEnabled(true);
}

/* 通常モード：チー娘乱入の難易度抽選 */
function pickCheeLevelNormal(){
  const r = Math.random();
  let acc = 0;
  for(const lv of cheeLevelsNormal){
    acc += lv.weight;
    if(r <= acc) return lv;
  }
  return cheeLevelsNormal[0];
}

/* チー娘モード用：ステージ→時間（緩急あり） */
function cheeOnlyPickStage(){
  let stage = cheeStage;

  if(Math.random() < 0.25){
    stage = Math.max(1, stage - (Math.random()<0.7 ? 1 : 2));
  }

  const stars = stage <= 1 ? 1 : (stage === 2 ? 2 : 3);
  const base = 2400 - (stage - 1) * 120;
  const timeMs = Math.max(550, Math.round(base));
  const gaugeType = stars === 1 ? "cool" : (stars === 2 ? "yellow" : "red");

  return { stars, timeMs, gauge:gaugeType, stage };
}

/* 次へ（通常モード） */
function maybeChee(){
  if(ended) return;

  // 次が存在するか
  if(i >= questions.length-1){
    // ここに来るのは通常ない（45問目後は結果へ）
    endResult();
    return;
  }

  if(!cheeCooldown && Math.random() < CHEE_RATE){
    cheeCooldown=true;

    setButtonsEnabled(false);
    game.classList.add("hold");
    setTimeout(()=>{
      game.classList.remove("hold");
      startCheeBattle(pickCheeLevelNormal());
    }, CHEE_PRE_HOLD_MS);
  }else{
    cheeCooldown=false;
    i++;
    if(i < questions.length) showQuestion();
    else endResult();
  }
}

/* チー娘戦開始（共通） */
function startCheeBattle(level){
  if(ended) return;

  mode="chee";
  locked=false;
  currentCheeLevel = level;

  game.classList.add("cut","announce","chee");
  if(level.stars >= 3) game.classList.add("stage3plus");

  // チー娘中は選択キャラの通常画像からランダム
  bg.style.backgroundImage = `url("${pick(getSelectedGirl().normal)}")`;

  setTimeout(()=>{
    game.classList.remove("cut","announce");

    q.textContent="";
    q.classList.add("hide");
    clearSpeech();

    setTimeout(()=>{
      s.className = "cheeWord" + (level.stars>=3 ? " big" : "");
      s.textContent = "チー！";

      if(gameMode === "cheeOnly") buildChoicesChee10();
      else buildChoices();

      startCheeTimer(level);
      setButtonsEnabled(true);
    }, CHEE_SILENCE_MS);

  }, CUT_MS + POST_CUT_HOLD_MS);
}

/* チー娘タイマー */
function startCheeTimer(level){
  stopCheeTimer();
  showGauge();

  gauge.classList.remove("yellow","red");
  if(level.gauge === "yellow") gauge.classList.add("yellow");
  if(level.gauge === "red") gauge.classList.add("red");

  const start=performance.now();

  const tick=(t)=>{
    let elapsed = t - start;

    if(level.stars >= 3 && elapsed < STAGE3_BOOST_MS){
      elapsed = elapsed * STAGE3_BOOST_MULT;
    }else if(level.stars >= 3 && elapsed >= STAGE3_BOOST_MS){
      const boosted = STAGE3_BOOST_MS * STAGE3_BOOST_MULT;
      elapsed = boosted + (elapsed - STAGE3_BOOST_MS);
    }

    const r = Math.max(0, 1 - (elapsed / level.timeMs));
    gauge.style.transform = `scaleX(${r})`;

    if(level.gauge === "cool"){
      gauge.style.background = `hsl(${210 * r}, 85%, 55%)`;
    }

    if(r > 0){
      rafId = requestAnimationFrame(tick);
    }else{
      gameOver(true); // チー娘負け
    }
  };

  rafId = requestAnimationFrame(tick);
}

/* チー娘モード：勝利でステージ+1 & NEW RECORD判定 */
function nextCheeOnlyAfterWin(){
  cheeStage++;
  c.textContent = `ステージ${cheeStage}`;

  const best = getBestStage();
  if(cheeStage > best){
    setBestStage(cheeStage);
    isNewRecordRun = true;
  }

  const lv = cheeOnlyPickStage();
  startCheeBattle(lv);
}

/* =======================
   採点（44問）
======================= */

function computeScorePercent(cnt){
  // diff = max - min
  const vals = Object.values(cnt);
  const max = Math.max(...vals);
  const min = Math.min(...vals);
  const diff = max - min;

  // 基本：diff小さいほど高い（0→100, 44→0）
  let p = Math.round(((44 - diff) / 44) * 100);

  // 例外：全て同じ（44/0/0/0）
  if(max === 44 && min === 0){
    const key = Object.keys(cnt).find(k=>cnt[k]===44);
    const map = { "はい":48, "いいえ":42, "チー":57, "ギュウ":53 };
    if(map[key] != null) p = map[key];
  }

  // 例外：43+1
  // 1つが43、別の1つが1、残り0
  const sorted = vals.slice().sort((a,b)=>b-a);
  if(sorted[0]===43 && sorted[1]===1 && sorted[2]===0 && sorted[3]===0){
    p = 44;
  }

  // 例外：11ずつ（本来100だけど、バレ防止で51）
  if(vals.every(v=>v===11)){
    p = 51;
  }

  // 範囲保護
  p = Math.max(0, Math.min(100, p));
  return p;
}

function computeRank(p){
  // 適当な5段階（必要なら後で調整）
  if(p >= 80) return "s";
  if(p >= 65) return "a";
  if(p >= 50) return "b";
  if(p >= 35) return "c";
  return "d";
}

/* =======================
   回答処理
======================= */

function answer(t){
  if(locked || ended) return;
  locked=true;
  setButtonsEnabled(false);

  ensureAudio();
  q.classList.add("hide");

  // チー娘戦
  if(mode==="chee"){
    if(t==="ギュウ"){
      stopCheeTimer();
      hideGauge();

      setTimeout(()=> setHeartOnlyPop(isNewRecordRun), GIRL_REPLY_DELAY_MS);

      setTimeout(()=>{
        resetCheeVisuals();

        if(gameMode === "cheeOnly"){
          nextCheeOnlyAfterWin();
          return;
        }

        // 通常に戻る：次の問題へ
        i++;
        if(i < questions.length) showQuestion();
        else endResult();
      }, GIRL_REPLY_DELAY_MS + CHEE_SUCCESS_HOLD_MS);

    }else{
      gameOver(true); // チー娘負け
    }
    return;
  }

  // 通常回答：45問目だけ特殊（ギュウ以外即ゲームオーバー）
  const isLast = (i === 44);

  // 44問までは集計
  if(!isLast){
    if(counts[t] != null) counts[t]++;
  }

  // 女の子返事（チー以外は ❤ 付け、チーはギュウ❤）
  setTimeout(()=>{
    if(t==="はい")        setTextWithHeart("笑");
    else if(t==="いいえ") setTextWithHeart("クスッ");
    else if(t==="ギュウ") setTextWithHeart("ニコッ");
    else if(t==="チー")   setGyuuWithHeart();
    else                  setTextWithHeart("笑");
  }, GIRL_REPLY_DELAY_MS);

  setTimeout(()=>{
    if(isLast){
      if(t !== "ギュウ"){
        gameOver(false); // 通常ゲームオーバー
        return;
      }
      // クリア → 結果
      endResult();
      return;
    }
    // 通常は次へ（乱入あり）
    maybeChee();
  }, GIRL_REPLY_DELAY_MS + NORMAL_REACT_MS);
}

/* =======================
   結果 / ゲームオーバー / ボタン
======================= */

function renderEndButtonsDelayed(delayMs){
  choices.innerHTML = "";
  setTimeout(()=>{
    choices.innerHTML = `
      <button class="choice" style="grid-column:1/-1" onclick="restart(gameMode)">もう一回</button>
      <button class="choice" style="grid-column:1/-1" onclick="backToTop()">トップに戻る</button>
    `;
    applyRandomColorsToButtons();
  }, delayMs);
}

function endResult(){
  ended=true;
  mode="result";
  resetCheeVisuals();

  game.classList.add("result");
  resultBox.classList.remove("hide");

  const p = computeScorePercent(counts);
  const rank = computeRank(p);

  // RESULT画像：ランクに応じてランダム
  const girl = getSelectedGirl();
  const img = pick(girl.score[rank] || [girl.top]);
  bg.style.backgroundImage = `url("${img}")`;

  // RESULT表示
  resultPct.textContent = `${p}%`;

  // 表示
  q.textContent="";
  clearSpeech();
  c.textContent = "RESULT";

  renderEndButtonsDelayed(0);
}

function gameOver(isCheeBattle){
  ended=true;
  resetCheeVisuals();

  game.classList.remove("result");
  resultBox.classList.add("hide");

  const girl = getSelectedGirl();

  if(gameMode === "cheeOnly"){
    // チー娘モードのゲームオーバー（画像＆文言は女の子別）
    const reachedStage = cheeStage;
    const bestStage = getBestStage();

    if(reachedStage > bestStage){
      setBestStage(reachedStage);
      isNewRecordRun = true;
    }

    bg.style.backgroundImage = `url("${girl.chiGameover}")`;
    clearSpeech();
    setSpeechPlain(girl.chiOverText);

    // ヘッダーは残す（ステージ表示）
    c.textContent = `GAME OVER (ステージ${reachedStage})`;

    // 誤タップ防止：1秒後にボタン
    renderEndButtonsDelayed(1000);
    return;
  }

  // 通常モード：ゲームオーバー（画像は女の子別）
  bg.style.backgroundImage = `url("${girl.gameover}")`;
  clearSpeech();
  setSpeechPlain("あなたチー牛じゃなかったのね。。");
  c.textContent = "GAME OVER";

  renderEndButtonsDelayed(1000);
}

/* =======================
   リスタート / TOPへ
======================= */

function restart(modeName){
  ended=false;
  cheeCooldown=false;
  mode="quiz";
  locked=false;
  stopCheeTimer();
  resetCheeVisuals();

  gameMode = modeName || "normal";

  // NEW RECORD フラグはプレイ開始時OFF
  isNewRecordRun = false;

  // RESULT集計をリセット
  counts["はい"]=0; counts["いいえ"]=0; counts["チー"]=0; counts["ギュウ"]=0;

  // RESULT UI off
  game.classList.remove("result");
  resultBox.classList.add("hide");

  if(gameMode === "cheeOnly"){
    cheeStage = 1;
    lastGyuuIndex = -1;
    c.textContent = `ステージ${cheeStage}`;
    startCheeBattle(cheeOnlyPickStage());
  }else{
    i=0;
    buildChoices();
    showQuestion();
  }
}

function backToTop(){
  ended=false;
  stopCheeTimer();
  resetCheeVisuals();
  locked=false;
  mode="quiz";
  cheeCooldown=false;

  game.classList.remove("result");
  resultBox.classList.add("hide");

  game.classList.add("hide");
  startScreen.classList.remove("hide");

  refreshTopBest();
  showTopNewRecordBadge(isNewRecordRun);

  applyTopBg();
  applyGirlButtonUI();
}

/* start buttons */
document.getElementById("startBtnNormal").onclick=()=>{
  startScreen.classList.add("hide");
  game.classList.remove("hide");
  showTopNewRecordBadge(false);
  restart("normal");
};
document.getElementById("startBtnChee").onclick=()=>{
  startScreen.classList.add("hide");
  game.classList.remove("hide");
  showTopNewRecordBadge(false);
  restart("cheeOnly");
};

window.restart=restart;
window.backToTop=backToTop;

/* 初期化 */
function init(){
  selectedGirlKey = getSavedGirl();
  applyGirlButtonUI();
  refreshTopBest();
  applyTopBg();
}
init();
</script>
