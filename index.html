<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>チーと言えばギュウと答える</title>
  <style>
    :root{
      --bg:#0f0f10;
      --text:#f2f2f2;
      --sub:#b9bcc6;
      --danger:#fb7185;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, #1a1b20 0%, var(--bg) 55%);
      color:var(--text);
    }
    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 14px 30px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 12px;
    }
    .brand{
      font-weight:800;
      letter-spacing:.06em;
      font-size: 15px;
      opacity:.95;
    }
    .pill{
      display:flex;
      gap:8px;
      align-items:center;
      color:var(--sub);
      font-size:12px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill b{color:var(--text)}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .imgArea{
      position:relative;
      width:100%;
      aspect-ratio: 3 / 4;
      background:#111;
    }
    .imgArea img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      background:#111;
    }
    .topBar{
      position:absolute;
      left:10px; right:10px; top:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      pointer-events:none;
    }
    .badge{
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color:#fff;
      pointer-events:none;
    }
    .badge .sub{opacity:.85; font-weight:600}
    .badge .val{font-weight:900; letter-spacing:.02em}

    .bubble{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 12px;
      background: rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px 12px;
      line-height: 1.45;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,.28);
    }
    .bubble small{display:block;color:var(--sub);font-size:12px;margin-top:6px}

    .choices{
      padding: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button.choice{
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      color:var(--text);
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .04em;
      cursor:pointer;
      transition: transform .06s ease, filter .15s ease, border-color .15s ease;
    }
    button.choice:active{transform: translateY(1px) scale(.995)}
    button.choice:disabled{
      opacity:.45;
      cursor:not-allowed;
      filter: grayscale(.2);
    }

    .footerBtns{
      display:flex;
      gap:10px;
      padding: 0 12px 12px;
    }
    .btn{
      flex:1;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 10px;
      font-weight: 800;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px)}
    .btn.secondary{color:var(--sub)}
    .btn.danger{border-color: rgba(251,113,133,.35); color:#ffd0d8}
    .hidden{display:none !important}

    .note{
      margin-top:10px;
      font-size:12px;
      color:var(--sub);
      line-height:1.6;
    }

    .modalBg{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 999;
    }
    .modal{
      width:min(520px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .modal h2{
      margin: 6px 0 6px;
      font-size: 16px;
      letter-spacing:.04em;
    }
    .modal p{margin:0;color:var(--sub);font-size:13px;line-height:1.5}
    .grid3{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .girlCard{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      border-radius: 16px;
      overflow:hidden;
      cursor:pointer;
      transition: transform .06s ease;
    }
    .girlCard:active{transform: translateY(1px)}
    .girlCard img{
      width:100%;
      aspect-ratio:1/1;
      object-fit: cover;
      display:block;
      background:#111;
    }
    .girlCard .cap{
      padding: 8px 8px 10px;
      text-align:center;
      font-weight:900;
      font-size: 12px;
      letter-spacing:.05em;
      color: var(--text);
    }
    .tiny{
      font-size:11px;
      color:var(--sub);
      margin-top:8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">チーと言えばギュウと答える</div>
      <div class="pill">
        <span>ベスト</span><b id="bestStage">—</b>
        <span>／</span>
        <span>到達</span><b id="reachedStage">—</b>
      </div>
    </header>

    <div class="card">
      <div class="imgArea">
        <img id="mainImg" alt="girl" src="assets/start_bg.png" />
        <div class="topBar">
          <div class="badge"><span class="sub">STAGE</span> <span class="val" id="stageLabel">1</span></div>
          <div class="badge"><span class="sub">MODE</span> <span class="val" id="modeLabel">NORMAL</span></div>
        </div>
        <div class="bubble" id="bubbleText">女の子を選んでね</div>
      </div>

      <div class="choices" id="choices">
        <button class="choice" data-choice="yes">はい</button>
        <button class="choice" data-choice="no">いいえ</button>
        <button class="choice" data-choice="chi">チー</button>
        <button class="choice" data-choice="gyu">ギュウ</button>
      </div>

      <div class="footerBtns">
        <button class="btn secondary" id="btnBackTop">トップに戻る</button>
        <button class="btn danger hidden" id="btnRetry">もう一回</button>
      </div>
    </div>

    <div class="note">
      ※ 即死（間違えたらゲームオーバー）は <b>STAGE45だけ</b><br>
      ※ 1〜44 は間違えても進行（ゲームオーバーにならない）
    </div>
  </div>

  <div class="modalBg hidden" id="girlModal">
    <div class="modal">
      <h2>女の子を選んでね</h2>
      <p>最初は必ず選択。以後は「トップに戻る」から変更できます。</p>
      <div class="grid3">
        <div class="girlCard" data-girl="A">
          <img src="assets/girlA_icon.png" alt="girlA">
          <div class="cap">girlA</div>
        </div>
        <div class="girlCard" data-girl="B">
          <img src="assets/girlB_icon.png" alt="girlB">
          <div class="cap">girlB</div>
        </div>
        <div class="girlCard" data-girl="C">
          <img src="assets/girlC_icon.png" alt="girlC">
          <div class="cap">girlC</div>
        </div>
      </div>
      <div class="tiny">（icon は .png 前提。いまのassetsと一致）</div>
    </div>
  </div>

  <script>
    const LS = {
      girl: "chi_gyu_selected_girl",
      bestStage: "chi_gyu_best_stage",
      reachedStage: "chi_gyu_reached_stage",
      counts: "chi_gyu_choice_counts"
    };

    const QUESTIONS = [
      { q: "あなたはチー牛ですか？", a: "yes" },
      { q: "チーと言えば？", a: "gyu" },
      { q: "石原さとみさんに「チー」と言われたら？", a: "gyu" },
      { q: "石原さとみさんに「ギュウ」と言ってもらいたい？", a: "yes" },
      { q: "チーズ牛丼を頼んだ人を一瞬だけ見てしまったことはありますか？", a: "yes" },
      { q: "知らない人を見て「チー牛かも」と思ってしまったことはありますか？", a: "yes" },
      { q: "麻雀には、チーをされた瞬間にギュウと答えるとチーを取り消す『チーギュウ返し』という技がある。本当だと思いますか？", a: "yes" },
      { q: "あなたは三度の飯よりチー牛が好きって本当ですか？", a: "yes" },
      { q: "山本由伸選手の「負けると言う選択肢はない」という名言はとてもカッコ良かったですね？", a: "yes" },
      { q: "山本由伸選手に「チーズ牛丼を食べないという選択肢はない」と言ってもらいたいですか？", a: "yes" },
      { q: "ギリシャの哲学者アリストテレスの「すべての者は生まれながらに知恵を求める。」有名な名言は知っていますか？", a: "yes" },
      { q: "チー牛界隈にも「すべての者は生まれながらにチーズ牛丼を求める。」という名言があるのを知っていますか？", a: "yes" },
      ...Array.from({length: 45 - 12}, (_,i)=>({
        q: `（仮）問題 ${i+13}：あなたは「ギュウ」と言ってもらえると嬉しい？`,
        a: "yes"
      }))
    ];
    QUESTIONS[44] = { q: "【最終】ここは「ギュウ」以外は即ゲームオーバーです。どうする？", a: "gyu", finalMustGyu: true };

    const FALLBACK_IMG = "assets/start_bg.png";

    function normalImgPath(girl, n){
      return `assets/girl${girl}_normal_${String(n).padStart(2,"0")}.png`;
    }
    function topImgPath(girl){
      return `assets/girl${girl}_top_01.png`;
    }
    function gameoverImgPath(girl){
      return `assets/girl${girl}_gameover_01.png`;
    }
    function chiGameoverImgPath(girl){
      return `assets/girl${girl}_chi_gameover_01.png`;
    }
    function clearImgPath(girl, n){
      return `assets/girl${girl}_clear_${String(n).padStart(2,"0")}.png`;
    }
    function scoreImgPath(girl, rank, n){
      return `assets/girl${girl}_score_${rank}_${String(n).padStart(2,"0")}.png`;
    }

    const EXCEPTIONS = [
      { key: "all_yes", percent: 48 },
      { key: "all_no", percent: 42 },
      { key: "all_chi", percent: 57 },
      { key: "all_gyu", percent: 53 },
      { key: "43_plus_1", percent: 44 },
      { key: "11_each", percent: 51 }
    ];

    function diffToPercent(diff){
      const t = Math.min(44, Math.max(0, diff));
      const base = 68 - (t * 1.1);
      const eased = Math.max(18, Math.min(72, base));
      return Math.round(eased);
    }
    function percentToRank(p){
      if (p >= 65) return "s";
      if (p >= 58) return "a";
      if (p >= 50) return "b";
      if (p >= 42) return "c";
      return "d";
    }
    function isChigyuted(p){ return p >= 100; }

    function detectException(counts){
      const total = counts.yes + counts.no + counts.chi + counts.gyu;
      if (total !== 44) return null;

      const arr = [counts.yes, counts.no, counts.chi, counts.gyu];
      const max = Math.max(...arr);
      const min = Math.min(...arr);

      if (counts.yes === 44) return "all_yes";
      if (counts.no === 44) return "all_no";
      if (counts.chi === 44) return "all_chi";
      if (counts.gyu === 44) return "all_gyu";
      if (counts.yes===11 && counts.no===11 && counts.chi===11 && counts.gyu===11) return "11_each";
      if (max === 43 && min === 0) return "43_plus_1";
      return null;
    }

    let state = {
      girl: null,
      stage: 1,
      gameOver: false,
      cleared: false,
      mode: "NORMAL",
      counts: { yes:0, no:0, chi:0, gyu:0 },
      lastWrongChoice: null
    };

    const el = {
      mainImg: document.getElementById("mainImg"),
      bubble: document.getElementById("bubbleText"),
      stageLabel: document.getElementById("stageLabel"),
      modeLabel: document.getElementById("modeLabel"),
      bestStage: document.getElementById("bestStage"),
      reachedStage: document.getElementById("reachedStage"),
      choices: document.getElementById("choices"),
      btnRetry: document.getElementById("btnRetry"),
      btnBackTop: document.getElementById("btnBackTop"),
      girlModal: document.getElementById("girlModal")
    };

    function setImgSafe(src){
      const img = el.mainImg;
      img.onerror = null;
      img.src = src;
      img.onerror = () => {
        img.onerror = null;
        img.src = FALLBACK_IMG;
      };
    }

    function enableChoices(on){
      [...el.choices.querySelectorAll("button.choice")].forEach(b=>b.disabled = !on);
    }

    function loadSaved(){
      const g = localStorage.getItem(LS.girl);
      if (g) state.girl = g;

      const best = parseInt(localStorage.getItem(LS.bestStage) || "0", 10);
      const reached = parseInt(localStorage.getItem(LS.reachedStage) || "0", 10);
      el.bestStage.textContent = best ? `STAGE ${best}` : "—";
      el.reachedStage.textContent = reached ? `STAGE ${reached}` : "—";

      try{
        const c = JSON.parse(localStorage.getItem(LS.counts) || "null");
        if (c && typeof c === "object") state.counts = { ...state.counts, ...c };
      }catch(e){}
    }

    function saveBestAndReached(){
      const best = parseInt(localStorage.getItem(LS.bestStage) || "0", 10);
      const reached = Math.max(parseInt(localStorage.getItem(LS.reachedStage) || "0", 10), state.stage);
      localStorage.setItem(LS.reachedStage, String(reached));
      if (state.stage > best) localStorage.setItem(LS.bestStage, String(state.stage));

      el.bestStage.textContent = `STAGE ${parseInt(localStorage.getItem(LS.bestStage),10)}`;
      el.reachedStage.textContent = `STAGE ${parseInt(localStorage.getItem(LS.reachedStage),10)}`;
    }

    function randomNormalIndex(){ return 1 + Math.floor(Math.random()*15); }

    function showGirlSelect(force=false){
      if (!state.girl || force){
        el.girlModal.classList.remove("hidden");
        enableChoices(false);
      }
    }
    function hideGirlSelect(){ el.girlModal.classList.add("hidden"); }

    function setGirl(g){
      state.girl = g;
      localStorage.setItem(LS.girl, g);
      hideGirlSelect();
      goTop();
    }

    function goTop(){
      state.stage = 1;
      state.gameOver = false;
      state.cleared = false;
      state.mode = "NORMAL";
      state.counts = { yes:0, no:0, chi:0, gyu:0 };
      localStorage.setItem(LS.counts, JSON.stringify(state.counts));
      el.btnRetry.classList.add("hidden");

      el.modeLabel.textContent = state.mode;
      el.stageLabel.textContent = String(state.stage);

      if (!state.girl){
        el.bubble.textContent = "女の子を選んでね";
        setImgSafe(FALLBACK_IMG);
        showGirlSelect(true);
        return;
      }

      enableChoices(true);
      renderStage(true);
    }

    function renderStage(preferTop=false){
      if (!state.girl){
        el.bubble.textContent = "女の子を選んでね";
        setImgSafe(FALLBACK_IMG);
        showGirlSelect(true);
        return;
      }

      el.modeLabel.textContent = state.mode;
      el.stageLabel.textContent = String(state.stage);

      const qObj = QUESTIONS[state.stage - 1];
      el.bubble.textContent = qObj.q;

      if (state.gameOver){
        const isChi = (state.lastWrongChoice === "chi");
        setImgSafe(isChi ? chiGameoverImgPath(state.girl) : gameoverImgPath(state.girl));
      } else if (state.cleared){
        setImgSafe(clearImgPath(state.girl, 1 + Math.floor(Math.random()*3)));
      } else {
        if (preferTop && state.stage === 1){
          setImgSafe(topImgPath(state.girl));
        } else {
          setImgSafe(normalImgPath(state.girl, randomNormalIndex()));
        }
      }

      if (state.gameOver){
        el.btnRetry.classList.add("hidden");
        setTimeout(()=> el.btnRetry.classList.remove("hidden"), 1000);
      } else {
        el.btnRetry.classList.add("hidden");
      }
    }

    /********************
     * ここが変更点：
     * ・STAGE1〜44は間違えてもゲームオーバーにしない
     * ・即死はSTAGE45だけ
     ********************/
    function onAnswer(choice){
      if (!state.girl){
        showGirlSelect(true);
        return;
      }
      if (state.gameOver || state.cleared) return;

      const qObj = QUESTIONS[state.stage - 1];

      // ★ 即死はSTAGE45だけ（finalMustGyu の時だけ）
      if (qObj.finalMustGyu && choice !== "gyu"){
        state.gameOver = true;
        state.lastWrongChoice = choice;
        enableChoices(false);
        renderStage();
        saveBestAndReached();
        return;
      }

      // ★ STAGE1〜44は「正誤に関係なく進行」
      // ただし採点用カウントは “実際に押したもの” をそのまま数える（あなたの44問集計仕様）
      if (state.stage <= 44){
        state.counts[choice] = (state.counts[choice] || 0) + 1;
        localStorage.setItem(LS.counts, JSON.stringify(state.counts));
      }

      // 正解演出：常に「ギュウ」固定
      const prevText = el.bubble.textContent;
      el.bubble.textContent = "ギュウ";
      setTimeout(()=> { el.bubble.textContent = prevText; }, 450);

      // 次へ or クリア
      if (state.stage === 45){
        state.cleared = true;
        enableChoices(false);
        saveBestAndReached();
        showScore();
        return;
      }

      state.stage += 1;
      saveBestAndReached();
      renderStage(false);
    }

    function showScore(){
      state.mode = "SCORE";
      el.modeLabel.textContent = state.mode;

      const arr = [state.counts.yes, state.counts.no, state.counts.chi, state.counts.gyu];
      const diff = Math.max(...arr) - Math.min(...arr);

      let percent = diffToPercent(diff);

      const exKey = detectException(state.counts);
      if (exKey){
        const ex = EXCEPTIONS.find(x=>x.key===exKey);
        if (ex) percent = ex.percent;
      }

      if (!exKey && Math.random() < 0.02) percent = 100;

      const rank = percentToRank(percent);
      setImgSafe(scoreImgPath(state.girl, rank, 1 + Math.floor(Math.random()*3)));

      const bubble = el.bubble;
      bubble.innerHTML = `チー牛度 <b style="font-size:18px;letter-spacing:.04em">0%</b><small>計算中…</small>`;

      let cur = 0;
      const target = percent;
      const step = Math.max(1, Math.floor(target / 24));

      const timer = setInterval(()=>{
        cur += step;
        if (cur >= target){
          cur = target;
          clearInterval(timer);

          setTimeout(()=>{
            const chig = isChigyuted(target);
            const rankLabel = chig ? "チー牛ギフテッド（チギュテッド）" : `RANK ${rank.toUpperCase()}`;
            const tone = chig ? "（上位2%）" : "";
            bubble.innerHTML =
              `チー牛度 <b style="font-size:20px;letter-spacing:.04em">${target}%</b><br>` +
              `<small style="margin-top:8px;display:block">${rankLabel} ${tone}</small>`;
          }, 500);

          el.btnRetry.classList.add("hidden");
          enableChoices(false);
        } else {
          bubble.innerHTML = `チー牛度 <b style="font-size:18px;letter-spacing:.04em">${cur}%</b><small>計算中…</small>`;
        }
      }, 30);
    }

    document.querySelectorAll("button.choice").forEach(btn=>{
      btn.addEventListener("click", ()=> onAnswer(btn.dataset.choice));
    });

    el.btnBackTop.addEventListener("click", ()=>{
      showGirlSelect(true);
    });

    el.btnRetry.addEventListener("click", ()=>{
      goTop();
    });

    document.querySelectorAll(".girlCard").forEach(card=>{
      card.addEventListener("click", ()=>{
        setGirl(card.dataset.girl);
      });
    });

    loadSaved();
    if (state.girl){
      goTop();
    } else {
      enableChoices(false);
      setImgSafe(FALLBACK_IMG);
      el.bubble.textContent = "女の子を選んでね";
      showGirlSelect(true);
    }
  </script>
</body>
</html>
