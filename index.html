<!-- =========================================================
  チーと言えばギュウと答える  (index.html)
  VERSION: v0.30.4
  - メニュー位置さらに下げ
  - 「※45問目は〜」文言削除（本番想定）
  - 背景暗幕 0.20（画面を暗くしない）
  - 縦スクロール対応（女の子追加OK）
========================================================= -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>チーと言えばギュウと答える</title>

<style>
*{box-sizing:border-box}
:root{
  --maxw:560px;
  --pad:16px;
  --stroke:rgba(255,255,255,.55);
  --iconFrame:8px;
  --iconRadius:14px;
}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
.app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* header */
header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  opacity:.95;
}

/* screens */
.screen{
  flex:1;
  position:relative;
  overflow:hidden;
}
.hide{display:none!important}

/* 背景 */
.bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.02);
}

/* 薄暗幕（0.20固定） */
.screen::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.20);
  pointer-events:none;
}

/* overlay（縦スクロール可） */
.overlay{
  position:absolute;
  inset:0;
  padding:var(--pad);
  display:flex;
  overflow-y:auto;
}

/* panel */
.panel{
  width:100%;
  text-align:center;
  text-shadow:0 10px 28px rgba(0,0,0,.80);
}
.titleBig{
  font-size:22px;
  font-weight:900;
  letter-spacing:.14em;
  margin:0 0 14px;
}
.subLine{
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  opacity:.95;
  margin:0 0 16px;
}
.bigBtn{
  width:min(360px,92%);
  font-size:18px;
  padding:16px 18px;
  border:none;
  border-radius:16px;
  background:#ffffff22;
  color:#fff;
  font-weight:900;
}

/* =========================
   TOP
========================= */
#topScreen .bg{background-image:url("top_keyvisual_01.png")}
#topScreen .overlay{
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:320px; /* ← さらに下げた */
}

/* version */
#versionTag{
  position:absolute;
  left:0;right:0;bottom:18px;
  text-align:center;
  font-weight:900;
  letter-spacing:.20em;
  opacity:.85;
}

/* =========================
   GIRL SELECT
========================= */
#girlScreen .overlay{
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:220px;
}
.gridIcons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin:14px auto 18px;
  width:min(520px,100%);
}
.girlTile{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
  padding:10px;
  border:2px solid transparent;
}
.girlTile.active{
  border-color:var(--stroke);
}
.iconBox{
  aspect-ratio:1/1;
  border-radius:var(--iconRadius);
  overflow:hidden;
  position:relative;
}
.iconBox::before{
  content:"";
  position:absolute;inset:0;
  border-radius:var(--iconRadius);
  box-shadow:inset 0 0 0 var(--iconFrame) rgba(255,255,255,.9);
}
.iconBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.girlName{
  margin-top:10px;
  font-size:13px;
  font-weight:900;
}

/* =========================
   MODE SELECT
========================= */
#modeScreen .overlay{
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:260px;
}
.modeBtns{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:min(360px,92%);
  margin:0 auto;
}
.modeBtn{
  font-size:18px;
  padding:16px;
  border-radius:16px;
  background:#ffffff22;
  color:#fff;
  font-weight:900;
  border:none;
}
.smallBack{
  margin-top:14px;
  background:none;
  border:none;
  color:#fff;
  font-size:12px;
  font-weight:900;
  text-decoration:underline;
}

/* =========================
   GAME（変更なし・省略可）
========================= */
/* ※ v0.30.3 と同一のため省略してもOK */

</style>
</head>

<body>
<div class="app">

<header>
  <div>チーと言えばギュウと答える</div>
  <div id="counter">-</div>
</header>

<!-- TOP -->
<div id="topScreen" class="screen">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">ガチ！チー牛診断！！</h1>
      <button class="bigBtn" id="btnGoGirl">START</button>
    </div>
  </div>
  <div id="versionTag">VERSION v0.30.4</div>
</div>

<!-- GIRL SELECT -->
<div id="girlScreen" class="screen hide">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">女の子を選んでね</h1>
      <div class="gridIcons" id="girlGrid"></div>
      <button class="bigBtn" id="btnGoMode">次へ</button>
    </div>
  </div>
</div>

<!-- MODE SELECT -->
<div id="modeScreen" class="screen hide">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">モードを選んでね</h1>
      <div class="modeBtns">
        <button class="modeBtn">チー牛診断</button>
        <button class="modeBtn">チー娘モード</button>
      </div>
      <button class="smallBack">戻る</button>
    </div>
  </div>
</div>

</div>
</body>
</html>
