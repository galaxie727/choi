<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ガチ！チー牛診断！！</title>
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ui: rgba(0,0,0,.55);
      --panel: rgba(255,255,255,.16);
      --panel-strong: rgba(255,255,255,.22);
      --text: #fff;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 18px;
      --btn-radius: 18px;
      --gap: 14px;
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      color: var(--text);
      background:#000;
      height:100dvh;
      overflow:hidden;
    }

    /* --- Background --- */
    #bg{
      position:fixed; inset:0;
      background:#111 center/cover no-repeat;
      filter:saturate(1.05);
      transform: scale(1.02);
    }
    #bg::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.50));
    }

    /* --- Top bar (menu lowered) --- */
    .topbar{
      position:fixed;
      top: calc(var(--safe-top) + 10px); /* ←メニューを下げる */
      left:0; right:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 14px;
      z-index:50;
      pointer-events:none;
      gap:10px;
    }
    .topbar .left, .topbar .right{
      pointer-events:auto;
      font-size: 14px;
      opacity:.95;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.14);
      padding: 8px 10px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      white-space:nowrap;
    }
    .topbar.hidden{display:none;}

    /* --- Scenes --- */
    .scene{
      position:absolute; inset:0;
      display:none;
      padding: calc(var(--safe-top) + 70px) 16px calc(var(--safe-bottom) + 18px);
      overflow:hidden;
    }
    .scene.active{display:block;}

    /* --- Panels / bubble --- */
    .glass{
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* Speech bubble text sizing fix */
    .bubble{
      width:100%;
      padding: 16px 16px;
      margin: 0 auto 14px;
      max-width: 760px;
      line-height: 1.25;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-weight: 800;
      font-size: clamp(18px, 3.8vw, 40px); /* ←長文でも破綻しにくい */
      text-shadow: 0 2px 14px rgba(0,0,0,.55);
    }
    .bubble.small{
      font-size: clamp(16px, 3.0vw, 28px);
      font-weight: 800;
    }

    /* --- Center layout --- */
    .center{
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap: 18px;
      text-align:center;
    }

    /* --- Title --- */
    .title{
      font-weight: 900;
      font-size: clamp(26px, 7.2vw, 46px);
      letter-spacing:.03em;
      text-shadow: 0 2px 14px rgba(0,0,0,.6);
    }

    /* --- Buttons --- */
    .btn{
      width:min(520px, 92vw);
      padding: 16px 18px;
      border-radius: var(--btn-radius);
      border: 0;
      color:#fff;
      font-weight: 900;
      font-size: 20px;
      letter-spacing:.04em;
      box-shadow: var(--shadow);
      cursor:pointer;
      transition: transform .08s ease, filter .08s ease;
    }
    .btn:active{ transform: scale(.985); filter:brightness(.95); }
    .btn.primary{ background: rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.18); }
    .btn.blue{ background: #2b79c2; }
    .btn.purple{ background: #7f49b8; }
    .btn.yellow{ background: #f0c300; color:#1b1b1b; }
    .btn.red{ background: #c0382b; }

    /* --- Girl selection grid --- */
    .grid{
      width: min(680px, 96vw);
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 10px auto 16px;
    }
    .card{
      position:relative;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: var(--shadow);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(6px);
      cursor:pointer;
    }
    .card img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      filter: saturate(1.05);
    }
    .card .label{
      position:absolute;
      left:10px; bottom:10px;
      font-weight: 900;
      font-size: 14px;
      background: rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.14);
      padding: 6px 10px;
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    .card.locked{
      cursor:not-allowed;
      filter: grayscale(.08);
      opacity: .92;
    }
    .card.locked::after{
      content:"🔒";
      position:absolute;
      top:10px; right:10px;
      background: rgba(0,0,0,.62);
      border:1px solid rgba(255,255,255,.18);
      width:38px; height:38px;
      border-radius: 999px;
      display:grid; place-items:center;
      font-size: 18px;
      box-shadow: var(--shadow);
    }

    .hint{
      opacity:.92;
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
      margin-top: 6px;
    }

    /* --- Mode select --- */
    .modeWrap{
      width:min(680px, 96vw);
      margin: 0 auto;
      display:flex;
      flex-direction:column;
      gap: 14px;
      align-items:center;
    }

    /* --- Quiz buttons (4 choices) --- */
    .choiceGrid{
      width:min(760px, 96vw);
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 14px auto 0;
    }
    .choice{
      padding: 16px 14px;
      border-radius: 18px;
      border:0;
      font-weight: 900;
      font-size: 20px;
      color:#fff;
      box-shadow: var(--shadow);
      cursor:pointer;
      transition: transform .08s ease, filter .08s ease;
    }
    .choice:active{ transform: scale(.985); filter:brightness(.95); }
    .c1{ background:#c0382b; } /* ギュウ */
    .c2{ background:#d14f4f; } /* チー */
    .c3{ background:#f0b400; color:#1b1b1b;} /* はい */
    .c4{ background:#2fb25f; } /* いいえ */

    /* --- Result / percent positioning (moved slightly down) --- */
    .resultRow{
      width:min(760px, 96vw);
      margin: 12px auto 14px;
      padding: 18px 16px;
    }
    .resultLine{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      margin-top: 10px; /* ←少し下へ */
    }
    .resultLabel{
      font-size: clamp(18px, 4vw, 28px);
      font-weight: 900;
      opacity:.96;
    }
    .percent{
      font-size: clamp(52px, 12vw, 92px);
      font-weight: 1000;
      letter-spacing:.02em;
      text-shadow: 0 2px 18px rgba(0,0,0,.55);
      line-height: .95;
      min-width: 2.6em;
      text-align:right;
    }

    /* --- Overlay for "チー娘演出" --- */
    .flash{
      position:fixed; inset:0;
      display:none;
      z-index:80;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px);
      align-items:center;
      justify-content:center;
      padding: 24px;
    }
    .flash.active{ display:flex; }
    .flashBox{
      width:min(720px, 92vw);
      padding: 18px 18px;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.16);
      box-shadow: var(--shadow);
      text-align:center;
      animation: pop .14s ease;
    }
    @keyframes pop{ from{ transform: scale(.98); opacity:.0;} to{ transform: scale(1); opacity:1; } }
    .flashTitle{
      font-size: clamp(26px, 6vw, 44px);
      font-weight: 1000;
      margin-bottom: 6px;
    }
    .flashText{
      font-size: clamp(16px, 3.6vw, 22px);
      opacity:.95;
      font-weight: 800;
      line-height:1.35;
    }

    /* --- Utility --- */
    .rowBtns{
      width:min(760px, 96vw);
      margin: 10px auto 0;
      display:flex;
      flex-direction:column;
      gap: 14px;
      align-items:center;
    }
    .subnote{
      width:min(760px, 96vw);
      margin: 10px auto 0;
      opacity:.9;
      font-weight: 700;
      font-size: 13px;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
      text-align:center;
    }
  </style>
</head>

<body>
  <div id="bg"></div>

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">
    <div class="left" id="topbarLeft">チーと言えばギュウと答える</div>
    <div class="right" id="topbarRight"> </div>
  </div>

  <!-- 1) TOP -->
  <section class="scene active" id="sceneTop">
    <div class="center">
      <div class="title">ガチ！チー牛診断！！</div>
      <button class="btn primary" id="btnStart">START</button>
    </div>
  </section>

  <!-- 2) GIRL SELECT (no logo) -->
  <section class="scene" id="sceneSelect">
    <div class="center" style="justify-content:flex-start; padding-top: 22px;">
      <div class="bubble glass small">女の子を選んでね</div>

      <div class="grid" id="girlGrid"></div>

      <button class="btn purple" id="btnDecide" disabled>決定</button>
      <button class="btn primary" id="btnBackToTop">← 戻る</button>
      <div class="hint">※背景は選んだ子のTOP画像になるよ</div>
    </div>
  </section>

  <!-- 3) MODE SELECT (no logo) -->
  <section class="scene" id="sceneMode">
    <div class="center" style="justify-content:flex-start; padding-top: 22px;">
      <div class="bubble glass small">モードを選んでね</div>

      <div class="modeWrap">
        <button class="btn primary" id="btnDiag">チー牛診断</button>
        <button class="btn primary" id="btnChiMusume">チー娘モード</button>
        <button class="btn primary" id="btnModeBack">← 戻る</button>
        <div class="subnote">診断は45問 / チー娘は反射神経</div>
      </div>
    </div>
  </section>

  <!-- 4) DIAG QUIZ -->
  <section class="scene" id="sceneDiag">
    <div class="bubble glass" id="diagQuestion">（問題）</div>

    <div class="choiceGrid">
      <button class="choice c1" data-a="ギュウ">ギュウ</button>
      <button class="choice c2" data-a="チー">チー</button>
      <button class="choice c3" data-a="はい">はい</button>
      <button class="choice c4" data-a="いいえ">いいえ</button>
    </div>

    <div class="subnote" id="diagProgress">1 / 45</div>
  </section>

  <!-- 5) DIAG RESULT -->
  <section class="scene" id="sceneResult">
    <div class="resultRow glass">
      <div class="resultLine">
        <div class="resultLabel">あなたのチー牛度は</div>
        <div class="percent" id="resultPercent">0%</div>
      </div>
    </div>

    <div class="rowBtns">
      <button class="btn yellow" id="btnRetryDiag">もう一回</button>
      <button class="btn blue" id="btnToTopFromResult">トップに戻る</button>
    </div>
  </section>

  <!-- 6) DIAG GAMEOVER -->
  <section class="scene" id="sceneDiagOver">
    <div class="bubble glass" id="diagOverText">GAME OVER</div>

    <!-- %はここでは出す/出さないは後で調整できる。今は表示しない（常時0問題回避） -->
    <div class="rowBtns">
      <button class="btn red" id="btnRetryDiag2">もう一回</button>
      <button class="btn blue" id="btnToTopFromOver">トップに戻る</button>
    </div>
  </section>

  <!-- 7) CHI-MUSUME -->
  <section class="scene" id="sceneChi">
    <div class="bubble glass" id="chiPrompt">チー！</div>

    <div class="choiceGrid">
      <button class="choice c1" data-c="ギュウ">ギュウ</button>
      <button class="choice c2" data-c="チー">チー</button>
      <button class="choice c3" data-c="はい">はい</button>
      <button class="choice c4" data-c="いいえ">いいえ</button>
    </div>

    <div class="subnote" id="chiStatus">ステージ1</div>
  </section>

  <!-- 8) CHI GAMEOVER -->
  <section class="scene" id="sceneChiOver">
    <div class="bubble glass" id="chiOverText">GAME OVER（ステージ1）</div>
    <div class="rowBtns">
      <button class="btn purple" id="btnRetryChi">もう一回</button>
      <button class="btn blue" id="btnToTopFromChiOver">トップに戻る</button>
    </div>
  </section>

  <!-- FLASH OVERLAY: チー娘出現演出（短すぎ問題を対策） -->
  <div class="flash" id="flash">
    <div class="flashBox">
      <div class="flashTitle" id="flashTitle">チー娘…</div>
      <div class="flashText" id="flashText">（演出）</div>
    </div>
  </div>

<script>
/* ==========================
   Helpers
========================== */
const $ = (sel)=>document.querySelector(sel);
const $$ = (sel)=>[...document.querySelectorAll(sel)];
function showScene(id){
  $$('.scene').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function setBg(url){
  const bg = $('#bg');
  bg.style.backgroundImage = url ? `url('${url}')` : 'none';
}
function preloadImage(src){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve(true);
    img.onerror = ()=>resolve(false);
    img.src = src;
  });
}
function randInt(a,b){ // inclusive
  return Math.floor(Math.random()*(b-a+1))+a;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ==========================
   State
========================== */
let selectedGirl = 'A';
let selectedGirlLocked = false;

const girls = [
  { key:'A', name:'Girl A', icon:'girlA_icon.png', top:'girlA_top_01.png', locked:false },
  { key:'B', name:'Girl B', icon:'girlB_icon.png', top:'girlB_top_01.png', locked:false },
  { key:'C', name:'Girl C', icon:'girlC_icon.png', top:'girlC_top_01.png', locked:false },
  { key:'D', name:'Girl D', icon:'girlD_icon.png', top:'girlD_top_01.png', locked:true  },
  { key:'E', name:'Girl E', icon:'girlE_icon.png', top:'girlE_top_01.png', locked:true  },
  { key:'F', name:'Girl F', icon:'girlF_icon.png', top:'girlF_top_01.png', locked:true  },
];

/* 診断：今は「動くための最低限」問題セット（ここは後で45問に差し替えOK）
   choices は常に [ギュウ,チー,はい,いいえ] を表示。
   correct はこの4つのどれか。
*/
const baseQuestions = [
  { text:'あなたはチー牛ですか？', correct:'はい' },
  { text:'チーと言えば？', correct:'ギュウ' },

  // 石原さとみセット（3〜4 + 追加のセット）
  { text:'牛丼屋さんのCMに出ている石原さとみさんに「チー」と言われたら？', correct:'ギュウ' },
  { text:'石原さとみさんに向かって「チー」と言ったら「ギュウ」と答えてくれるイベントを開催して欲しくないですか？', correct:'はい' },
  { text:'石原さとみさんにあの笑顔で「ギュウ」と答えてもらえたら膝から崩れ落ちずにいられますか？', correct:'いいえ' },
  { text:'牛丼屋さんのCMにも出ているし皆んなが本気で実現させようと思えば実現出来そうな気がしませんか？', correct:'はい' },

  { text:'チーズ牛丼を頼んだ人の顔をついチラ見してしまった事はありますか？', correct:'はい' },
  { text:'知らない人を見て「チー牛かも」と思ってしまったことはありますか？', correct:'はい' },
  { text:'知らない人に見られて「チー牛かも」と思われていそうに感じたことはありますか？', correct:'はい' },

  { text:'あなたは三度の飯よりチーズ牛丼が好きですか？', correct:'はい' },
  { text:'気付くと「チー」「ギュウ」「チー」「ギュウ」と交互に言っている事がありますか？', correct:'はい' },

  // 大谷3セット
  { text:'大谷翔平選手が全国の小学生にグローブをプレゼントした際の「野球しようぜ！」はカッコ良かったですね！', correct:'はい' },
  { text:'大谷翔平選手はコンビニのおにぎりのCMに出ていますが「おにぎり食おうぜ！」の方が良かったと思いますか？', correct:'いいえ' },
  { text:'大谷翔平選手には是非ともチーズ牛丼のCMに出て頂き「チー牛食おうぜ！」と言って欲しいですか？', correct:'はい' },

  // 新問題セット
  { text:'山本由伸選手の「負けると言う選択肢はない」という名言はとてもカッコ良かったですね？', correct:'はい' },
  { text:'山本由伸選手に「チーズ牛丼を食べないという選択肢はない」と言ってもらいたいですか？', correct:'はい' },

  { text:'アリストテレスの「すべての者は生まれながらに知恵を求める。」という名言を知っていますか？', correct:'はい' },
  { text:'チー牛界隈にも「すべての者は生まれながらにチーズ牛丼を求める。」という名言があるのを知っていますか？', correct:'はい' },

  // 例：チーギュウ返し（「本当だと思いますか？」は使わず、短く）
  { text:'麻雀には「チーをされた瞬間にギュウと答えるとチーを取り消すことができる『チーギュウ返し』」がある。', correct:'いいえ' },

  // 14・15セットの雰囲気（仮）
  { text:'チーズ牛丼を食べた日は、なぜか元気が出る。', correct:'はい' },
  { text:'写真を撮る時にチーズ牛丼を持ってハイチー牛をしてしまった事がある。', correct:'はい' },
];

let diagQuestions = [];
let diagIndex = 0;
let diagCounts = { 'ギュウ':0, 'チー':0, 'はい':0, 'いいえ':0 };

let chiStage = 1;
let chiTimer = null;
let chiDeadline = 0;
let chiAnswer = 'ギュウ'; // correct in current stage
let chiShowingFlash = false;

/* ==========================
   Build girl grid
========================== */
async function buildGirlGrid(){
  const grid = $('#girlGrid');
  grid.innerHTML = '';

  for(const g of girls){
    const card = document.createElement('div');
    card.className = 'card' + (g.locked ? ' locked' : '');
    card.dataset.key = g.key;

    const img = document.createElement('img');
    img.alt = g.name;

    // icon load fallback
    const ok = await preloadImage(g.icon);
    if(ok) img.src = g.icon;
    else{
      // simple fallback
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#444"/>
              <stop offset="1" stop-color="#222"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" fill="url(#g)"/>
          <text x="50%" y="54%" text-anchor="middle" fill="#fff" font-size="64" font-family="system-ui" font-weight="900">${g.name}</text>
        </svg>
      `);
    }

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = g.name;

    card.appendChild(img);
    card.appendChild(label);
    grid.appendChild(card);

    card.addEventListener('click', async ()=>{
      if(g.locked){
        selectedGirl = g.key;
        selectedGirlLocked = true;
        // いったん背景だけ差し替え（トップ画像が無くてもOK）
        const topOk = await preloadImage(g.top);
        setBg(topOk ? g.top : '');
        $('#btnDecide').disabled = true;
        return;
      }

      selectedGirl = g.key;
      selectedGirlLocked = false;
      $('#btnDecide').disabled = false;

      // selection highlight
      $$('.card').forEach(c=>c.style.outline='none');
      card.style.outline = '3px solid rgba(255,255,255,.75)';

      const topOk = await preloadImage(g.top);
      setBg(topOk ? g.top : '');
    });
  }
}

/* ==========================
   TOPBAR visibility per page (logo removal on 2-3)
   - 2,3ページ目はロゴ無し → topbarLeftを非表示
========================== */
function setTopbar(mode){
  const topbar = $('#topbar');
  const left = $('#topbarLeft');
  const right = $('#topbarRight');

  if(mode === 'hidden'){
    topbar.classList.add('hidden');
    return;
  }
  topbar.classList.remove('hidden');

  if(mode === 'top'){
    left.style.display = 'none';        // 1ページ目も実質要らないので消し
    right.textContent = '';
  }else if(mode === 'select' || mode === 'mode'){
    left.style.display = 'none';        // ←ロゴ抜き
    right.textContent = '';
  }else if(mode === 'diag'){
    left.style.display = 'inline-flex';
    right.textContent = '';
  }else if(mode === 'result'){
    left.style.display = 'inline-flex';
    right.textContent = 'RESULT';
  }else if(mode === 'diagOver'){
    left.style.display = 'inline-flex';
    right.textContent = 'GAME OVER';
  }else if(mode === 'chi'){
    left.style.display = 'inline-flex';
    right.textContent = `ステージ${chiStage}`;
  }else if(mode === 'chiOver'){
    left.style.display = 'inline-flex';
    right.textContent = `GAME OVER（ステージ${chiStage}）`;
  }
}

/* ==========================
   DIAG logic
========================== */
function buildDiag45(){
  // 今は baseQuestions からシャッフルして 45 つくる（足りなければ繰り返し）
  const pool = shuffle(baseQuestions);
  const out = [];
  let i = 0;
  while(out.length < 45){
    out.push(pool[i % pool.length]);
    i++;
  }

  // 45問目は「ギュウ」以外即ゲームオーバー → 45問目を固定
  out[44] = { text:'最後にもう一度。チーと言えば？', correct:'ギュウ' };

  diagQuestions = out;
}

function startDiag(){
  diagIndex = 0;
  diagCounts = { 'ギュウ':0, 'チー':0, 'はい':0, 'いいえ':0 };
  buildDiag45();
  renderDiag();
  setTopbar('diag');
  showScene('#sceneDiag');
}

function renderDiag(){
  const q = diagQuestions[diagIndex];
  $('#diagQuestion').textContent = q.text;
  $('#diagProgress').textContent = `${diagIndex+1} / 45`;
}

function diagAnswer(ans){
  const q = diagQuestions[diagIndex];
  diagCounts[ans]++;

  // 45問目 special: ギュウ以外即死
  if(diagIndex === 44 && ans !== 'ギュウ'){
    showDiagOver(`……（最後はギュウ以外ダメ）`);
    return;
  }

  // 通常正誤：間違えたらゲームオーバー（※ここは仕様に合わせて後で変更OK）
  if(ans !== q.correct){
    showDiagOver(`あなたチー牛じゃなかったのね。。。`);
    return;
  }

  diagIndex++;
  if(diagIndex >= 45){
    // result
    showDiagResult();
    return;
  }
  renderDiag();
}

function showDiagOver(text){
  $('#diagOverText').textContent = text;
  setTopbar('diagOver');
  showScene('#sceneDiagOver');
}

async function showDiagResult(){
  setTopbar('result');
  showScene('#sceneResult');

  // ★ 現段階の採点：基本80〜99、2%で100（チギュテッド仕様に合わせやすい）
  let target = randInt(80, 99);
  if(Math.random() < 0.02) target = 100;

  // score image（S/A/B の9枚をランダム表示：なければ背景のみ）
  // S:95+ / A:88-94 / B:80-87 （提案を採用）
  let rank = 'b';
  if(target === 100) rank = 's'; // 現段階では100はS側に寄せ
  else if(target >= 95) rank = 's';
  else if(target >= 88) rank = 'a';
  else rank = 'b';

  const idx = randInt(1,3);
  const scoreImg = `score_${rank}_${String(idx).padStart(2,'0')}.png`;
  const ok = await preloadImage(scoreImg);
  // score画像がある場合は背景を一時的に差し替え（RESULT用）
  // ※嫌ならこの行を消せば「トップ背景のまま」になる
  if(ok) setBg(scoreImg);

  // % カウントアップ演出
  animatePercent($('#resultPercent'), target, 900);
}

function animatePercent(el, target, ms){
  // 0→target を「ドドン」と増える感じ（加速→減速）
  const start = performance.now();
  const from = 0;
  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }
  function tick(now){
    const t = Math.min(1, (now-start)/ms);
    const v = Math.round(from + (target-from)*easeOutCubic(t));
    el.textContent = `${v}%`;
    if(t < 1) requestAnimationFrame(tick);
  }
  el.textContent = '0%';
  requestAnimationFrame(tick);
}

/* ==========================
   CHI-MUSUME logic
========================== */
function startChi(){
  chiStage = 1;
  setTopbar('chi');
  showScene('#sceneChi');
  nextChiStage(true);
}

function nextChiStage(first=false){
  // 演出：短すぎ問題を防ぐために最低表示時間を確保
  // stageが上がるほど制限時間を短くする
  const baseMs = 1800;
  const dec = Math.min(1100, (chiStage-1)*90);
  const limit = Math.max(650, baseMs - dec);

  const prompts = [
    { text:'チー！', correct:'ギュウ' },
    { text:'ギュウ！', correct:'ギュウ' },
    { text:'チーと言えば？', correct:'ギュウ' },
    { text:'あなたはチー牛ですか？', correct:'はい' },
  ];
  const p = prompts[randInt(0, prompts.length-1)];
  chiAnswer = p.correct;

  $('#chiPrompt').textContent = p.text;
  $('#chiStatus').textContent = `ステージ${chiStage}`;

  // フラッシュ演出（必ず見える）
  showFlash(`ステージ${chiStage}`, `制限時間 ${Math.round(limit/100)/10} 秒`, 900);

  // タイマー開始
  if(chiTimer) clearTimeout(chiTimer);
  chiDeadline = Date.now() + limit;

  chiTimer = setTimeout(()=>{
    chiGameOver();
  }, limit);
}

function chiPick(ans){
  if(Date.now() > chiDeadline) return; // already over
  if(chiTimer) clearTimeout(chiTimer);

  if(ans !== chiAnswer){
    chiGameOver();
    return;
  }

  chiStage++;
  setTopbar('chi');
  nextChiStage(false);
}

function chiGameOver(){
  if(chiTimer) clearTimeout(chiTimer);
  $('#chiOverText').textContent = `GAME OVER（ステージ${chiStage}）`;
  setTopbar('chiOver');
  showScene('#sceneChiOver');
}

function showFlash(title, text, minMs){
  const flash = $('#flash');
  $('#flashTitle').textContent = title;
  $('#flashText').textContent = text;

  flash.classList.add('active');
  chiShowingFlash = true;

  // 最低表示時間を保証してから消す（短すぎ対策）
  setTimeout(()=>{
    flash.classList.remove('active');
    chiShowingFlash = false;
  }, minMs);
}

/* ==========================
   Wiring
========================== */
(async function init(){
  // 初期背景は何もなくてもOK
  setBg('');

  await buildGirlGrid();
  setTopbar('top');
  showScene('#sceneTop');

  // TOP
  $('#btnStart').addEventListener('click', async ()=>{
    // selectへ
    setTopbar('select');
    showScene('#sceneSelect');

    // 既定の子の背景を表示（なければ黒）
    const g = girls.find(x=>x.key===selectedGirl) || girls[0];
    const ok = await preloadImage(g.top);
    setBg(ok ? g.top : '');
  });

  $('#btnBackToTop').addEventListener('click', ()=>{
    setTopbar('top');
    showScene('#sceneTop');
  });

  $('#btnDecide').addEventListener('click', ()=>{
    if(selectedGirlLocked) return;
    setTopbar('mode');
    showScene('#sceneMode');
  });

  // MODE
  $('#btnModeBack').addEventListener('click', ()=>{
    setTopbar('select');
    showScene('#sceneSelect');
  });

  $('#btnDiag').addEventListener('click', ()=>{
    // 診断開始
    startDiag();
  });

  $('#btnChiMusume').addEventListener('click', ()=>{
    startChi();
  });

  // DIAG answers
  $$('#sceneDiag .choice').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      diagAnswer(btn.dataset.a);
    });
  });

  // RESULT
  $('#btnRetryDiag').addEventListener('click', ()=>{
    // RESULT背景をトップに戻す
    const g = girls.find(x=>x.key===selectedGirl);
    if(g) setBg(g.top);
    startDiag();
  });
  $('#btnToTopFromResult').addEventListener('click', ()=>{
    // 背景を選択した子TOPに戻す
    const g = girls.find(x=>x.key===selectedGirl);
    if(g) setBg(g.top);
    setTopbar('top');
    showScene('#sceneTop');
  });

  // OVER
  $('#btnRetryDiag2').addEventListener('click', ()=>{
    startDiag();
  });
  $('#btnToTopFromOver').addEventListener('click', ()=>{
    const g = girls.find(x=>x.key===selectedGirl);
    if(g) setBg(g.top);
    setTopbar('top');
    showScene('#sceneTop');
  });

  // CHI
  $$('#sceneChi .choice').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      // 演出中でも押せるが、誤爆が嫌ならここでreturnできる
      chiPick(btn.dataset.c);
    });
  });

  $('#btnRetryChi').addEventListener('click', ()=>{
    startChi();
  });
  $('#btnToTopFromChiOver').addEventListener('click', ()=>{
    const g = girls.find(x=>x.key===selectedGirl);
    if(g) setBg(g.top);
    setTopbar('top');
    showScene('#sceneTop');
  });
})();
</script>
