<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>チーと言えばギュウと答える</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
.app{
  max-width:560px;
  margin:0 auto;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* header */
header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
  letter-spacing:.02em;
}

/* screens */
.screen{flex:1;position:relative;overflow:hidden}
.bg{
  position:absolute; inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.02);
  transition:transform .35s ease, filter .35s ease;
}
.overlay{
  position:absolute; inset:0;
  padding:16px;
  display:flex;
}

/* start */
#startScreen .overlay{
  justify-content:center;
  align-items:flex-end;
  padding-bottom:22px;
}
.startPanel{text-align:center; width:100%;}
.startTitle{
  font-size:18px;
  font-weight:900;
  letter-spacing:.14em;
  margin-bottom:10px;
  text-shadow:0 8px 22px rgba(0,0,0,.75);
}

/* TOP: BEST */
.bestLine{
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  margin-bottom:10px;
  text-shadow:0 8px 22px rgba(0,0,0,.75);
  opacity:.95;
}
.bestNum{
  font-size:14px;
  letter-spacing:.08em;
}

/* girl select */
.girlSelect{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin:10px 0 14px;
  padding:0 6px;
}
.girlBtn{
  border:none;
  border-radius:14px;
  padding:10px 10px 12px;
  background:rgba(255,255,255,.10);
  color:#fff;
  font-weight:900;
  text-align:center;
}
.girlBtn small{
  display:block;
  font-size:11px;
  opacity:.9;
  letter-spacing:.08em;
  margin-top:6px;
}
.girlBtn.active{
  outline:2px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.16);
}

/* start buttons */
.startBtns{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.startBtn{
  font-size:18px;
  padding:14px 18px;
  border:none;
  border-radius:14px;
  background:#ffffff22;
  color:#fff;
  font-weight:900;
  min-width:140px;
}

/* TOP: NEW RECORD badge */
.badge{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  font-weight:900;
  letter-spacing:.12em;
  opacity:0;
  transform:translateY(6px) scale(.98);
  transition:opacity .22s, transform .22s;
}
.badge.show{ opacity:1; transform:translateY(0) scale(1); }
.badge .star{ color:#ffd54a; }

/* game */
#gameScreen .overlay{ flex-direction:column; justify-content:space-between; }
#gameScreen.chee .bg{transform:scale(1.12)}
#gameScreen.hold .bg{filter:brightness(.92)}

.vignette{
  position:absolute;inset:0;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle, rgba(0,0,0,0) 45%, rgba(0,0,0,.45) 100%);
  transition:opacity .25s;
}
#gameScreen.chee .vignette{opacity:1}

/* cut */
.cut{
  position:absolute;inset:0;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .28s;
}
#gameScreen.cut .cut{opacity:1}

/* announce */
.announce{

  justify-content:center;
  align-items:center;

  letter-spacing:.2em;

}
#gameScreen.announce .announce{opacity:1}

/* flash */
.flash{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.22);
  opacity:0;
  pointer-events:none;
  transition:opacity .08s ease-out;
}
.flash.on{ opacity:1; }

/* bubble */
.bubble{
  background:rgba(255,255,255,.08);
  border-radius:14px;
  padding:14px;

  flex-direction:column;
  justify-content:space-between;

.question{

  font-weight:700;

.question.hide{opacity:0}

/* ❤ */

.heartGold{ color:#ffd54a; text-shadow:0 10px 26px rgba(255,213,74,.45); }

  55%{ transform:scale(1.25); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
.heartPop{ animation:heartPop .22s ease-out; }

/* ⭐︎⭐︎⭐︎ 背景揺れ */
@keyframes bgShake {

  20%  { transform: translate(-2px, 1px) scale(1.12); }
  40%  { transform: translate(2px, -1px) scale(1.12); }
  60%  { transform: translate(-1px, -2px) scale(1.12); }
  80%  { transform: translate(1px, 2px) scale(1.12); }
  100% { transform: translate(0, 0) scale(1.12); }
}
#gameScreen.chee.stage3plus .bg{ animation:bgShake .35s infinite; }

/* choices */

/* チー娘モード：10ボタン */

function pad2(n){ return String(n).padStart(2,"0"); }

function makeGirl(prefix, label){

  const clears  = Array.from({length:3},  (_,i)=>`${prefix}_clear_${pad2(i+1)}.png`);
  const scores  = (rank)=> Array.from({length:3},(_,i)=>`${prefix}_score_${rank}_${pad2(i+1)}.png`);
  return {
    id: prefix.replace("girl",""), // A/B/C
    label,
    top: `${prefix}_top_01.png`,
    normalImages: normals,
    clearImages: clears,
    // クリア時セリフ（3枚ぶん）
    clearLines: ["ちゃんとギュウって言えたね","最後までいけたね","おつかれさま"],
    goverNormal: `${prefix}_gameover_01.png`,
    goverChee:   `${prefix}_chi_gameover_01.png`,
    scoreImages: {
      s: scores("s"),
      a: scores("a"),
      b: scores("b"),
      c: scores("c"),
      d: scores("d"),
    },
    // チー娘モードGO文言（女の子別にしたいならここを変える）
    cheeOnlyGoText: (reached, best)=>`ステージ${reached}でゲームオーバー\n最高ステージ：ステージ${best}`
  };
}

const GIRLS = [

/* クリア演出：最低3秒 */

/* =========================================================

   ========================================================= */

const questions = [

/* =========================================================

const CHEE_SUCCESS_HOLD_MS = 700;

const CHEE_RATE = 0.35;

const STAGE3_BOOST_MULT = 1.35;

/* =========================================================
   採点（44問）
   - diff式：round(100*(1-diff/44))
   - 例外：
      全はい 48 / 全いいえ 42 / 全チー 57 / 全ギュウ 53
      43+1   44
      11ずつ 51
   ========================================================= */
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

function calcCheePercent(counts){
  const vals = [counts.hai, counts.iie, counts.chi, counts.gyuu];
  const maxv = Math.max(...vals);
  const minv = Math.min(...vals);
  const diff = maxv - minv;

  // 全部同じ（44-0-0-0）
  if(maxv === 44 && minv === 0){
    if(counts.hai === 44)  return 48;
    if(counts.iie === 44)  return 42;
    if(counts.chi === 44)  return 57;
    if(counts.gyuu === 44) return 53;
  }

  // 43+1（= max 43 かつ min 0）
  if(maxv === 43 && minv === 0){
    return 44;
  }

  // 11ずつ（11-11-11-11）
  if(maxv === 11 && minv === 11){
    return 51;
  }

  const base = Math.round(100 * (1 - diff / 44));
  return clamp(base, 0, 100);
}

function rankFromPercent(p){
  if(p >= 80) return "s";
  if(p >= 60) return "a";
  if(p >= 40) return "b";
  if(p >= 20) return "c";
  return "d";
}

// 採点カウント（Q1-44のみ）
let counts = { hai:0, iie:0, chi:0, gyuu:0 };

/* =========================================================

function refreshTopBest(){ bestOnTop.textContent = `ステージ${getBestStage()}`; }

}

function renderGirlSelect(){
  const currentId = getSelectedGirlId();
  girlSelect.innerHTML = "";
  GIRLS.forEach(g=>{
    const b = document.createElement("button");
    b.className = "girlBtn" + (g.id===currentId ? " active" : "");

    };

}
function refreshStartBg(){
  const girl = getSelectedGirl();
  startBg.style.backgroundImage = `url("${girl.top}")`;
}

/* =========================================================
   WebAudio: 小さいポン
   ========================================================= */
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function playPopSE(){
  try{
    ensureAudio();
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(660, t0);
    osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.03);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.10);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.11);
  }catch(e){}
}

  gauge.classList.remove("yellow","red");
  currentCheeLevel=null;
  choices.classList.remove("chee10");
}
function flashBg(){
  flash.classList.add("on");
  setTimeout(()=> flash.classList.remove("on"), FLASH_ON_MS);
}
function clearSpeech(){ s.className="speech"; s.textContent=""; }
function setSpeechPlain(text){ s.className="speech"; s.textContent=text; }
function setHeartOnlyPop(isGold=false){
  s.className = "speech " + (isGold ? "heartGold" : "heartOnly");
  s.textContent = "❤";
  s.classList.remove("heartPop");
  void s.offsetWidth;
  s.classList.add("heartPop");
  playPopSE();
  flashBg();
}
function setGyuuWithHeart(){
  s.className="speech";
  s.innerHTML = `ギュウ<span class="heartOnly">❤</span>`;
}
function setTextWithHeart(text){
  s.className="speech";
  s.innerHTML = `${text}<span class="heartOnly">❤</span>`;
}

const buttonColors = [
  "#d64545","#c0392b","#e67e22","#f1c40f",
  "#27ae60","#16a085","#2980b9","#8e44ad",
  "#2c3e50","#7f8c8d","#ff6b6b","#ffa502"
];
function applyRandomColorsToButtons(){
  const btns = document.querySelectorAll("#choices button.choice");
  const cols = shuffle(buttonColors);
  btns.forEach((b,idx)=>{ b.style.background = cols[idx % cols.length]; });
}
function setButtonsEnabled(on){
  document.querySelectorAll("#choices button").forEach(b=>b.disabled=!on);
}

/* =========================================================
   choices UI
   ========================================================= */
function buildChoices4(){
  choices.classList.remove("chee10");
  choices.innerHTML="";
  const items=[["はい"],["いいえ"],["チー"],["ギュウ"]];
  shuffle(items).forEach(([t])=>{
    const b=document.createElement("button");
    b.textContent=t;
    b.className="choice";
    b.onclick=()=>answer(t);
    choices.appendChild(b);
  });
  applyRandomColorsToButtons();
}

/* ✅ チー娘モード10ボタン：ギュウ位置が連続しない */
function buildChoicesChee10(){
  const decoys = [
    "はい","いいえ","チー","ポン","カン","ドン","モー","牛","チーズ","特盛り",
    "並","大盛り","湯気","ニコッ","クスッ","笑","うし","ぎゅ","チー牛","牛丼"
  ];
  const nine = shuffle(decoys.filter(x=>x!=="ギュウ")).slice(0, 9);

  // ギュウ位置を決める（前回と同じindex回避）
  let gyuuIndex = randInt(10);
  if(gyuuIndex === lastGyuuIndexCheeOnly){
    gyuuIndex = (gyuuIndex + 1 + randInt(9)) % 10; // 確実にズラす
  }
  lastGyuuIndexCheeOnly = gyuuIndex;

  const decoyShuffled = shuffle(nine);
  const out = new Array(10);
  let di=0;
  for(let idx=0; idx<10; idx++){
    if(idx===gyuuIndex) out[idx]="ギュウ";
    else out[idx]=decoyShuffled[di++];
  }

  choices.classList.add("chee10");
  choices.innerHTML="";
  out.forEach(label=>{
    const b=document.createElement("button");
    b.textContent=label;
    b.className="choice";
    b.onclick=()=>answer(label);
    choices.appendChild(b);
  });
  applyRandomColorsToButtons();
}

/* =========================================================
   backgrounds
   ========================================================= */
function applyQuestionBg(){
  const girl = getSelectedGirl();
  bg.style.backgroundImage = `url("${girl.normalImages[i % girl.normalImages.length]}")`;
}
function randGirlNormalImage(){
  const girl = getSelectedGirl();
  return girl.normalImages[randInt(girl.normalImages.length)];
}

/* =========================================================
   show question (normal mode)
   ========================================================= */
function showQuestion(){
  ended=false;
  locked=false;
  mode="quiz";
  resetCheeVisuals();

  applyQuestionBg();

  q.classList.add("hide");
  q.textContent = questions[i].text;
  clearSpeech();

  c.textContent = `${i+1}/${questions.length}`;
  setTimeout(()=> q.classList.remove("hide"), QUESTION_SHOW_DELAY);
  setButtonsEnabled(true);
}

/* =========================================================
   chee level picking
   ========================================================= */
function pickCheeLevelNormal(){
  const r = Math.random();
  let acc=0;
  for(const lv of cheeLevelsNormal){
    acc += lv.weight;
    if(r <= acc) return lv;
  }
  return cheeLevelsNormal[0];
}
function cheeOnlyPickStage(){
  let stage = cheeStage;

  // 緩急（25%）
  if(Math.random() < 0.25){
    stage = Math.max(1, stage - (Math.random()<0.7 ? 1 : 2));
  }

  const stars = stage <= 1 ? 1 : (stage === 2 ? 2 : 3);
  const base = 2400 - (stage - 1) * 120;
  const timeMs = Math.max(550, Math.round(base));
  const gaugeType = stars === 1 ? "cool" : (stars === 2 ? "yellow" : "red");

  return { stars, timeMs, gauge:gaugeType, stage };
}

/* =========================================================
   next (normal mode)
   ========================================================= */
function maybeChee(){
  if(ended) return;

  i++;
  if(i < questions.length){
    // チー娘乱入
    if(!cheeCooldown && Math.random() < CHEE_RATE){
      cheeCooldown=true;
      setButtonsEnabled(false);
      game.classList.add("hold");
      setTimeout(()=>{
        game.classList.remove("hold");
        startCheeBattle(pickCheeLevelNormal());
      }, CHEE_PRE_HOLD_MS);
    }else{
      cheeCooldown=false;
      showQuestion();
    }
  }else{
    // 念のため
    endFallback();
  }
}

/* =========================================================
   chee battle (common)
   ========================================================= */
function startCheeBattle(level){
  if(ended) return;
  mode="chee";
  locked=false;
  currentCheeLevel = level;

  game.classList.add("cut","announce","chee");
  if(level.stars >= 3) game.classList.add("stage3plus");

  bg.style.backgroundImage = `url("${randGirlNormalImage()}")`;

  setTimeout(()=>{
    game.classList.remove("cut","announce");

    q.textContent="";
    q.classList.add("hide");
    clearSpeech();

    setTimeout(()=>{
      s.className = "speech cheeWord" + (level.stars>=3 ? " big" : "");
      s.textContent = "チー！";

      if(gameMode === "cheeOnly") buildChoicesChee10();
      else buildChoices4();

      startCheeTimer(level);
      setButtonsEnabled(true);
    }, CHEE_SILENCE_MS);

  }, CUT_MS + POST_CUT_HOLD_MS);
}

function startCheeTimer(level){
  stopCheeTimer();
  showGauge();

  gauge.classList.remove("yellow","red");
  if(level.gauge==="yellow") gauge.classList.add("yellow");
  if(level.gauge==="red") gauge.classList.add("red");

  const start = performance.now();

  const tick = (t)=>{
    let elapsed = t - start;

    if(level.stars >= 3 && elapsed < STAGE3_BOOST_MS){
      elapsed = elapsed * STAGE3_BOOST_MULT;
    }else if(level.stars >= 3 && elapsed >= STAGE3_BOOST_MS){
      const boosted = STAGE3_BOOST_MS * STAGE3_BOOST_MULT;
      elapsed = boosted + (elapsed - STAGE3_BOOST_MS);
    }

    const r = Math.max(0, 1 - (elapsed / level.timeMs));
    gauge.style.transform = `scaleX(${r})`;

    if(level.gauge === "cool"){
      gauge.style.background = `hsl(${210 * r}, 85%, 55%)`;
    }

    if(r > 0){
      rafId = requestAnimationFrame(tick);
    }else{
      gameOver();
    }
  };

  rafId = requestAnimationFrame(tick);
}

/* =========================================================
   answer handling
   ========================================================= */
function addCountForChoice(t){
  if(t==="はい") counts.hai++;
  else if(t==="いいえ") counts.iie++;
  else if(t==="チー") counts.chi++;
  else if(t==="ギュウ") counts.gyuu++;
}

function answer(t){
  if(locked || ended) return;
  locked=true;
  setButtonsEnabled(false);
  ensureAudio();
  q.classList.add("hide");

  // チー娘戦
  if(mode==="chee"){
    if(t==="ギュウ"){
      stopCheeTimer();
      hideGauge();

      setTimeout(()=> setHeartOnlyPop(isNewRecordRun), GIRL_REPLY_DELAY_MS);

      setTimeout(()=>{
        resetCheeVisuals();

        if(gameMode === "cheeOnly"){
          nextCheeOnlyAfterWin();
          return;
        }

        // 通常モード：チー乱入勝利→同じ問題に戻る（進行は止めていた）
        showQuestion();
      }, GIRL_REPLY_DELAY_MS + CHEE_SUCCESS_HOLD_MS);

    }else{
      gameOver();
    }
    return;
  }

  // 通常問題（Q1-45）
  // Q1-44 は採点用カウント
  if(gameMode === "normal" && i <= 43){
    addCountForChoice(t);
  }

  // 通常問題：返事（チー以外は❤️付き）
  setTimeout(()=>{
    if(t==="はい")        setTextWithHeart("笑");
    else if(t==="いいえ") setTextWithHeart("クスッ");
    else if(t==="ギュウ") setTextWithHeart("ニコッ");
    else if(t==="チー")   setGyuuWithHeart();
    else                  setTextWithHeart("笑");
  }, GIRL_REPLY_DELAY_MS);

  // 45問目（index 44）は「ギュウ必須」
  if(gameMode === "normal" && i === 44){
    setTimeout(()=>{
      if(t !== "ギュウ"){
        // 45問目失敗 → 即GO（通常GO）
        gameOverFinalGate();
      }else{
        // クリア → 3秒+セリフ → 結果画面
        onClearNormal();
      }
    }, GIRL_REPLY_DELAY_MS + 200);
    return;
  }

  // それ以外は次へ
  setTimeout(()=>{
    maybeChee();
  }, GIRL_REPLY_DELAY_MS + NORMAL_REACT_MS);
}

/* =========================================================
   normal mode: clear -> result
   ========================================================= */
function onClearNormal(){
  ended=true;
  resetCheeVisuals();
  mode="clear";

  // 採点（44問）
  lastResultPercent = calcCheePercent(counts);
  lastResultRank = rankFromPercent(lastResultPercent);

  // クリア画像とセリフ（3枚から）
  const girl = getSelectedGirl();
  const idx = randInt(3);
  const img = girl.clearImages[idx];
  const line = girl.clearLines[idx] || "おつかれさま";

  bg.style.backgroundImage = `url("${img}")`;
  q.textContent = "";
  clearSpeech();

  // クリア演出セリフ（数値はまだ出さない）
  setSpeechPlain(line);
  c.textContent = `CLEAR`;

  // ボタンは出さない
  choices.innerHTML = "";
  hideGauge();

  // 最低3秒表示して結果へ
  setTimeout(()=>{
    showResultScreen();
  }, CLEAR_MIN_MS);
}

function showResultScreen(){
  mode="result";
  ended=true;
  resetCheeVisuals();

  const girl = getSelectedGirl();
  const rank = lastResultRank;
  const imgs = girl.scoreImages[rank] || [];
  const img = imgs.length ? imgs[randInt(imgs.length)] : girl.top;

  bg.style.backgroundImage = `url("${img}")`;
  q.textContent = "";
  clearSpeech();

  // 結果表示（ここが「結果画像」）
  s.innerHTML = `
  <div class="resultTitle">あなたのチー牛度</div>
  <div class="resultPercent">${lastResultPercent}%</div>
`;
  c.textContent = `RESULT`;

  renderEndButtonsDelayed(0);
}

/* =========================================================
   cheeOnly mode flow
   ========================================================= */
function nextCheeOnlyAfterWin(){
  cheeStage++;
  c.textContent = `ステージ${cheeStage}`;

  const best = getBestStage();
  if(cheeStage > best){
    setBestStage(cheeStage);
    isNewRecordRun = true;
  }

  const lv = cheeOnlyPickStage();
  startCheeBattle(lv);
}

/* =========================================================
   game over / end buttons
   ========================================================= */
function renderEndButtonsDelayed(delayMs){
  choices.innerHTML = "";
  setTimeout(()=>{
    choices.innerHTML = `
      <button class="choice" style="grid-column:1/-1" onclick="restart(gameMode)">もう一回</button>
      <button class="choice" style="grid-column:1/-1" onclick="backToTop()">トップに戻る</button>
    `;
    applyRandomColorsToButtons();
  }, delayMs);
}

function gameOverFinalGate(){
  ended=true;
  resetCheeVisuals();
  mode="result";

  const girl = getSelectedGirl();
  bg.style.backgroundImage = `url("${girl.goverNormal}")`;
  q.textContent="";
  clearSpeech();
  setSpeechPlain("45問目、ギュウじゃないとだめ。");
  c.textContent = "GAME OVER";
  renderEndButtonsDelayed(1000);
}

function gameOver(){
  ended=true;
  resetCheeVisuals();
  const girl = getSelectedGirl();
  q.textContent="";
  clearSpeech();

  if(gameMode === "cheeOnly"){
    bg.style.backgroundImage = `url("${girl.goverChee}")`;

    const reachedStage = cheeStage;
    const bestStage = getBestStage();
    if(reachedStage > bestStage){
      setBestStage(reachedStage);
      isNewRecordRun = true;
    }
    const finalBest = Math.max(reachedStage, bestStage);

    const txt = (typeof girl.cheeOnlyGoText === "function")
      ? girl.cheeOnlyGoText(reachedStage, finalBest)
      : `ステージ${reachedStage}でゲームオーバー\n最高ステージ：ステージ${finalBest}`;

    setSpeechPlain(txt);
    c.textContent = `GAME OVER (ステージ${reachedStage})`;

  }else{
    bg.style.backgroundImage = `url("${girl.goverNormal}")`;
    setSpeechPlain("あなたチー牛じゃなかったのね。。");
    c.textContent = "GAME OVER";
  }

  renderEndButtonsDelayed(1000);
}

function endFallback(){
  ended=true;
  resetCheeVisuals();
  const girl = getSelectedGirl();
  bg.style.backgroundImage = `url("${girl.top}")`;
  q.textContent="";
  clearSpeech();
  setSpeechPlain("END");
  c.textContent = "END";
  renderEndButtonsDelayed(0);
}

/* =========================================================
   start/restart/top
   ========================================================= */
function restart(modeName){
  ended=false;
  cheeCooldown=false;
  locked=false;
  stopCheeTimer();
  resetCheeVisuals();

  gameMode = modeName || "normal";
  isNewRecordRun = false;

  if(gameMode === "cheeOnly"){
    mode = "chee";
    cheeStage = 1;
    lastGyuuIndexCheeOnly = -1;
    c.textContent = `ステージ${cheeStage}`;
    startCheeBattle(cheeOnlyPickStage());
    return;
  }

  // normal quiz
  mode="quiz";
  i=0;
  counts = { hai:0, iie:0, chi:0, gyuu:0 };
  buildChoices4();
  showQuestion();
}

function backToTop(){
  ended=false;
  stopCheeTimer();
  resetCheeVisuals();
  locked=false;
  cheeCooldown=false;
  mode="quiz";

  game.classList.add("hide");
  startScreen.classList.remove("hide");

  refreshTopBest();
  showTopNewRecordBadge(isNewRecordRun);
  refreshStartBg();
}

/* =========================================================
   start buttons
   ========================================================= */
document.getElementById("startBtnNormal").onclick=()=>{
  startScreen.classList.add("hide");
  game.classList.remove("hide");
  showTopNewRecordBadge(false);
  restart("normal");
};
document.getElementById("startBtnChee").onclick=()=>{
  startScreen.classList.add("hide");
  game.classList.remove("hide");
  showTopNewRecordBadge(false);
  restart("cheeOnly");
};

/* =========================================================
   init
   ========================================================= */
renderGirlSelect();
refreshStartBg();
refreshTopBest();
</script>
