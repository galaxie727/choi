<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>チーと言えばギュウと答える</title>

<style>
*{box-sizing:border-box}
:root{
  --maxw:560px;
  --pad:16px;
  --stroke:rgba(255,255,255,.55);
  --iconFrame:8px;
  --iconRadius:14px;
}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
.app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* header */
header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  opacity:.95;
}

/* screens */
.screen{flex:1;position:relative;overflow:hidden}
.hide{display:none!important}
.bg{
  position:absolute; inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.02);
  transition:transform .35s ease, filter .35s ease;
}
.overlay{
  position:absolute; inset:0;
  padding:var(--pad);
  display:flex;
}

/* common panel */
.panel{
  width:100%;
  text-align:center;
  text-shadow:0 10px 28px rgba(0,0,0,.80);
}
.titleBig{
  font-size:22px;
  font-weight:900;
  letter-spacing:.14em;
  margin:0 0 14px;
}
.subLine{
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  opacity:.95;
  margin:0 0 16px;
}
.bigBtn{
  width:min(360px, 92%);
  font-size:18px;
  padding:16px 18px;
  border:none;
  border-radius:16px;
  background:#ffffff22;
  color:#fff;
  font-weight:900;
}

/* TOP */
#topScreen .overlay{
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:260px;
}
#versionTag{
  position:absolute;
  left:0; right:0;
  bottom:18px;
  text-align:center;
  font-weight:900;
  letter-spacing:.20em;
  opacity:.85;
}

/* GIRL SELECT */
#girlScreen .overlay{ padding-top:120px }
.gridIcons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}
.girlTile{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
  padding:10px;
}
.iconBox{
  width:100%;
  aspect-ratio:1/1;
  border-radius:var(--iconRadius);
  overflow:hidden;
  background:rgba(0,0,0,.25);
}
.iconBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.girlName{
  margin-top:10px;
  font-weight:900;
  font-size:13px;
}

/* MODE */
#modeScreen .overlay{ padding-top:220px }

/* GAME */
#gameScreen .overlay{
  flex-direction:column;
  justify-content:space-between;
}
.bubble{
  background:rgba(255,255,255,.08);
  border-radius:14px;
  padding:14px;
  min-height:130px;
}
.question{
  font-size:20px;
  font-weight:800;
  line-height:1.45;
  padding-bottom:62px;
}
#speech{
  position:absolute;
  right:14px;
  bottom:10px;
  font-size:28px;
  font-weight:900;
}

/* choices */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.choice{
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  color:#fff;
}

/* result */
#resultBox{
  position:absolute;
  left:16px;
  right:16px;
  bottom:180px;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>チーと言えばギュウと答える</div>
  <div id="counter">-</div>
</header>

<div id="topScreen" class="screen">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">ガチ！チー牛診断！！</h1>
      <button class="bigBtn">START</button>
    </div>
  </div>
  <div id="versionTag">VERSION v0.30.6</div>
</div>

<div id="girlScreen" class="screen hide">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">女の子を選んでね</h1>
      <div class="gridIcons"></div>
    </div>
  </div>
</div>

<div id="modeScreen" class="screen hide">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">モードを選んでね</h1>
    </div>
  </div>
</div>

<div id="gameScreen" class="screen hide">
  <div class="bg"></div>

  <div class="overlay">
    <div class="bubble">
      <div id="question" class="question"></div>
      <div id="speech"></div>
    </div>

    <div class="gauge" id="gaugeWrap"><div id="gaugeBar"></div></div>
    <div class="choices" id="choices"></div>
  </div>
</div>
  
</div>
<script src="app.js?v=306"></script>
</body>
</html>
