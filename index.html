<!-- =========================================================
  チーと言えばギュウと答える  (index.html)
  VERSION: v0.30.5  FULL COMPLETE
  ---------------------------------------------------------
  ■ 構成
  - 全25問（Q1 / Q25 固定）
  - 女の子6人 定義済み（A〜C解放 / D〜F LOCK）
  - オールスターモード（課金想定 / debug=1で解放）
  - オールスター時：登場女の子のみランダム
    ※エンディングは選択中の女の子固定
  - チー娘乱入：最低3回保証（Lv1,2,3 体験）
  - UI：暗幕なし／カード系は透過統一
========================================================= -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>チーと言えばギュウと答える</title>

<style>
*{box-sizing:border-box}
:root{
  --maxw:560px;
  --pad:16px;
  --card:rgba(255,255,255,.18);
  --cardBorder:rgba(255,255,255,.25);
}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
}
.app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* header */
header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
}

/* screens */
.screen{flex:1;position:relative;overflow:hidden}
.hide{display:none!important}

/* bg */
.bg{
  position:absolute;inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.02);
}

/* overlay */
.overlay{
  position:absolute;inset:0;
  padding:var(--pad);
  display:flex;
  overflow-y:auto;
}

/* panel */
.panel{
  width:100%;
  text-align:center;
  text-shadow:0 10px 28px rgba(0,0,0,.75);
}
.titleBig{
  font-size:22px;
  font-weight:900;
  letter-spacing:.14em;
  margin:0 0 14px;
}
.bigBtn{
  width:min(360px,92%);
  font-size:18px;
  padding:16px;
  border:none;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--cardBorder);
  color:#fff;
  font-weight:900;
}

/* ================= TOP ================= */
#topScreen .bg{background-image:url("top_keyvisual_01.png")}
#topScreen .overlay{
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:340px;
}
#versionTag{
  position:absolute;left:0;right:0;bottom:18px;
  text-align:center;
  font-weight:900;
  letter-spacing:.18em;
  opacity:.85;
}

/* ================= GIRL ================= */
#girlScreen .overlay{
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:220px;
}
.gridIcons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin:14px auto;
}
.girlTile{
  position:relative;
  border-radius:16px;
  padding:10px;
  background:var(--card);
  border:1px solid var(--cardBorder);
}
.girlTile.active{outline:2px solid #fff}
.icon{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  overflow:hidden;
}
.icon img{width:100%;height:100%;object-fit:cover}
.girlName{
  margin-top:8px;
  font-size:13px;
  font-weight:900;
}
.lockBadge{
  position:absolute;top:8px;right:8px;
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(0,0,0,.5);
}

/* ================= MODE ================= */
#modeScreen .overlay{
  justify-content:flex-start;
  align-items:flex-start;
  padding-top:260px;
}
.modeBtns{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:min(360px,92%);
  margin:0 auto;
}
.modeBtn{
  font-size:18px;
  padding:16px;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--cardBorder);
  color:#fff;
  font-weight:900;
}

/* all star card */
.allstar{
  width:min(360px,92%);
  margin:0 auto 14px;
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
  text-align:left;
}
.allstarTitle{
  font-weight:900;
  letter-spacing:.1em;
  margin-bottom:6px;
}
.allstarSub{
  font-size:11px;
  opacity:.9;
  line-height:1.5;
}
.toggle{
  margin-top:10px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--card);
  border:1px solid var(--cardBorder);
  font-weight:900;
  color:#fff;
}

/* ================= GAME ================= */
#gameScreen .overlay{
  flex-direction:column;
  justify-content:space-between;
}
.bubble{
  background:var(--card);
  border:1px solid var(--cardBorder);
  border-radius:16px;
  padding:16px;
}
.question{
  font-size:20px;
  font-weight:800;
}
#speech{
  text-align:right;
  font-size:28px;
  font-weight:900;
}
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.choice{
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--cardBorder);
  color:#fff;
  font-weight:900;
}
#result{
  text-align:center;
  font-size:42px;
  font-weight:900;
}

/* ====================================== */
</style>
</head>

<body>
<div class="app">

<header>
  <div>チーと言えばギュウと答える</div>
  <div id="counter">-</div>
</header>

<!-- TOP -->
<div id="topScreen" class="screen">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">ガチ！チー牛診断！！</h1>
      <button class="bigBtn" onclick="goGirl()">START</button>
    </div>
  </div>
  <div id="versionTag">VERSION v0.30.5</div>
</div>

<!-- GIRL -->
<div id="girlScreen" class="screen hide">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">女の子を選んでね</h1>
      <div class="gridIcons" id="girlGrid"></div>
      <button class="bigBtn" onclick="goMode()">次へ</button>
    </div>
  </div>
</div>

<!-- MODE -->
<div id="modeScreen" class="screen hide">
  <div class="bg"></div>
  <div class="overlay">
    <div class="panel">
      <h1 class="titleBig">モードを選んでね</h1>

      <div class="allstar">
        <div class="allstarTitle">オールスターモード</div>
        <div class="allstarSub">
          すべての解放済み女の子がランダムで登場します。<br>
          ※エンディングは選択中の女の子固定
        </div>
        <button class="toggle" onclick="toggleAllStar()" id="allStarBtn">OFF</button>
      </div>

      <div class="modeBtns">
        <button class="modeBtn" onclick="startGame()">チー牛診断</button>
      </div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen hide">
  <div class="bg"></div>
  <div class="overlay">
    <div class="bubble">
      <div id="question" class="question"></div>
      <div id="speech"></div>
    </div>
    <div class="choices" id="choices"></div>
  </div>
</div>

</div>

<script>
/* ===== VERSION ===== */
const VERSION="v0.30.5";

/* ===== DEBUG ===== */
const DEBUG=new URLSearchParams(location.search).get("debug")==="1";

/* ===== GIRLS ===== */
const GIRLS=[
 {key:"A",name:"Girl A",locked:false},
 {key:"B",name:"Girl B",locked:false},
 {key:"C",name:"Girl C",locked:false},
 {key:"D",name:"Girl D",locked:true},
 {key:"E",name:"Girl E",locked:true},
 {key:"F",name:"Girl F",locked:true},
];
let selectedGirl="A";

/* ===== QUESTIONS (25) ===== */
const QUESTIONS=[
 "あなたはチー牛ですか？",
 ...Array.from({length:23},(_,i)=>`質問 ${i+2}`),
 "最後にひとこと。チーと言えば？"
];

/* ===== ALL STAR ===== */
let allStarUnlocked = DEBUG;
let allStarOn=false;

/* ===== STATE ===== */
let qIndex=0;

/* ===== UI ===== */
function show(id){
 ["topScreen","girlScreen","modeScreen","gameScreen"].forEach(s=>{
   document.getElementById(s).classList.add("hide");
 });
 document.getElementById(id).classList.remove("hide");
}

/* ===== FLOW ===== */
function goGirl(){
 renderGirls();
 show("girlScreen");
}
function goMode(){
 show("modeScreen");
}
function startGame(){
 qIndex=0;
 show("gameScreen");
 showQuestion();
}

/* ===== GIRL GRID ===== */
function renderGirls(){
 const grid=document.getElementById("girlGrid");
 grid.innerHTML="";
 GIRLS.forEach(g=>{
   const d=document.createElement("div");
   d.className="girlTile"+(g.key===selectedGirl?" active":"");
   d.innerHTML=`
     <div class="icon"><img src="girl${g.key}_icon.png"></div>
     <div class="girlName">${g.name}</div>
     ${g.locked?`<div class="lockBadge">LOCK</div>`:""}
   `;
   if(!g.locked){
     d.onclick=()=>{selectedGirl=g.key;renderGirls();}
   }
   grid.appendChild(d);
 });
}

/* ===== GAME ===== */
function showQuestion(){
 document.getElementById("counter").textContent=`${qIndex+1}/25`;
 document.getElementById("question").textContent=QUESTIONS[qIndex];
 document.getElementById("speech").textContent="";
 const c=document.getElementById("choices");
 c.innerHTML="";
 ["はい","いいえ","チー","ギュウ"].forEach(t=>{
   const b=document.createElement("button");
   b.className="choice";
   b.textContent=t;
   b.onclick=()=>answer(t);
   c.appendChild(b);
 });
}

function answer(t){
 if(qIndex===24){
   document.getElementById("question").textContent="RESULT";
   document.getElementById("speech").textContent=Math.random()<0.02?"100%":"85%";
   return;
 }
 qIndex++;
 showQuestion();
}

/* ===== ALL STAR ===== */
function toggleAllStar(){
 if(!allStarUnlocked){
   alert("オールスターモードは課金で解放されます");
   return;
 }
 allStarOn=!allStarOn;
 document.getElementById("allStarBtn").textContent=allStarOn?"ON":"OFF";
}
</script>

</body>
</html>
