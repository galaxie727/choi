<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>チーと言えばギュウと答える</title>
  <style>
    :root{
      --bg:#0b0b0c;
      --panel:#141519;
      --text:#f2f2f2;
      --sub:#b9bcc6;
      --btn:#1f2026;
      --btn2:#2a2c35;
      --accent:#7dd3fc;
      --danger:#fb7185;
      --ok:#34d399;
      --shadow: 0 12px 30px rgba(0,0,0,.38);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, #151620 0%, var(--bg) 55%);
      color:var(--text);
    }
    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 14px 26px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .brand{
      font-weight:900;
      letter-spacing:.06em;
      font-size: 14px;
      opacity:.95;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pill{
      display:flex;
      gap:8px;
      align-items:center;
      color:var(--sub);
      font-size:12px;
      white-space:nowrap;
    }
    .pill b{color:var(--text)}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    /* ====== TOP / GAME common image area ====== */
    .imgArea{
      position:relative;
      width:100%;
      aspect-ratio: 3 / 4; /* 縦ゲーム想定 */
      background:#0f0f11;
    }
    .imgArea img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      background:#0f0f11;
    }

    /* overlay (top bar) */
    .topBar{
      position:absolute;
      left:10px;
      right:10px;
      top:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      pointer-events:none;
      gap:10px;
    }
    .badge{
      pointer-events:none;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color:#fff;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .badge .sub{opacity:.85; font-weight:700}
    .badge .val{font-weight:900; letter-spacing:.02em}

    /* logo overlay for TOP */
    .logoOverlay{
      position:absolute;
      left:14px;
      right:14px;
      top:14px;
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .logoOverlay img{
      width: min(92%, 420px);
      height:auto;
      object-fit:contain;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
    }

    /* speech bubble */
    .bubble{
      position:absolute;
      left: 10px;
      right: 10px;
      bottom: 12px;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px 12px;
      line-height: 1.45;
      font-size: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,.28);
      min-height: 58px;
    }
    .bubble small{display:block;color:var(--sub);font-size:12px;margin-top:6px}

    /* choices */
    .choices{
      padding: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button.choice{
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      color:var(--text);
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .04em;
      cursor:pointer;
      transition: transform .06s ease, filter .15s ease, border-color .15s ease;
    }
    button.choice:active{transform: translateY(1px) scale(.995)}
    button.choice:disabled{
      opacity:.45;
      cursor:not-allowed;
      filter: grayscale(.2);
    }

    /* footer buttons */
    .footerBtns{
      display:flex;
      gap:10px;
      padding: 0 12px 12px;
    }
    .btn{
      flex:1;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 10px;
      font-weight: 900;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px)}
    .btn.secondary{color:var(--sub)}
    .btn.danger{border-color: rgba(251,113,133,.35); color:#ffd0d8}
    .btn.ok{border-color: rgba(52,211,153,.35); color:#c7ffe9}
    .hidden{display:none !important}

    /* TOP screen buttons */
    .topBtns{
      padding: 12px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .bigBtn{
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      border-radius: 16px;
      padding: 14px 12px;
      font-weight: 1000;
      letter-spacing: .06em;
      font-size: 16px;
      cursor:pointer;
    }
    .bigBtn:active{transform: translateY(1px)}
    .bigBtn.sub{
      font-size: 13px;
      font-weight: 800;
      color: var(--sub);
    }

    /* modal */
    .modalBg{
      position:fixed; inset:0;
      background: rgba(0,0,0,.58);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 999;
    }
    .modal{
      width:min(520px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .modal h2{
      margin: 6px 0 6px;
      font-size: 16px;
      letter-spacing:.04em;
    }
    .modal p{margin:0;color:var(--sub);font-size:13px;line-height:1.5}
    .grid3{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .girlCard{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      border-radius: 16px;
      overflow:hidden;
      cursor:pointer;
      transition: transform .06s ease, border-color .15s ease, filter .15s ease;
    }
    .girlCard:active{transform: translateY(1px)}
    .girlCard img{
      width:100%;
      aspect-ratio:1/1;
      object-fit: cover;
      display:block;
      background:#111;
    }
    .girlCard .cap{
      padding: 8px 8px 10px;
      text-align:center;
      font-weight:1000;
      font-size: 12px;
      letter-spacing:.05em;
      color: var(--text);
    }
    .tiny{
      font-size:11px;
      color:var(--sub);
      margin-top:8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">チーと言えばギュウと答える</div>
      <div class="pill">
        <span>ベスト</span><b id="bestStage">—</b>
        <span>／</span>
        <span>到達</span><b id="reachedStage">—</b>
      </div>
    </header>

    <div class="card">
      <div class="imgArea">
        <img id="mainImg" alt="main" src="" />
        <div class="logoOverlay" id="logoOverlay">
          <img src="assets/logo_chi_gyuu.png" alt="logo">
        </div>

        <div class="topBar" id="topBar">
          <div class="badge"><span class="sub">STAGE</span> <span class="val" id="stageLabel">—</span></div>
          <div class="badge"><span class="sub">MODE</span> <span class="val" id="modeLabel">—</span></div>
        </div>

        <div class="bubble" id="bubbleText">読み込み中…</div>
      </div>

      <!-- TOP buttons -->
      <div class="topBtns" id="topBtns">
        <button class="bigBtn" id="btnStartNormal">START（ノーマル）</button>
        <button class="bigBtn" id="btnStartChiMusume">START（チー娘モード）</button>
        <button class="bigBtn sub" id="btnChangeGirl">女の子を選びなおす</button>
      </div>

      <!-- GAME choices -->
      <div class="choices hidden" id="choices">
        <button class="choice" data-choice="yes">はい</button>
        <button class="choice" data-choice="no">いいえ</button>
        <button class="choice" data-choice="chi">チー</button>
        <button class="choice" data-choice="gyu">ギュウ</button>
      </div>

      <div class="footerBtns hidden" id="footerBtns">
        <button class="btn secondary" id="btnBackTop">トップに戻る</button>
        <button class="btn danger hidden" id="btnRetry">もう一回</button>
      </div>
    </div>
  </div>

  <!-- Girl Select Modal -->
  <div class="modalBg hidden" id="girlModal">
    <div class="modal">
      <h2>女の子を選んでね</h2>
      <p>最初は必ず選択。トップからいつでも変更できます。</p>
      <div class="grid3">
        <div class="girlCard" data-girl="A">
          <img src="assets/girlA_icon.png" alt="girlA">
          <div class="cap">girlA</div>
        </div>
        <div class="girlCard" data-girl="B">
          <img src="assets/girlB_icon.png" alt="girlB">
          <div class="cap">girlB</div>
        </div>
        <div class="girlCard" data-girl="C">
          <img src="assets/girlC_icon.png" alt="girlC">
          <div class="cap">girlC</div>
        </div>
      </div>
      <div class="tiny">※ icon は「正方形角丸PNG」をそのまま置けばOK</div>
    </div>
  </div>

  <script>
    /********************
     * 設定
     ********************/
    const LS = {
      girl: "chi_gyu_selected_girl",
      bestStage: "chi_gyu_best_stage",
      reachedStage: "chi_gyu_reached_stage"
    };

    // 採点：あなたの最新指定に合わせて「常に100%チギュテッド」
    // 80〜100のランダムに戻したい場合は "RANDOM_80_100" にするだけ
    const SCORE_MODE = "ALWAYS_100_CHIGYUTED"; // "RANDOM_80_100" / "ALWAYS_100_CHIGYUTED"

    // 問題（確定＋仮）
    const QUESTIONS = [
      "あなたはチー牛ですか？",
      "チーと言えば？",
      "石原さとみさんに「チー」と言われたら？",
      "石原さとみさんに「ギュウ」と言ってもらいたい？",
      "チーズ牛丼を頼んだ人を一瞬だけ見てしまったことはありますか？",
      "知らない人を見て「チー牛かも」と思ってしまったことはありますか？",
      "麻雀には『チーギュウ返し』という技がある。本当だと思いますか？",
      "あなたは三度の飯よりチー牛が好きって本当ですか？",
      "山本由伸選手の「負けると言う選択肢はない」という名言はとてもカッコ良かったですね？",
      "山本由伸選手に「チーズ牛丼を食べないという選択肢はない」と言ってもらいたいですか？",
      "アリストテレスの「すべての者は生まれながらに知恵を求める。」は知っていますか？",
      "チー牛界隈にも「すべての者は生まれながらにチーズ牛丼を求める。」という名言があるのを知っていますか？",
      ...Array.from({length: 45 - 12}, (_,i)=>`（仮）問題 ${i+13}：チーズ牛丼は、うまい。異論はない？`)
    ];

    // 45問目：ギュウ以外は即ゲームオーバー（ここだけ）
    const FINAL_STAGE = 45;

    // 画像命名規則（いまの名前のまま）
    function normalImgPath(girl, n){
      return `assets/girl${girl}_normal_${String(n).padStart(2,"0")}.png`;
    }
    function topImgPath(girl){
      return `assets/girl${girl}_top_01.png`;
    }
    function gameoverImgPath(girl){
      return `assets/girl${girl}_gameover_01.png`;
    }
    function chiGameoverImgPath(girl){
      return `assets/girl${girl}_chi_gameover_01.png`;
    }
    function clearImgPath(girl, n){
      return `assets/girl${girl}_clear_${String(n).padStart(2,"0")}.png`;
    }
    function scoreImgPath(girl, rank, n){
      return `assets/girl${girl}_score_${rank}_${String(n).padStart(2,"0")}.png`;
    }

    /********************
     * 画面要素
     ********************/
    const el = {
      mainImg: document.getElementById("mainImg"),
      bubble: document.getElementById("bubbleText"),
      stageLabel: document.getElementById("stageLabel"),
      modeLabel: document.getElementById("modeLabel"),
      bestStage: document.getElementById("bestStage"),
      reachedStage: document.getElementById("reachedStage"),

      topBtns: document.getElementById("topBtns"),
      choices: document.getElementById("choices"),
      footerBtns: document.getElementById("footerBtns"),

      btnStartNormal: document.getElementById("btnStartNormal"),
      btnStartChiMusume: document.getElementById("btnStartChiMusume"),
      btnChangeGirl: document.getElementById("btnChangeGirl"),

      btnBackTop: document.getElementById("btnBackTop"),
      btnRetry: document.getElementById("btnRetry"),

      logoOverlay: document.getElementById("logoOverlay"),
      topBar: document.getElementById("topBar"),

      girlModal: document.getElementById("girlModal")
    };

    /********************
     * 状態
     ********************/
    const state = {
      screen: "TOP",       // TOP / PLAY / GAMEOVER / CLEAR / SCORE
      mode: "NORMAL",      // NORMAL / CHI_MUSUME
      girl: null,          // A/B/C
      stage: 1,
      lastChoice: null
    };

    function loadSaved(){
      const g = localStorage.getItem(LS.girl);
      if (g) state.girl = g;

      const best = parseInt(localStorage.getItem(LS.bestStage) || "0", 10);
      const reached = parseInt(localStorage.getItem(LS.reachedStage) || "0", 10);
      el.bestStage.textContent = best ? `STAGE ${best}` : "—";
      el.reachedStage.textContent = reached ? `STAGE ${reached}` : "—";
    }

    function saveBestAndReached(){
      const best = parseInt(localStorage.getItem(LS.bestStage) || "0", 10);
      const reached = Math.max(parseInt(localStorage.getItem(LS.reachedStage) || "0", 10), state.stage);
      localStorage.setItem(LS.reachedStage, String(reached));
      if (state.stage > best) localStorage.setItem(LS.bestStage, String(state.stage));
      el.bestStage.textContent = `STAGE ${parseInt(localStorage.getItem(LS.bestStage),10)}`;
      el.reachedStage.textContent = `STAGE ${parseInt(localStorage.getItem(LS.reachedStage),10)}`;
    }

    /********************
     * 時間帯フィルター（画像差し替え無し）
     ********************/
    function getTimeFilter(){
      const h = new Date().getHours();
      // 朝(6-10) / 昼(11-15) / 夕(16-18) / 夜(19-23) / 深夜(0-5)
      if (h >= 6 && h <= 10) return "brightness(1.05) contrast(1.03) saturate(1.05)";
      if (h >= 11 && h <= 15) return "brightness(1.00) contrast(1.00) saturate(1.00)";
      if (h >= 16 && h <= 18) return "brightness(0.98) contrast(1.02) saturate(1.08) sepia(0.08)";
      if (h >= 19 && h <= 23) return "brightness(0.90) contrast(1.05) saturate(0.95) hue-rotate(-8deg)";
      return "brightness(0.82) contrast(1.08) saturate(0.85) hue-rotate(-16deg)";
    }

    function applyFilter(){
      el.mainImg.style.filter = getTimeFilter();
    }

    /********************
     * 画面切り替え
     ********************/
    function showScreen(screen){
      state.screen = screen;

      const isTop = (screen === "TOP");
      const isPlay = (screen === "PLAY");
      const isGameover = (screen === "GAMEOVER");
      const isClear = (screen === "CLEAR");
      const isScore = (screen === "SCORE");

      // TOPはロゴ表示、TOPボタン表示
      el.logoOverlay.classList.toggle("hidden", !isTop);
      el.topBtns.classList.toggle("hidden", !isTop);

      // プレイ中だけ選択肢を表示
      el.choices.classList.toggle("hidden", !isPlay);

      // フッタは TOP以外で表示（GO/クリア/スコア含む）
      el.footerBtns.classList.toggle("hidden", isTop);

      // TOPバーは TOP以外で表示（プレイ/GO/クリア/スコア）
      el.topBar.classList.toggle("hidden", isTop);

      // 「もう一回」はゲームオーバーのみ1秒後表示
      if (isGameover){
        el.btnRetry.classList.add("hidden");
        setTimeout(()=> el.btnRetry.classList.remove("hidden"), 1000);
      } else {
        el.btnRetry.classList.add("hidden");
      }

      render();
    }

    function enableChoices(on){
      document.querySelectorAll("button.choice").forEach(b => b.disabled = !on);
    }

    function randomNormalIndex(){
      return 1 + Math.floor(Math.random() * 15);
    }

    /********************
     * レンダリング
     ********************/
    function render(){
      applyFilter();

      if (!state.girl){
        // 女の子未選択ならTOPで固定
        el.mainImg.src = "assets/start_bg.png";
        el.bubble.innerHTML = "女の子を選んでね";
        el.stageLabel.textContent = "—";
        el.modeLabel.textContent = "—";
        enableChoices(false);
        return;
      }

      if (state.screen === "TOP"){
        el.mainImg.src = "assets/start_bg.png";
        el.bubble.innerHTML = "モードを選んでスタート";
        el.stageLabel.textContent = "—";
        el.modeLabel.textContent = "—";
        enableChoices(false);
        return;
      }

      // 共通表示
      el.stageLabel.textContent = String(state.stage);
      el.modeLabel.textContent = (state.mode === "CHI_MUSUME") ? "CHI" : "NORMAL";

      if (state.screen === "PLAY"){
        // プレイ中：毎回 “普通の顔” をランダム表示
        el.mainImg.src = normalImgPath(state.girl, randomNormalIndex());
        el.bubble.textContent = QUESTIONS[state.stage - 1];
        enableChoices(true);
        return;
      }

      if (state.screen === "GAMEOVER"){
        const isChi = (state.lastChoice === "chi");
        el.mainImg.src = isChi ? chiGameoverImgPath(state.girl) : gameoverImgPath(state.girl);
        el.bubble.innerHTML = "……";
        enableChoices(false);
        return;
      }

      if (state.screen === "CLEAR"){
        el.mainImg.src = clearImgPath(state.girl, 1 + Math.floor(Math.random()*3));
        el.bubble.innerHTML = "クリア";
        enableChoices(false);
        return;
      }

      if (state.screen === "SCORE"){
        // チギュテッド確定（あなたの最新指定）
        const percent = (SCORE_MODE === "RANDOM_80_100")
          ? (80 + Math.floor(Math.random()*21))
          : 100;

        // 画像はSランク固定でもいいし、ランダムでもOK
        // 今はチギュテッド=100%なのでSを使う
        el.mainImg.src = scoreImgPath(state.girl, "s", 1 + Math.floor(Math.random()*3));

        // 特別エンディング（チギュテッド）
        el.bubble.innerHTML =
          `チー牛度 <b style="font-size:20px;letter-spacing:.04em">${percent}%</b><br>` +
          `<small style="margin-top:8px;display:block">チー牛ギフテッド（チギュテッド）</small>` +
          `<small style="margin-top:6px;display:block">（特別エンディング）</small>`;
        enableChoices(false);
        return;
      }
    }

    /********************
     * 女の子選択
     ********************/
    function showGirlSelect(force=false){
      if (!state.girl || force){
        el.girlModal.classList.remove("hidden");
      }
    }
    function hideGirlSelect(){
      el.girlModal.classList.add("hidden");
    }
    function setGirl(g){
      state.girl = g;
      localStorage.setItem(LS.girl, g);
      hideGirlSelect();
      showScreen("TOP");
    }

    document.querySelectorAll(".girlCard").forEach(card=>{
      card.addEventListener("click", ()=> setGirl(card.dataset.girl));
    });

    /********************
     * ゲーム開始・進行
     ********************/
    function start(mode){
      state.mode = mode;
      state.stage = 1;
      state.lastChoice = null;
      showScreen("PLAY");
    }

    function reactText(choice){
      // 「どの選択肢でも反応」：前の感じに寄せて短い一言
      if (choice === "yes") return "うん";
      if (choice === "no")  return "へぇ";
      if (choice === "chi") return "チー…";
      return "ギュウ";
    }

    function onAnswer(choice){
      if (state.screen !== "PLAY") return;

      state.lastChoice = choice;

      // 押したら即リアクション（吹き出しだけ一瞬）
      const qText = QUESTIONS[state.stage - 1];
      el.bubble.textContent = reactText(choice);

      setTimeout(()=>{
        // STAGE45だけ「ギュウ以外は即死」
        if (state.stage === FINAL_STAGE){
          if (choice !== "gyu"){
            // ゲームオーバー
            saveBestAndReached();
            showScreen("GAMEOVER");
            return;
          }
          // クリア→スコア（チギュテッド特別）
          saveBestAndReached();
          showScreen("CLEAR");
          setTimeout(()=> showScreen("SCORE"), 700);
          return;
        }

        // 1〜44は即死しない。普通に次へ。
        state.stage += 1;
        saveBestAndReached();
        showScreen("PLAY");
      }, 380);
    }

    document.querySelectorAll("button.choice").forEach(btn=>{
      btn.addEventListener("click", ()=> onAnswer(btn.dataset.choice));
    });

    /********************
     * ボタン類
     ********************/
    el.btnStartNormal.addEventListener("click", ()=> start("NORMAL"));
    el.btnStartChiMusume.addEventListener("click", ()=> start("CHI_MUSUME"));

    el.btnChangeGirl.addEventListener("click", ()=> showGirlSelect(true));

    el.btnBackTop.addEventListener("click", ()=> showScreen("TOP"));

    el.btnRetry.addEventListener("click", ()=>{
      // 女の子とモードは維持して最初から
      start(state.mode || "NORMAL");
    });

    /********************
     * 起動
     ********************/
    loadSaved();
    if (!state.girl) showGirlSelect(false);
    showScreen("TOP");

    // 念のため：初回TOP表示画像
    if (state.girl){
      el.mainImg.src = "assets/start_bg.png";
      applyFilter();
    }
